# Run the suite on architectures the check matrix never reaches.
#
# r-cmd-check.yml covers CRAN's compilers well and its architectures barely at
# all: everything there is x86_64 glibc. C code has portability bugs the
# compiler cannot see, and they surface as arithmetic that is correct on
# exactly one target.
#
# The two that matter most for a parser:
#
#   32-bit   size_t narrows to 32 bits and pointers halve. Every size and
#            depth bound is arithmetic that behaves differently, and a limit
#            computed as a product can overflow here while being nowhere near
#            the limit on 64-bit. This is the highest-value missing leg.
#
#   musl     A different libc, and the differences bite C parsers
#            specifically: a much smaller default thread stack, stricter
#            printf behaviour on some conversions, no glibc extensions. Code
#            that recurses, or that leans on a glibc-ism without noticing,
#            fails here and nowhere else.
#
# Worth knowing before reaching for the emulation this is assumed to need:
# both of those run *natively* on a GitHub x86-64 runner. Alpine is an
# ordinary amd64 image, and linux/386 is x86 code the same CPU executes
# directly. QEMU is only involved for a non-x86 leg such as aarch64, so the
# expensive part of this workflow is optional and is not where the value is.
#
# Still slow enough to belong on a schedule: these images have no binary
# repository for the package's dependencies, so anything with compiled code is
# built from source inside the container.
on:
  workflow_call:
    inputs:
      skip-docs-only:
        description: >
          Skip every job here when a push or pull request changes
          documentation only: Markdown at the top level or under a dot
          directory (`.github/`, `.agents/`), `_pkgdown.yml`, and `pkgdown/`.
          Anything else runs as before, `man/`, `vignettes/` and the `.md`
          snapshots under `tests/` included. So does every case where the
          changed files cannot be listed: a new branch, a force-push, an API
          failure, a manual or scheduled run. See "Documentation-only
          changes" in the README.
        type: boolean
        required: false
        default: true
      targets:
        description: >
          JSON array of targets. Each entry is

              name      label for the job
              platform  docker platform, e.g. linux/386
              image     container image
              setup     shell command installing R and a toolchain

          The default covers the two legs with the best ratio -- 32-bit and
          musl -- and both of them run without emulation on an x86-64 runner.

          Each default setup installs what an ordinary package's check needs
          beyond R itself. On Debian, the en_US.UTF-8 locale (R CMD check
          sets it and reports a WARNING when the image cannot honour it) and
          libuv1-dev. On Alpine, libuv-dev and linux-headers. fs builds only
          against a system libuv and ps only with the kernel headers, and
          without them nothing above them builds either -- pkgload, testthat,
          sass, rmarkdown -- so a testthat suite cannot run at all.

          aarch64 is deliberately not in the default. It is worth having, and
          it is also the platform a large part of the world now develops on,
          so its bugs tend to be found already -- and it is the leg that
          actually costs QEMU. Add it when a release is near:

              {"name": "aarch64", "platform": "linux/arm64",
               "image": "arm64v8/debian:bookworm",
               "setup": "apt-get update && apt-get install -y --no-install-recommends r-base-dev locales libuv1-dev && echo 'en_US.UTF-8 UTF-8' > /etc/locale.gen && locale-gen"}
        type: string
        required: false
        default: >-
          [{"name": "i386", "platform": "linux/386",
            "image": "i386/debian:bookworm",
            "setup": "apt-get update && apt-get install -y --no-install-recommends r-base-dev locales libuv1-dev && echo 'en_US.UTF-8 UTF-8' > /etc/locale.gen && locale-gen"},
           {"name": "musl", "platform": "linux/amd64",
            "image": "alpine:3.21",
            "setup": "apk add --no-cache R R-dev R-doc build-base linux-headers libuv-dev"}]
      install-dependencies:
        description: >
          Command run inside the container to install the package's
          dependencies, before the check.

          Deliberately plain install.packages rather than pak: these images
          have no binary repository for the package's dependencies, pak buys
          nothing where everything is built from source anyway, and pak itself
          would have to be built first on a platform it publishes no binary
          for.

          Set to "" for a package with no dependencies, which is the case this
          runs fastest in and the case a vendored-C package is often in.

          The default reads Depends, Imports, LinkingTo and Suggests from the
          package's own DESCRIPTION and installs whatever is missing. It fails
          when a hard dependency did not install, and names any suggested
          package that did not, since a Suggests that will not build here
          should not fail the leg (and require-tests catches a missing
          testthat). It used to resolve the package through
          tools::package_dependencies() against installed.packages(), where
          the package is not yet, and so installed nothing at all.
        type: string
        required: false
        default: >-
          Rscript -e 'd <- read.dcf("DESCRIPTION"); dep <- function(fields) { f <- intersect(fields, colnames(d)); x <- trimws(sub("[(].*", "", unlist(strsplit(d[1, f], ",")))); unique(setdiff(x[nzchar(x)], "R")) }; want <- dep(c("Depends", "Imports", "LinkingTo", "Suggests")); need <- setdiff(want, rownames(installed.packages())); cat("dependencies:", want, "\nto install:", need, "\n"); if (length(need)) install.packages(need, repos = "https://cloud.r-project.org"); miss <- setdiff(want, rownames(installed.packages())); if (length(miss)) message("not installed: ", paste(miss, collapse = ", ")); hard <- intersect(miss, dep(c("Depends", "Imports", "LinkingTo"))); if (length(hard)) stop("hard dependencies did not install: ", paste(hard, collapse = ", "))'
      check-args:
        description: >
          Arguments to R CMD check inside the container.

          --as-cran is absent on purpose. This job asks whether the code is
          correct on another architecture, and --as-cran adds policy and URL
          checks that answer nothing new here while adding failure modes that
          have nothing to do with the architecture. r-cmd-check.yml is where
          --as-cran belongs.

          --ignore-vignettes because the tarball is built with
          --no-build-vignettes: checking vignettes that were never built
          reports two WARNINGs for any package that has one, which
          error-on: warning turns into a failure that says nothing about the
          architecture. Whether the vignettes build is r-cmd-check.yml's
          question.
        type: string
        required: false
        default: --no-manual --ignore-vignettes
      error-on:
        description: >
          Lowest R CMD check status that fails the leg: `error`, `warning`
          or `note`.

          R CMD check itself exits non-zero only on an ERROR, so before this
          input a leg ending `Status: 1 WARNING` was green -- which is how a
          32-bit leg reported a warning for weeks without anyone reading it.
          `error` keeps that behaviour and is the default, so existing callers
          are unchanged; `warning` is the setting worth having.
        type: string
        required: false
        default: error
      require-tests:
        description: >
          Fail the leg unless the check ran at least one passing testthat
          expectation, counted from the `[ FAIL n | WARN n | SKIP n | PASS n ]`
          summaries in <pkg>.Rcheck/tests/*.Rout.

          A package whose tests/testthat.R guards library(testthat) with
          requireNamespace() -- as it must, for CRAN's no-Suggests check --
          skips its whole suite in a container where testthat is not
          installed, and R CMD check reports that as a pass. This makes that
          case red instead of a vacuous green. testthat only; off by default.
        type: boolean
        required: false
        default: false
      timeout-minutes:
        description: >
          Per-target timeout. Dependencies are built from source in these
          containers, and an emulated leg multiplies that by roughly ten.
        type: number
        required: false
        default: 120

name: arch

# Nothing here writes through the token, so `contents: read` is enough: the
# job reads the checkout, and artifact upload, the cache and a public ghcr.io
# image each need no declared scope.
#
# This is not only least privilege. `read-all` is wider than the `read` that a
# repository hands its GITHUB_TOKEN by default, and a called workflow cannot
# be granted more than its caller holds -- so requesting it here made every
# caller that did not declare permissions of its own fail with an unannotated
# `startup_failure`, two seconds in, before any job was created.
permissions:
  contents: read

jobs:
  # Skips the jobs below when a push or pull request changes documentation
  # only; see the `skip-docs-only` input. Every workflow it gates carries an
  # identical copy -- inline for the reason sanitizers.yml gives for not
  # factoring out a composite action -- and tests/lint-workflows.py keeps the
  # copies identical and the wiring complete.
  #
  # The gated jobs test `!cancelled()` in place of the implicit `success()`,
  # so this job failing, or being skipped, runs them rather than dropping
  # them. Only an explicit `docs-only=true` skips anything.
  changes:
    name: docs-only gate
    if: inputs.skip-docs-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Classify the changed files
        id: classify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
        run: |
          # Anything short of a complete list of changed files, every one of
          # them documentation, leaves this false and every job runs.
          docs_only=false
          trap 'echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"' EXIT

          case "$EVENT" in
            pull_request|pull_request_target)
              base=$PR_BASE head=$PR_HEAD ;;
            push)
              # `before` is all zeros for a new branch, and after a
              # force-push it may no longer exist.
              if [ "$FORCED" = true ] || [ -z "${BEFORE//0/}" ]; then
                echo "New branch or force-push: no diff to go by, so everything runs."
                exit 0
              fi
              base=$BEFORE head=$AFTER ;;
            *)
              echo "A $EVENT run has no changed files to go by, so everything runs."
              exit 0 ;;
          esac

          # The compare API rather than the pull request's file list, which
          # would need `pull-requests: read`: a scope the caller may not hold,
          # and asking for one is a startup_failure. Three dots diff from the
          # merge base, which for a pull request is exactly what it changes,
          # from its first commit on.
          if ! files=$(gh api "repos/$REPO/compare/$base...$head" \
                         --jq '(.files // []) | length, .[].filename'); then
            echo "Could not list the changed files, so everything runs."
            exit 0
          fi

          # compare lists at most 300 files and truncates silently past that.
          count=$(head -n 1 <<<"$files")
          if ! [[ $count =~ ^[0-9]+$ ]] || [ "$count" -eq 0 ] || [ "$count" -ge 300 ]; then
            echo "Cannot rely on a list of '$count' changed files, so everything runs."
            exit 0
          fi

          # Markdown in `tests/` is not documentation -- testthat snapshots
          # and fixtures are .md -- and neither is Markdown under `fuzz/` or
          # `inst/`, so .md counts only at the top level or under a dot
          # directory, which a package does not ship.
          all_docs=true
          while IFS= read -r f; do
            case "$f" in
              _pkgdown.yml|_pkgdown.yaml|pkgdown/*) kind=docs ;;
              .*/*.md) kind=docs ;;
              */*) kind=code ;;
              *.md) kind=docs ;;
              *) kind=code ;;
            esac
            printf '%-5s %s\n' "$kind" "$f"
            [ "$kind" = docs ] || all_docs=false
          done < <(tail -n +2 <<<"$files")

          if [ "$all_docs" = true ]; then
            docs_only=true
            echo "Documentation only: the jobs in this workflow are skipped." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  arch:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.targets) }}

    name: ${{ matrix.target.name }}

    steps:
      - uses: actions/checkout@v7

      # Only for a leg the host cannot execute itself. linux/386 is x86 code
      # on an x86-64 CPU and linux/amd64 is the host, so registering QEMU for
      # either is setup time bought for nothing.
      - name: Set up QEMU
        if: ${{ !startsWith(matrix.target.platform, 'linux/amd64') && !startsWith(matrix.target.platform, 'linux/386') }}
        uses: docker/setup-qemu-action@v4

      - name: Check on ${{ matrix.target.name }}
        env:
          PLATFORM: ${{ matrix.target.platform }}
          IMAGE: ${{ matrix.target.image }}
          SETUP: ${{ matrix.target.setup }}
          INSTALL_DEPS: ${{ inputs.install-dependencies }}
          CHECK_ARGS: ${{ inputs.check-args }}
          ERROR_ON: ${{ inputs.error-on }}
          REQUIRE_TESTS: ${{ inputs.require-tests }}
        run: |
          set -eu
          # Written outside the workspace and mounted separately. A stray
          # file at the top level of the package directory is one R CMD check
          # reports as a non-standard file, so a helper script left in the
          # checkout would make this leg fail on itself.
          mkdir -p "${RUNNER_TEMP}/arch"
          cat > "${RUNNER_TEMP}/arch/run.sh" <<'SCRIPT'
          set -eu
          cd /pkg

          echo "----- platform -----"
          uname -m
          echo "----- R -----"
          R --version | head -1
          # The leg is only worth anything if it really is the architecture it
          # claims to be, so this is printed rather than assumed. A 32-bit leg
          # that silently ran 64-bit R would pass and mean nothing -- the same
          # argument the nold and nosuggests jobs make with their own probes.
          Rscript -e 'cat("pointer size:", .Machine$sizeof.pointer, "bytes\n"); cat("integer max:", .Machine$integer.max, "\n")'

          if [ -n "${INSTALL_DEPS}" ]; then
            echo "----- dependencies -----"
            sh -c "${INSTALL_DEPS}"
          fi

          echo "----- build -----"
          R CMD build --no-build-vignettes --no-manual .
          tarball=$(ls -t ./*.tar.gz | head -1)

          echo "----- check -----"
          # Suggests are not forced: these images have no binaries, and a
          # suggested package that will not build here would fail the leg for
          # a reason that is not about the architecture.
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check ${CHECK_ARGS} "${tarball}"

          # R CMD check exits non-zero only on an ERROR. Read its verdict.
          rcheck=$(ls -d ./*.Rcheck | head -1)
          status=$(grep '^Status:' "${rcheck}/00check.log" | tail -1 || true)
          echo "----- verdict -----"
          echo "${status:-no Status line}"
          case "${ERROR_ON}" in
            error) ;;
            warning)
              if echo "${status}" | grep -q 'WARNING'; then
                echo "error-on: warning, and the check ended with a WARNING" >&2
                exit 1
              fi ;;
            note)
              if echo "${status}" | grep -Eq 'WARNING|NOTE'; then
                echo "error-on: note, and the check ended with a WARNING or NOTE" >&2
                exit 1
              fi ;;
            *) echo "unknown error-on value: ${ERROR_ON}" >&2; exit 1 ;;
          esac

          if [ "${REQUIRE_TESTS}" = "true" ]; then
            passed=0
            for rout in "${rcheck}"/tests/*.Rout; do
              [ -f "${rout}" ] || continue
              n=$(sed -n 's/.*| PASS \([0-9][0-9]*\) \].*/\1/p' "${rout}" | tail -1)
              passed=$((passed + ${n:-0}))
            done
            echo "passing expectations: ${passed}"
            if [ "${passed}" -eq 0 ]; then
              echo "require-tests: no passing testthat expectation ran; is testthat installed in this image?" >&2
              exit 1
            fi
          fi
          SCRIPT

          docker run --rm \
            --platform "${PLATFORM}" \
            -v "${GITHUB_WORKSPACE}:/pkg" \
            -v "${RUNNER_TEMP}/arch:/arch:ro" \
            -w /pkg \
            -e INSTALL_DEPS="${INSTALL_DEPS}" \
            -e CHECK_ARGS="${CHECK_ARGS}" \
            -e ERROR_ON="${ERROR_ON}" \
            -e REQUIRE_TESTS="${REQUIRE_TESTS}" \
            "${IMAGE}" \
            sh -c "${SETUP} && sh /arch/run.sh"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arch-${{ matrix.target.name }}
          path: |
            *.Rcheck/00check.log
            *.Rcheck/00install.out
          if-no-files-found: ignore
