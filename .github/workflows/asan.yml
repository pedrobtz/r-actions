on:
  workflow_call:
    inputs:
      containers:
        description: >
          JSON array of R-hub sanitizer container names to run in. The
          defaults are the two AddressSanitizer images; `clang-ubsan` also
          works here and overlaps with sanitizers.yml, which runs UBSan on an
          ordinary runner instead.

          Names come from https://r-hub.github.io/containers/.
        type: string
        required: false
        default: '["clang-asan", "gcc-asan"]'
      run:
        description: >
          Shell command to run after the package is installed, instead of
          `R CMD check`.

          Worth knowing before you reach for it: `R CMD check` in these images
          builds every Suggests dependency from source under the sanitizer,
          which is slow and occasionally fails for reasons that have nothing
          to do with your package. A small driver script that exercises the
          compiled code with base R only -- error paths especially -- runs in
          a minute and is what the sanitizer actually cares about.

          Whatever it prints is scanned for sanitizer diagnostics, and a
          non-zero exit fails the job.
        type: string
        required: false
        default: ""
      dependencies:
        description: >
          Install the package's dependencies before building. Turn it off for
          a package with none, or when `run` needs nothing but base R: under
          ASan every dependency is compiled instrumented, which is the slowest
          part of this job by a wide margin.
        type: boolean
        required: false
        default: true
      env:
        description: >
          Extra environment variables for the run step, one NAME=VALUE per
          line.

          Do not put secrets here: workflow inputs are not masked in logs.
        type: string
        required: false
        default: ""
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        required: false
        default: 60

name: asan

permissions: read-all

jobs:
  # AddressSanitizer, in the R-hub containers -- which is the one place it
  # works for an R package.
  #
  # sanitizers.yml deliberately does not do this, and its reasoning is right
  # for the runner it targets: a package .so is dlopen'd into an R that is not
  # itself instrumented, so ASan needs -shared-libasan, the runtime preloaded
  # into R, and detect_leaks=0, and half-configured it finds nothing.
  #
  # These images have already done all three, which is the whole point of
  # using them:
  #
  #   clang-asan   R itself is a `devel-asan` build, so the interpreter is
  #                instrumented and interceptors are installed from process
  #                start.
  #   gcc-asan     libasan and libubsan are LD_PRELOADed from inside the
  #                `R` and `Rscript` wrapper scripts, with
  #                ASAN_OPTIONS='detect_leaks=0' set in the image.
  #
  # Their R also compiles packages with -fsanitize=address,undefined out of
  # its own Makeconf, so this job passes no sanitizer flags of its own. That
  # is worth stating because it is the opposite of sanitizers.yml, where
  # getting the flags into ~/.R/Makevars is the hard part.
  #
  # "Half-configured it finds nothing" is not hypothetical, and it is why the
  # verification step below exists rather than trusting the image.
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(inputs.containers) }}

    name: ${{ matrix.container }}

    container:
      image: ghcr.io/r-hub/containers/${{ matrix.container }}:latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: inputs.dependencies
        run: |
          set -eu
          Rscript -e 'if (length(pak::local_deps(".")$ref) > 1) pak::local_install_deps(".", upgrade = FALSE)'

      # --preclean matters. An object file left in src/ by an earlier build --
      # a local pkgload run committed by accident, or a previous step here --
      # is reused if it is newer than its source, and the sanitizer flags then
      # reach only the link step. The result is a green job on a build with no
      # instrumentation in it.
      - name: Install the package
        run: |
          set -eu
          mkdir -p "${GITHUB_WORKSPACE}/lib"
          R CMD INSTALL --preclean --library="${GITHUB_WORKSPACE}/lib" .

      # Verify the detector is in the installed object rather than trusting
      # that the image was configured as documented. This is the check whose
      # absence turns "no diagnostics" into "nothing was watching".
      #
      # A package with no compiled code has nothing to instrument and says so.
      - name: Verify instrumentation
        run: |
          set -eu
          if [ ! -d src ]; then
            echo "No src/ directory: nothing to instrument."
            exit 0
          fi
          found=0
          for so in "${GITHUB_WORKSPACE}"/lib/*/libs/*.so; do
            [ -e "$so" ] || continue
            found=1
            echo "== $so"
            # Dynamic and full symbol tables both: the runtime may be linked
            # shared (handlers undefined, resolved at load) or static
            # (handlers defined in the object).
            if { nm -D "$so" 2>/dev/null; nm "$so" 2>/dev/null; } \
                 | grep -q '__asan'; then
              echo "   ok: ASan runtime is referenced"
            else
              echo "   FAIL: no __asan* symbols; the build was not instrumented" >&2
              echo "   The image's R is expected to compile packages with" >&2
              echo "   -fsanitize=address from its own Makeconf. Check that a" >&2
              echo "   package-level src/Makevars is not overriding CFLAGS." >&2
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No shared object was installed; nothing to verify." >&2
            exit 1
          fi

      # Passed through the environment rather than interpolated into the
      # script: a caller's value is data, and `${{ }}` in a run block is
      # substituted before the shell ever sees it, so a quote or a backtick
      # would change the program rather than the string.
      - name: Apply caller environment
        if: inputs.env != ''
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -eu
          printf '%s\n' "$CALLER_ENV" | while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
              *) echo "Ignoring malformed env line: $line" >&2 ;;
            esac
          done

      # ASan aborts the process on a memory error, so a failure here is
      # usually a non-zero exit. The grep is for the cases where it is not:
      # a diagnostic printed by a subprocess R CMD check treats as a mere
      # test failure, or a UBSan finding from the same build, which by
      # default prints and carries on.
      #
      # `|| status=$?` rather than letting the shell abort, so the log is
      # always printed before the job ends -- a sanitizer job whose output
      # was swallowed is a job that taught nobody anything.
      - name: Run under the sanitizer
        env:
          R_LIBS: ${{ github.workspace }}/lib
          UBSAN_OPTIONS: print_stacktrace=1
          RUN_COMMAND: ${{ inputs.run }}
        run: |
          set -u
          status=0
          if [ -n "$RUN_COMMAND" ]; then
            sh -c "$RUN_COMMAND" > sanitizer.log 2>&1 || status=$?
          else
            R CMD build --no-build-vignettes --no-manual . > sanitizer.log 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then
              tarball=$(ls -t ./*.tar.gz | head -1)
              R CMD check --no-manual --no-build-vignettes "$tarball" \
                >> sanitizer.log 2>&1 || status=$?
              for out in ./*.Rcheck/*.Rout ./*.Rcheck/*.Rout.fail \
                         ./*.Rcheck/tests/*.Rout ./*.Rcheck/tests/*.Rout.fail; do
                [ -e "$out" ] || continue
                echo "----- $out -----" >> sanitizer.log
                cat "$out" >> sanitizer.log
              done
            fi
          fi
          cat sanitizer.log
          if grep -qE "AddressSanitizer|LeakSanitizer|runtime error:|SUMMARY: .*Sanitizer" sanitizer.log; then
            echo "::error::sanitizer reported a problem"
            exit 1
          fi
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asan-${{ matrix.container }}
          path: sanitizer.log
          if-no-files-found: ignore
