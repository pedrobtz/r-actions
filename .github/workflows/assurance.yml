# Checks a package's `.agents/assurance.md` against the portfolio standard.
#
# The standard is pedrobtz/packages:claude/shared/assurance.md: what a
# package must check, by the kinds of package it declares. The package says
# how it meets that in `.agents/assurance.md`, from
# pedrobtz/packages:templates/assurance.md. This job holds the file to it:
#
#   * every kind is one the standard knows;
#   * every check the kinds require has a row, marked `done`, `gap #N` or
#     `n/a: reason`;
#   * a `done` names a workflow under .github/workflows/ that calls the
#     r-actions workflow of that name, or says `(own)`;
#   * the tables the kinds require are there and not empty;
#   * every Boundaries row names an oracle, and "no crash" is not one;
#   * every cell is a fact, a `gap #N` or an `n/a: reason`, never blank.
#
# A second step holds the package's own workflows to ci.md's gating rule:
# every job a pull request starts either calls an r-actions workflow (which
# gates itself), or is wired to the `changes` gate and skips a
# documentation-only change, or says why not with `# ungated: <reason>` on
# the line above its key. pkgdown and coverage are exempt, as ci.md says a
# documentation change still runs them, and so are jobs whose `if:` admits
# only events other than pull_request. `paths-ignore` is a finding: ci.md
# gates through changes.yml. `ungated-jobs: warn` (the default, for now)
# annotates and summarises; `fail` fails the job.
#
# A tracked gap passes. The file is meant to say what is not covered yet,
# and an issue that says so is the point. What fails is a claim nothing
# backs, or a gap nobody filed.
#
# The check is the Python in the one step below. pedrobtz/packages' weekly
# audit takes it from this file and runs it against every package, so the
# portfolio view and each package's CI cannot disagree.
on:
  workflow_call:
    inputs:
      file:
        description: The assurance file, relative to the repository root.
        type: string
        required: false
        default: .agents/assurance.md
      ungated-jobs:
        description: >
          `warn` annotates jobs that run on a documentation-only pull request
          without saying why; `fail` fails on them.
        type: string
        required: false
        default: warn

name: assurance

permissions:
  contents: read

jobs:
  assurance:
    name: assurance file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check the assurance file
        id: check
        env:
          ASSURANCE_FILE: ${{ inputs.file }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          # The standard's kinds, and the checks each requires, in the order
          # the standard lists them. A change to the standard changes these.
          REQUIRED = {
              "compiled": ["sanitizers", "valgrind", "rchk", "gctorture",
                           "analyzers", "alloc-failure", "mutation"],
              "untrusted-input": ["fuzz", "fuzz-reach"],
              "spec": [],
              "lifecycle": [],
              "emits": [],
          }
          # The r-actions workflow a `done` row must call. fuzz-reach is a
          # step of fuzz.yml.
          WORKFLOW = {c: f"{c}.yml" for k in REQUIRED.values() for c in k}
          WORKFLOW["fuzz-reach"] = "fuzz.yml"
          TABLES = {
              "Boundaries": {"untrusted-input", "spec", "emits"},
              "Objects": {"lifecycle"},
          }

          path = pathlib.Path(os.environ.get("ASSURANCE_FILE") or ".agents/assurance.md")
          wfdir = pathlib.Path(".github/workflows")
          errors = []

          def err(msg):
              errors.append(msg)

          if not path.is_file():
              print(f"::error::{path} does not exist. Copy "
                    "pedrobtz/packages templates/assurance.md and fill it in.")
              sys.exit(1)

          # Sections by `## ` heading. A table's first row is its header and
          # its second the separator; the rest are cells.
          sections, tables, current = {}, {}, None
          for line in path.read_text().splitlines():
              m = re.match(r"^## +(.+?)\s*$", line)
              if m:
                  current = m.group(1)
                  sections[current] = []
                  tables[current] = []
                  continue
              if current is None:
                  continue
              sections[current].append(line)
              if line.lstrip().startswith("|"):
                  cells = [c.strip() for c in line.strip().strip("|").split("|")]
                  if all(re.fullmatch(r":?-+:?", c) for c in cells):
                      continue
                  tables[current].append(cells)
          rows = {k: v[1:] for k, v in tables.items()}   # drop the header

          GAP = re.compile(r"^gap #\d+\b")
          NA = re.compile(r"^n/a: *\S")

          def cell_ok(where, text):
              if not text:
                  err(f"{where}: empty; write the fact, `gap #<issue>` or `n/a: <reason>`")
              elif text.startswith("gap") and not GAP.match(text):
                  err(f"{where}: `{text}` is a gap without an issue; write `gap #<issue>`")
              elif text.startswith("n/a") and not NA.match(text):
                  err(f"{where}: `{text}` needs a reason, `n/a: <reason>`")

          # Kinds.
          kinds = re.findall(r"`([^`]+)`", "\n".join(sections.get("Kinds", [])))
          if not kinds:
              err("## Kinds: none declared")
          for k in kinds:
              if k not in REQUIRED:
                  err(f"## Kinds: `{k}` is not a kind the standard knows "
                      f"({', '.join(REQUIRED)})")
          kinds = [k for k in kinds if k in REQUIRED]

          # Required checks.
          checks = {}
          for r in rows.get("Required checks", []):
              r = (r + ["", "", ""])[:3]
              checks[r[0]] = r
          for k in kinds:
              for c in REQUIRED[k]:
                  if c not in checks:
                      err(f"## Required checks: no row for `{c}`, which `{k}` requires")
          for c, (_, status, where) in checks.items():
              label = f"## Required checks: `{c}`"
              if status == "done":
                  name = where.split()[0] if where.split() else ""
                  wf = wfdir / name
                  if not name or not wf.is_file():
                      err(f"{label}: `done`, but `{where}` is not a file under {wfdir}/")
                  elif "(own)" not in where and c in WORKFLOW:
                      want = f"pedrobtz/r-actions/.github/workflows/{WORKFLOW[c]}@"
                      if want not in wf.read_text():
                          err(f"{label}: `done`, but {wf} does not call "
                              f"{WORKFLOW[c]}; call it, or mark the row `(own)`")
              else:
                  cell_ok(f"{label} status", status)
                  if status and not (GAP.match(status) or NA.match(status)):
                      err(f"{label}: status `{status}` is not `done`, "
                          "`gap #<issue>` or `n/a: <reason>`")

          # The tables the kinds require, and every row of every table.
          for table, need in TABLES.items():
              if need & set(kinds) and not rows.get(table):
                  err(f"## {table}: required by "
                      f"`{'`, `'.join(sorted(need & set(kinds)))}`, and empty")
          for table in ("Boundaries", "Objects", "Limits"):
              header = (tables.get(table) or [[]])[0]
              for i, r in enumerate(rows.get(table, []), 1):
                  r = r + [""] * (len(header) - len(r))
                  for col, text in zip(header, r):
                      cell_ok(f"## {table} row {i} ({r[0] or '?'}), {col}", text)
                  if table == "Boundaries" and len(r) > 1:
                      if re.search(r"no crash|^none$|^-$|^(line |branch )?coverage", r[1], re.I):
                          err(f"## Boundaries row {i} ({r[0]}): `{r[1]}` is "
                              "not an oracle; it must know the answer")

          for e in errors:
              print(f"::error file={path}::{e}")
          print(f"{path}: kinds {' '.join(kinds) or '(none)'}; "
                f"{len(checks)} required-check rows, "
                f"{sum(1 for r in checks.values() if GAP.match(r[1]))} tracked gaps; "
                f"{len(errors)} problems")
          sys.exit(1 if errors else 0)
          PY

      - name: Check the package's own workflows are gated (ci.md)
        id: gating
        if: ${{ !cancelled() }}
        env:
          UNGATED_JOBS: ${{ inputs.ungated-jobs }}
        run: |
          python3 -m venv /tmp/gating >/dev/null
          /tmp/gating/bin/pip install --quiet pyyaml
          /tmp/gating/bin/python - <<'PY'
          import os, pathlib, re, sys
          import yaml

          mode = os.environ.get("UNGATED_JOBS") or "warn"
          if mode not in ("warn", "fail"):
              print(f"::error::ungated-jobs must be warn or fail, not {mode!r}")
              sys.exit(1)
          GATE = "needs.changes.outputs.docs-only != 'true'"
          SKIPPED = "needs.changes.result != 'skipped'"
          # ci.md: a documentation-only change still runs coverage and pkgdown.
          EXEMPT = {"pkgdown", "coverage"}
          findings = []

          for wf in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              if wf.stem in EXEMPT:
                  continue
              text = wf.read_text()
              try:
                  doc = yaml.safe_load(text) or {}
              except yaml.YAMLError as e:
                  findings.append((wf, None, f"does not parse: {e}"))
                  continue
              on = doc.get("on", doc.get(True)) or {}   # YAML reads `on` as True
              if isinstance(on, str):
                  on = {on: None}
              elif isinstance(on, list):
                  on = {k: None for k in on}
              if "pull_request" not in on:
                  continue
              pr = on.get("pull_request") or {}
              if isinstance(pr, dict) and "paths-ignore" in pr:
                  findings.append((wf, None, "gates with `paths-ignore`; call "
                                   "changes.yml and test its `docs-only` output (ci.md)"))
                  continue
              if isinstance(pr, dict) and "paths" in pr:
                  continue          # runs only when the files it names change
              lines = text.splitlines()
              # A label gate on `changes` (ci.md) is decided without a runner;
              # when it skips, docs-only is empty, so a job testing only
              # `!= 'true'` would run on the very pull requests it skipped.
              chg = (doc.get("jobs") or {}).get("changes")
              chg_gated = isinstance(chg, dict) and "if" in chg
              for job, body in (doc.get("jobs") or {}).items():
                  if not isinstance(body, dict):
                      continue
                  if "pedrobtz/r-actions/.github/workflows/" in str(body.get("uses", "")):
                      continue      # gated inside, and changes.yml is the gate
                  cond = str(body.get("if", ""))
                  if "github.event_name" in cond and "pull_request" not in cond:
                      continue      # never runs on a pull request
                  needs = body.get("needs")
                  needs = [needs] if isinstance(needs, str) else (needs or [])
                  if "changes" in needs and GATE in cond:
                      if chg_gated and SKIPPED not in cond:
                          at = next((i for i, l in enumerate(lines)
                                     if re.match(rf"^  {re.escape(str(job))}:\s*(#.*)?$", l)), None)
                          findings.append((wf, at, f"job `{job}` runs when the label-gated "
                                           "`changes` job is skipped: add `" + SKIPPED +
                                           " &&` to its `if:` (ci.md)"))
                      continue
                  at = next((i for i, l in enumerate(lines)
                             if re.match(rf"^  {re.escape(str(job))}:\s*(#.*)?$", l)), None)
                  near = " ".join(lines[max(0, at - 1):at + 1]) if at is not None else ""
                  if re.search(r"#\s*ungated:\s*\S", near):
                      continue
                  findings.append((wf, at, f"job `{job}` runs on a documentation-only "
                                   "pull request: give it `needs: changes` and `if: "
                                   "$" "{{ !cancelled() && needs.changes.outputs.docs-only "
                                   "!= 'true' }}`, or say why with `# ungated: <reason>` "
                                   "above it (ci.md)"))

          level = "error" if mode == "fail" else "warning"
          for wf, at, msg in findings:
              line = f",line={at + 1}" if at is not None else ""
              print(f"::{level} file={wf}{line}::{msg}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary and findings:
              with open(summary, "a") as f:
                  f.write(f"### Ungated jobs ({len(findings)}, {mode})\n\n")
                  for wf, at, msg in findings:
                      f.write(f"- `{wf.name}`: {msg}\n")
          print(f"{len(findings)} ungated jobs ({mode})")
          sys.exit(1 if findings and mode == "fail" else 0)
          PY
