on:
  workflow_call:
    inputs:
      native:
        description: >
          Also run the `native` job: line and branch coverage of the C in
          src/, through gcov, reported separately from the covr number.

          covr measures R code. For a package that is mostly a C parser
          behind a thin R wrapper, that number can look excellent while large
          parts of the C are never executed by any test -- and a .covrignore
          excluding the vendored sources, which is the right call for a
          badge, leaves the question unanswered rather than answering it.

          Off by default: it needs compiled code, and it is a second full
          build and test run.
        type: boolean
        required: false
        default: false
      native-run:
        description: >
          Shell command that exercises the package for the `native` job,
          instead of running each file in tests/ with Rscript.

          The default runs the test suite the way R CMD check does, which is
          usually what you want. Reach for this when coverage should reflect
          something else -- a conformance corpus, a replay driver -- or when
          the suite needs a harness of its own. R_LIBS already points at the
          instrumented install.
        type: string
        required: false
        default: ""
      native-exclude:
        description: >
          Paths to leave out of the native coverage report, one per line,
          matched as in vendor.yml: an entry with no glob character is a
          directory prefix, anything else is a glob.

          Empty by default, and that default is deliberate. The interesting
          question about a vendored parser is precisely how much of the part
          you actually call is reached, and excluding it by reflex is how
          that question stays unanswered.
        type: string
        required: false
        default: ""

name: coverage

# No workflow-level `permissions` block, deliberately: the two jobs need
# different tokens and say so individually. A default here would be a third
# thing to keep in sync with them, and the one that governs any job that
# forgets to declare its own.
#
# The caller still grants `contents: write`, because a reusable workflow's
# token is capped by the caller's grant -- that is the ceiling, and the job
# blocks below are what each job actually gets.

jobs:
  # Runs the caller's test suite, and therefore the caller's dependencies,
  # under a read-only token. This is the whole reason the badge lives in a
  # separate job: covr executes arbitrary package code by design, and it has
  # no reason to do it while holding a token that can push to main.
  coverage:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      pct: ${{ steps.coverage.outputs.pct }}
      color: ${{ steps.coverage.outputs.color }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::covr

      - name: Run coverage
        id: coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          pct <- covr::percent_coverage(cov)
          # Emitted as hex rather than as a colour name, because the renderer
          # downstream is now a template in this repository and not a tool
          # with a colour vocabulary. These are badgen's own values, so the
          # badge does not change appearance on the commit that removed it.
          color <-
            if (pct >= 90) "#3C1" else
            if (pct >= 75) "#DB1" else
            if (pct >= 60) "#F73" else "#E43"
          cat(sprintf("pct=%.1f\n", pct), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          cat(sprintf("color=%s\n", color), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)

          df <- as.data.frame(cov)
          files <- sort(unique(df$filename))
          rows <- vapply(files, function(f) {
            sub_df <- df[df$filename == f, ]
            total   <- nrow(sub_df)
            covered <- sum(sub_df$value > 0)
            file_pct <- if (total > 0) 100 * covered / total else 0
            sprintf("| `%s` | %d | %d | %.1f%% |", f, total, covered, file_pct)
          }, character(1))

          md <- c(
            "## Coverage",
            "",
            sprintf("**Overall: %.1f%%**", pct),
            "",
            "| File | Expressions | Covered | Coverage |",
            "|:-----|------------:|--------:|---------:|",
            rows
          )
          writeLines(md, Sys.getenv("GITHUB_STEP_SUMMARY"))

  # The only job here that can write to the caller's repository, and it runs
  # nothing but git and a heredoc.
  badge:
    needs: coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Rendered here rather than fetched.
      #
      # This step used to be `npx badgen-cli`, with no version: the package
      # was resolved against the npm registry at job start, and its contents
      # ran in the one job holding a token that can push to a caller's
      # default branch. Nothing recorded which version had run. Pinning the
      # version would have fixed the resolution and kept both the network
      # call and the trust; the badge is a fixed SVG with two substitutions,
      # so it was cheaper to stop depending on anything at all. It also takes
      # Node off this job's critical path.
      #
      # The geometry is badgen's, reproduced rather than reinvented, so the
      # badge does not visibly change on the commit that removed the
      # dependency: box widths, viewBox and colours are identical to what
      # `badgen-cli --subject covr` emitted, checked against it across the
      # range of percentages. The one deliberate difference is that the
      # status label is centred in its box, where badgen places it half a
      # pixel to the left of centre.
      #
      # Coordinates are in tenths of a pixel -- a 10x viewBox scaled down by
      # the width and height attributes -- which is how badgen keeps its
      # arithmetic in integers, and how this step can too.
      #
      # `textLength` is the part worth understanding. It makes the renderer
      # fit the glyphs to exactly the declared width, so the box width and
      # the text width cannot disagree: an estimate that is slightly off
      # shows up as very slightly tighter or looser letter spacing rather
      # than as text clipped by its box or floating off-centre in it. That
      # is what makes it safe to size text here without a font metrics table.
      #
      # The two remaining numbers are measured from Verdana at this size, and
      # only need to hold for the strings actually used. The subject is
      # always "covr", so its width is the constant badgen computes for it.
      # The status is always digits, one point and a percent sign.
      - name: Render badge
        env:
          PCT: ${{ needs.coverage.outputs.pct }}
          COLOR: ${{ needs.coverage.outputs.color }}
        run: |
          set -eu
          mkdir -p .github/badges

          subject="covr"
          status="${PCT}%"

          # Per-glyph widths in tenths of a pixel: digit, point, percent.
          digits=$(printf '%s' "$PCT" | tr -cd '0-9' | wc -c | tr -d ' ')
          points=$(printf '%s' "$PCT" | tr -cd '.'   | wc -c | tr -d ' ')
          st=236                                       # "covr", measured
          vt=$(( digits * 70 + points * 40 + 120 ))

          # 50 of padding on each side of each label.
          sw=$(( st + 100 ))
          vw=$(( vt + 100 ))
          total=$(( sw + vw ))

          # The width attribute is the viewBox scaled back down, and is the
          # one number here that is not an integer.
          width=$(printf '%d.%d' $(( total / 10 )) $(( total % 10 )))

          cat > .github/badges/coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="20" viewBox="0 0 ${total} 200" role="img" aria-label="${subject}: ${status}">
          <title>${subject}: ${status}</title>
          <linearGradient id="gradient" x2="0" y2="100%">
          <stop offset="0" stop-opacity=".1" stop-color="#EEE"/>
          <stop offset="1" stop-opacity=".1"/>
          </linearGradient>
          <mask id="round"><rect width="${total}" height="200" rx="30" fill="#FFF"/></mask>
          <g mask="url(#round)">
          <rect width="${sw}" height="200" fill="#555"/>
          <rect x="${sw}" width="${vw}" height="200" fill="${COLOR}"/>
          <rect width="${total}" height="200" fill="url(#gradient)"/>
          </g>
          <g aria-hidden="true" text-anchor="start" font-family="Verdana,DejaVu Sans,sans-serif" font-size="110">
          <text x="60" y="148" textLength="${st}" fill="#000" opacity="0.25">${subject}</text>
          <text x="50" y="138" textLength="${st}" fill="#fff">${subject}</text>
          <text x="$(( sw + 60 ))" y="148" textLength="${vt}" fill="#000" opacity="0.25">${status}</text>
          <text x="$(( sw + 50 ))" y="138" textLength="${vt}" fill="#fff">${status}</text>
          </g>
          </svg>
          EOF

          cat .github/badges/coverage.svg

      - name: Commit coverage badge
        env:
          PCT: ${{ needs.coverage.outputs.pct }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          if git diff --staged --quiet; then
            echo "Coverage badge unchanged (${PCT}%)."
          else
            git commit -m "Update coverage badge (${PCT}%)"
            git push
          fi

  # Line and branch coverage of the C, which is a different question from
  # the one covr answers.
  #
  # Branch coverage is the number that matters here, and it is the one covr
  # does not report. A parser's error handling is overwhelmingly
  # `if (err) goto fail;`: the line executes on the happy path, the branch
  # does not. "The emitter's error paths are tested" and "the emitter's error
  # paths have never once executed" look identical in a line-coverage number
  # and are the whole difference in a branch one.
  #
  # Reported, never gated, and deliberately not a badge. A low figure on a
  # vendored file may be entirely correct -- a bundled library carries
  # modules the package never calls and cannot drop from the tarball. This
  # number wants reading, not defending.
  native:
    if: inputs.native
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - name: Nothing to measure without C
        id: probe
        run: |
          set -eu
          if [ -d src ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "No src/ directory: nothing to measure."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.probe.outputs.skip == 'false'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.probe.outputs.skip == 'false'
        with:
          dependencies: '"all"'

      # --coverage is -fprofile-arcs -ftest-coverage plus the link-side
      # -lgcov. -O0 because optimisation rearranges and merges branches until
      # the counts no longer correspond to anything in the source, which is
      # the one property this job needs them to have.
      #
      # `+=` so R's own flags survive, as everywhere else here.
      - name: Build instrumented
        if: steps.probe.outputs.skip == 'false'
        run: |
          set -eu
          target="${R_MAKEVARS_USER:-${HOME}/.R/Makevars}"
          mkdir -p "$(dirname "$target")"
          {
            echo "CFLAGS += -O0 -g --coverage"
            echo "CXXFLAGS += -O0 -g --coverage"
            # A package declaring C_STD or CXX_STD does not compile through
            # $(CFLAGS)/$(CXXFLAGS) at all: R uses the standard-specific
            # variable, $(C17FLAGS) or $(CXX20FLAGS) and friends. Appending
            # only to the two above leaves such a package built with no
            # --coverage -- no .gcno is written, no .gcda follows, and the
            # job reports empty coverage as a success, which is the worst
            # shape for this to fail in. Appending to a variable R does not
            # define is harmless, so the list does not need narrowing.
            for std in 90 99 17 23; do
              echo "C${std}FLAGS += -O0 -g --coverage"
            done
            for std in 11 14 17 20 23 26; do
              echo "CXX${std}FLAGS += -O0 -g --coverage"
            done
            echo "LDFLAGS += --coverage"
          } >> "$target"
          cat "$target"

          # Installed from the source directory on purpose, not from a
          # tarball: gcc writes the .gcno notes next to the object files, and
          # the .gcda counts land beside them at run time. Build somewhere
          # temporary and the two halves end up in a directory that is gone
          # before gcov could be pointed at it.
          mkdir -p "${GITHUB_WORKSPACE}/lib"
          R CMD INSTALL --preclean --library="${GITHUB_WORKSPACE}/lib" .
          echo "--- notes written ---"
          find src -name '*.gcno' | head -20

      # Each file in tests/, which is what R CMD check runs. Kept out of
      # R CMD check itself deliberately: check copies the package elsewhere
      # to test it, and the .gcda counters would accumulate against that copy
      # rather than against the tree gcov is about to read.
      - name: Exercise the package
        if: steps.probe.outputs.skip == 'false'
        env:
          R_LIBS: ${{ github.workspace }}/lib
          RUN_COMMAND: ${{ inputs.native-run }}
        run: |
          set -eu
          if [ -n "$RUN_COMMAND" ]; then
            sh -c "$RUN_COMMAND"
          elif [ -d tests ]; then
            # Run each file from inside tests/, which is where R CMD check
            # runs it: testthat.R calls test_check(), whose test_dir("testthat")
            # is relative. From the repository root that resolves to ./testthat,
            # which does not exist -- no tests run, no .gcda is written, and the
            # job reports empty coverage as a success.
            for f in tests/*.R; do
              [ -e "$f" ] || continue
              echo "----- $f"
              (cd tests && Rscript "${f#tests/}")
            done
          else
            echo "::warning::no tests/ directory and no native-run; coverage will be empty"
          fi
          echo "--- counts written ---"
          find src -name '*.gcda' | head -20

      - name: Report coverage of src/
        if: steps.probe.outputs.skip == 'false'
        env:
          EXCLUDE: ${{ inputs.native-exclude }}
        run: |
          set -eu
          cd src

          if ! ls *.gcda >/dev/null 2>&1; then
            echo "::warning::no .gcda files: the instrumented build ran nothing"
            echo "## Native coverage" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "No coverage data was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # -b for branch counts, which is the point; -c to count branches
          # taken rather than report them as percentages of a percentage.
          gcov -b -c *.gcno > gcov.log 2>&1 || true

          : > /tmp/patterns
          if [ -n "$EXCLUDE" ]; then printf '%s\n' "$EXCLUDE" > /tmp/patterns; fi

          # gcov's report is a stanza per file:
          #   File 'cyaml.c'
          #   Lines executed:85.71% of 42
          #   Branches executed:90.00% of 20
          #   Taken at least once:75.00% of 20
          #
          # "Taken at least once" is the honest branch number. "Branches
          # executed" counts a branch as covered when the instruction ran at
          # all, so an `if (err)` that was reached only on the happy path
          # counts there and not here.
          awk -F"'" '/^File /{file=$2; next}
               /^Lines executed:/{split($0,a,":"); split(a[2],b,"% of "); lp[file]=b[1]; ln[file]=b[2]; next}
               /^Taken at least once:/{split($0,a,":"); split(a[2],b,"% of "); tp[file]=b[1]; tn[file]=b[2]; next}
               END{for (f in lp) printf "%s\t%s\t%s\t%s\t%s\n", f, lp[f], ln[f], (f in tp ? tp[f] : "-"), (f in tn ? tn[f] : "-")}' \
            gcov.log | sort > ../native-coverage.tsv

          {
            echo "## Native coverage (gcov)"
            echo
            echo "| File | Lines | Line cov | Branches | Taken at least once |"
            echo "|:-----|------:|---------:|---------:|--------------------:|"
          } > ../summary.md

          shown=0
          while IFS="$(printf '\t')" read -r file lpct lnum tpct tnum; do
            # gcov names headers and system files too; only the package's own
            # sources are the subject here.
            [ -e "$file" ] || continue
            path="src/${file}"
            hit=""
            while IFS= read -r pat; do
              [ -n "$pat" ] || continue
              case "$pat" in
                *[*?[]*) case "$path" in $pat) hit=1 ;; esac ;;
                *)       case "$path" in "${pat%/}"/*) hit=1 ;; esac ;;
              esac
              if [ -n "$hit" ]; then break; fi
            done < /tmp/patterns
            if [ -n "$hit" ]; then continue; fi
            shown=$((shown + 1))
            # gcov says "No branches" instead of "Taken at least once" for a
            # file that has none, so there is nothing to put a percentage on.
            if [ "$tpct" = "-" ]; then
              echo "| \`${path}\` | ${lnum} | ${lpct}% | — | — |" >> ../summary.md
            else
              echo "| \`${path}\` | ${lnum} | ${lpct}% | ${tnum} | ${tpct}% |" >> ../summary.md
            fi
          done < ../native-coverage.tsv

          if [ "$shown" -eq 0 ]; then
            echo "| _(no files)_ | | | | |" >> ../summary.md
          fi

          {
            echo
            echo "Branch coverage is the column to read. A parser's error"
            echo "handling is mostly \`if (err) goto fail;\` -- the line runs on"
            echo "the happy path, the branch does not."
          } >> ../summary.md

          cat ../summary.md >> "$GITHUB_STEP_SUMMARY"
          cat ../summary.md

      - uses: actions/upload-artifact@v4
        if: always() && steps.probe.outputs.skip == 'false'
        with:
          name: native-coverage
          path: |
            native-coverage.tsv
            src/gcov.log
            src/*.gcov
          if-no-files-found: ignore
