on:
  workflow_call:

name: coverage

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::covr

      - name: Run coverage
        id: coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          pct <- covr::percent_coverage(cov)
          color <-
            if (pct >= 90) "green" else
            if (pct >= 75) "yellow" else
            if (pct >= 60) "orange" else "red"
          cat(sprintf("pct=%.1f\n", pct), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          cat(sprintf("color=%s\n", color), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)

          df <- as.data.frame(cov)
          files <- sort(unique(df$filename))
          rows <- vapply(files, function(f) {
            sub_df <- df[df$filename == f, ]
            total   <- nrow(sub_df)
            covered <- sum(sub_df$value > 0)
            file_pct <- if (total > 0) 100 * covered / total else 0
            sprintf("| `%s` | %d | %d | %.1f%% |", f, total, covered, file_pct)
          }, character(1))

          md <- c(
            "## Coverage",
            "",
            sprintf("**Overall: %.1f%%**", pct),
            "",
            "| File | Expressions | Covered | Coverage |",
            "|:-----|------------:|--------:|---------:|",
            rows
          )
          writeLines(md, Sys.getenv("GITHUB_STEP_SUMMARY"))

      - name: Render badge
        run: |
          mkdir -p .github/badges
          npx badgen-cli --subject covr --status "${{ steps.coverage.outputs.pct }}%" --color "${{ steps.coverage.outputs.color }}" > .github/badges/coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push'
        env:
          PCT: ${{ steps.coverage.outputs.pct }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          if git diff --staged --quiet; then
            echo "Coverage badge unchanged (${PCT}%)."
          else
            git commit -m "Update coverage badge (${PCT}%)"
            git push
          fi
