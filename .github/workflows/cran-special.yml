on:
  workflow_call:
    inputs:
      skip-docs-only:
        description: >
          Skip every job here when a push or pull request changes
          documentation only: Markdown at the top level or under a dot
          directory (`.github/`, `.agents/`), `_pkgdown.yml`, and `pkgdown/`.
          Anything else runs as before, `man/`, `vignettes/` and the `.md`
          snapshots under `tests/` included. So does every case where the
          changed files cannot be listed: a new branch, a force-push, an API
          failure, a manual or scheduled run. See "Documentation-only
          changes" in the README.
        type: boolean
        required: false
        default: true
      profile:
        description: >
          `quick` skips every job here; anything else, including the default
          `full`, runs them all. The same input, with the same meaning, as
          r-cmd-check.yml's and sanitizers.yml's.

          These are CRAN's after-the-fact checks -- the ones its check page
          lists under "Additional issues" -- and each is a full R CMD check
          run a different way. Together they are three more checks per push,
          which is the wrong price for a pull request and the right one for
          a merge.
        type: string
        required: false
        default: full
      r-version:
        description: >
          R version for all three jobs. CRAN runs rcnst and rlibro on
          R-devel; `release` is the default here because the checks
          themselves have not changed since R 4.x, and a devel-only failure
          in one of them is better found by the devel legs elsewhere. vnu
          needs 4.4.0 or later, where `tools::pkg2HTML()` first appeared.
        type: string
        required: false
        default: release
      timeout-minutes:
        description: >
          Job timeout in minutes, for each job. rcnst is the one that can
          be slow: it byte-compiles everything and checks the compiler's
          constants at every step, which CRAN warns is a significant
          slow-down. On mdbx, whose tests spend their time in C, it took
          42 s against 41 s for a plain check; it scales with how much R
          code the suite runs.
        type: number
        required: false
        default: 30
      env:
        description: >
          Extra environment variables for the check steps, one NAME=VALUE
          per line, for the same reason sanitizers.yml takes them: to opt
          into test paths a package normally skips. Not applied to the vnu
          job, which runs no package code.

          Do not put secrets here: workflow inputs are not masked in logs.
        type: string
        required: false
        default: ""

name: cran-special

# Nothing here writes through the token, so `contents: read` is enough: the
# jobs read the checkout, and artifact upload and the cache need no declared
# scope.
#
# This is not only least privilege. `read-all` is wider than the `read` that a
# repository hands its GITHUB_TOKEN by default, and a called workflow cannot
# be granted more than its caller holds -- so requesting it here made every
# caller that did not declare permissions of its own fail with an unannotated
# `startup_failure`, two seconds in, before any job was created.
permissions:
  contents: read

# Three of CRAN's "Additional issues" that no other workflow here reaches.
# Each is what CRAN's own README for the check says it is, and each is run
# the way that README says to run it:
#
#   rcnst    https://raw.githubusercontent.com/kalibera/cran-checks/master/rcnst/README.txt
#   rlibro   https://raw.githubusercontent.com/kalibera/cran-checks/master/rlibro/README.txt
#   vnu      https://www.r-project.org/nosvn/vnu/README.txt
#
# All three say they do not false-alarm. That is what lets them fail the job
# from the first run, where rchk.yml and analyzers.yml start out advisory.
jobs:
  # Skips the jobs below when a push or pull request changes documentation
  # only; see the `skip-docs-only` input. Every workflow it gates carries an
  # identical copy -- inline for the reason sanitizers.yml gives for not
  # factoring out a composite action -- and tests/lint-workflows.py keeps the
  # copies identical and the wiring complete.
  #
  # The gated jobs test `!cancelled()` in place of the implicit `success()`,
  # so this job failing, or being skipped, runs them rather than dropping
  # them. Only an explicit `docs-only=true` skips anything.
  changes:
    name: docs-only gate
    if: inputs.skip-docs-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Classify the changed files
        id: classify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
        run: |
          # Anything short of a complete list of changed files, every one of
          # them documentation, leaves this false and every job runs.
          docs_only=false
          trap 'echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"' EXIT

          case "$EVENT" in
            pull_request|pull_request_target)
              base=$PR_BASE head=$PR_HEAD ;;
            push)
              # `before` is all zeros for a new branch, and after a
              # force-push it may no longer exist.
              if [ "$FORCED" = true ] || [ -z "${BEFORE//0/}" ]; then
                echo "New branch or force-push: no diff to go by, so everything runs."
                exit 0
              fi
              base=$BEFORE head=$AFTER ;;
            *)
              echo "A $EVENT run has no changed files to go by, so everything runs."
              exit 0 ;;
          esac

          # The compare API rather than the pull request's file list, which
          # would need `pull-requests: read`: a scope the caller may not hold,
          # and asking for one is a startup_failure. Three dots diff from the
          # merge base, which for a pull request is exactly what it changes,
          # from its first commit on.
          # A rename is listed under its new name, with the old one in
          # previous_filename; both count, or `git mv R/x.R x.md` reads as a
          # documentation-only change.
          if ! files=$(gh api "repos/$REPO/compare/$base...$head" \
                         --jq '(.files // []) | length, (.[] | .filename, (.previous_filename // empty))'); then
            echo "Could not list the changed files, so everything runs."
            exit 0
          fi

          # compare lists at most 300 files and truncates silently past that.
          count=$(head -n 1 <<<"$files")
          if ! [[ $count =~ ^[0-9]+$ ]] || [ "$count" -eq 0 ] || [ "$count" -ge 300 ]; then
            echo "Cannot rely on a list of '$count' changed files, so everything runs."
            exit 0
          fi

          # Markdown in `tests/` is not documentation -- testthat snapshots
          # and fixtures are .md -- and neither is Markdown under `fuzz/` or
          # `inst/`, so .md counts only at the top level or under a dot
          # directory, which a package does not ship.
          all_docs=true
          while IFS= read -r f; do
            case "$f" in
              _pkgdown.yml|_pkgdown.yaml|pkgdown/*) kind=docs ;;
              .*/*.md) kind=docs ;;
              */*) kind=code ;;
              *.md) kind=docs ;;
              *) kind=code ;;
            esac
            printf '%-5s %s\n' "$kind" "$f"
            [ "$kind" = docs ] || all_docs=false
          done < <(tail -n +2 <<<"$files")

          if [ "$all_docs" = true ]; then
            docs_only=true
            echo "Documentation only: the jobs in this workflow are skipped." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # Corruption of R constants. Immutability is enforced in R code and cannot
  # be in C, so `.Call` code that writes into an argument in place -- an
  # INTEGER(x)[0] = ... on something the caller passed -- can overwrite a
  # literal that the byte-code compiler shares: afterwards `1L` may read as
  # something else, in any function, until the session ends. The three
  # variables make R byte-compile everything and verify the compiler's
  # constants at the strictest level, so the write is caught where it
  # happens instead of wherever the corrupted literal is used next.
  #
  # A pure-R package cannot corrupt a constant on its own, so the job stops
  # early rather than spending a full check proving nothing.
  rcnst:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' && (inputs.profile != 'quick') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R_COMPILE_PKGS: "1"
      R_JIT_STRATEGY: "4"
      R_CHECK_CONSTANTS: "5"

    steps:
      - uses: actions/checkout@v7

      - name: Nothing to corrupt without compiled code
        id: src
        run: |
          if [ -d src ]; then
            echo "has-src=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-src=false" >> "$GITHUB_OUTPUT"
            echo "No src/ directory: only compiled code can modify a constant in place."
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.src.outputs.has-src == 'true'
        with:
          r-version: ${{ inputs.r-version }}
          http-user-agent: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.src.outputs.has-src == 'true'
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Job-level env reaches every process R CMD check starts, but a check
      # that ran without it would look exactly like a clean one. Read the
      # three back from inside R before trusting the result.
      - name: Verify the constants check is armed
        if: steps.src.outputs.has-src == 'true'
        shell: Rscript {0}
        run: |
          v <- Sys.getenv(c("R_COMPILE_PKGS", "R_JIT_STRATEGY", "R_CHECK_CONSTANTS"))
          print(v)
          if (!identical(unname(v), c("1", "4", "5")))
            stop("rcnst environment did not reach R")

      - name: Apply caller environment
        if: steps.src.outputs.has-src == 'true' && inputs.env != ''
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -eu
          printf '%s\n' "$CALLER_ENV" | while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
              *) echo "Ignoring malformed env line: $line" >&2 ;;
            esac
          done

      - name: Run R CMD check with constants checking
        if: steps.src.outputs.has-src == 'true'
        shell: Rscript {0}
        run: |
          if (Sys.getenv("_R_CHECK_CRAN_INCOMING_", "") == "") Sys.setenv("_R_CHECK_CRAN_INCOMING_" = "false")
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            build_args = c("--no-manual"),
            error_on = "warning",
            check_dir = "check"
          )

      # A corrupted constant ends R with "Fatal error: compiler constants were
      # modified", which R CMD check reports as an ordinary test or example
      # ERROR -- the step above already turns that into a red job. This names
      # the cause, so the log does not have to be read to know which kind of
      # failure it was. "were modified" is the string kalibera's notes say to
      # search for; the other two are the lines above it that say what was
      # modified and by which .Call.
      - name: Name a constants finding
        if: always() && steps.src.outputs.has-src == 'true'
        run: |
          set +e -u
          hits=$(find check -type f \( -name '*.Rout' -o -name '*.Rout.fail' -o -name 00check.log \) \
                   -exec grep -h -E 'compiler constants were modified|modification of compiler constant|modified its argument' {} + \
                 2>/dev/null | sort -u)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::rcnst: a constant was modified; see the check-rcnst artifact"
            exit 1
          fi
          echo "No constants finding."

      - uses: actions/upload-artifact@v7
        if: always() && steps.src.outputs.has-src == 'true'
        with:
          name: check-rcnst
          path: check
          if-no-files-found: ignore

  # A package that writes into the directory it was installed to. It works on
  # a laptop, where the library is the user's own, and fails wherever the
  # library is shared or mounted read-only. CRAN runs a regular check with
  # the library mounted read-only and greps for the resulting errors; the
  # only listed offender at the time of writing was caught saving an .rds
  # into its own inst/ from an example.
  #
  # The same shape here without a mount: install first, take write
  # permission away from the whole library, then run R CMD check against it
  # with --install=check:FILE, which reuses that install log instead of
  # installing again. The runner user is not root, so chmod is honoured;
  # this could not be a container job, where root ignores it. The check
  # dir itself stays writable, as CRAN's does.
  rlibro:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' && (inputs.profile != 'quick') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r-version }}
          http-user-agent: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Apply caller environment
        if: inputs.env != ''
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -eu
          printf '%s\n' "$CALLER_ENV" | while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
              *) echo "Ignoring malformed env line: $line" >&2 ;;
            esac
          done

      - name: Build and install into the library
        run: |
          set -eu
          R CMD build --no-manual --no-build-vignettes .
          tarball=$(ls -t ./*.tar.gz | head -1)
          echo "TARBALL=${tarball}" >> "$GITHUB_ENV"
          LIB="${RUNNER_TEMP}/rlibro-lib"
          mkdir -p "$LIB"
          echo "RLIBRO_LIB=${LIB}" >> "$GITHUB_ENV"
          R CMD INSTALL --library="$LIB" "$tarball" 2>&1 | tee 00install.out

      # The dependencies too, not only the package: CRAN's library is
      # read-only as a whole, and its README notes a package may be reported
      # while a dependency is at fault. Reported here the same way, so the
      # two runs agree.
      #
      # Then prove it took. A write that succeeds means the permissions did
      # not apply -- root, or a filesystem that ignores them -- and the check
      # that follows would pass without testing anything.
      - name: Make the library read-only
        run: |
          set -eu
          USER_LIB="$(Rscript -e 'cat(.libPaths()[1])')"
          for d in "$RLIBRO_LIB" "$USER_LIB"; do
            chmod -R a-w "$d"
            echo "read-only: $d"
          done
          if touch "$RLIBRO_LIB/probe" 2>/dev/null; then
            echo "::error::the library is still writable after chmod; this job cannot test anything here"
            exit 1
          fi
          echo "USER_LIB=${USER_LIB}" >> "$GITHUB_ENV"

      - name: Run R CMD check against the read-only library
        env:
          _R_CHECK_CRAN_INCOMING_: "false"
        run: |
          set -u
          status=0
          R CMD check --no-manual --as-cran --install=check:00install.out \
            --library="$RLIBRO_LIB" "$TARBALL" || status=$?
          echo "CHECK_STATUS=${status}" >> "$GITHUB_ENV"

      # Two gates. The exit status is R CMD check's own verdict, and the grep
      # is CRAN's: its README says the outputs are searched for errors about
      # writing to a read-only file system. On a mount that reads "Read-only
      # file system"; on removed permissions, as here, "Permission denied".
      #
      # A hit must also name one of the two read-only libraries. "Permission
      # denied" on its own is the text of any test that checks its package
      # reports an unwritable path correctly, and those are not findings.
      # R's error carries the path on the same line --
      #   cannot open file '<lib>/pkg/x.rds': Permission denied
      # -- so filtering by it costs nothing. A finding counts whether or not
      # the test that hit it went on to fail.
      - name: Fail on a write into the library
        if: always()
        run: |
          set +e -u
          hits=$(find . -path './*.Rcheck/*' -type f \( -name '*.Rout' -o -name '*.Rout.fail' -o -name 00check.log \) \
                   -exec grep -h -E "Read-only file system|Permission denied" {} + 2>/dev/null \
                 | grep -F -e "${RLIBRO_LIB:-/nonexistent}" -e "${USER_LIB:-/nonexistent}" | sort -u)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::rlibro: the package (or a dependency) wrote into the read-only library; see the check-rlibro artifact"
            exit 1
          fi
          if [ "${CHECK_STATUS:-1}" -ne 0 ]; then
            echo "::error::R CMD check failed (exit ${CHECK_STATUS:-1}) for a reason other than a write into the library; see the check-rlibro artifact"
            exit "${CHECK_STATUS:-1}"
          fi
          echo "No write into the read-only library."

      # Put the permissions back so the runner's own cleanup and the upload
      # below are not fighting a read-only tree.
      - name: Restore write permission
        if: always()
        run: |
          for d in "${RLIBRO_LIB:-}" "${USER_LIB:-}"; do
            [ -n "$d" ] && [ -d "$d" ] && chmod -R u+w "$d" || true
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-rlibro
          path: |
            *.Rcheck
            00install.out
          if-no-files-found: ignore

  # HTML validity of the reference manual, with the same validator and the
  # same recipe as CRAN's vnu check: render the package's Rd to one HTML
  # file with tools::pkg2HTML() and run the Nu HTML checker over it. Rd that
  # is entirely markup cannot go wrong here; the risk is \out{} and
  # \if{html}{}, which pass raw HTML through, and a tag left open there is
  # invalid HTML in every help page that includes it.
  #
  # No package dependencies are installed and nothing is run: pkg2HTML
  # works from the built tarball alone.
  vnu:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' && (inputs.profile != 'quick') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r-version }}
          http-user-agent: release

      # pkg2HTML arrived in R 4.4.0, and the validator is a jar. The runner
      # images ship a JDK; the check is here for anyone running this on a
      # runner that does not.
      - name: Check the prerequisites
        run: |
          set -eu
          java -version 2>&1 | head -1
          Rscript -e 'if (getRversion() < "4.4.0") stop("vnu needs R >= 4.4.0 for tools::pkg2HTML(); this is ", getRversion())'

      # W3CMarkupValidator is on CRAN; vnu.jar is the checker itself,
      # packaged for R and served from the repository CRAN's README names
      # for it. A private library, so neither lands among the package's own
      # dependencies.
      #
      # From the repos setup-r configured, which on Linux serve binaries.
      # Naming CRAN's source repository instead built W3CMarkupValidator's
      # `curl` dependency from source, which needs libcurl headers the
      # runner does not ship -- the first run of this job failed on
      # `curl/curl.h: No such file or directory`. The headers are installed
      # as well, for the case where no binary exists for this R.
      - name: Install the validator
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev
          LIB="${RUNNER_TEMP}/vnu-lib"
          mkdir -p "$LIB"
          echo "VNU_LIB=${LIB}" >> "$GITHUB_ENV"
          Rscript -e '
            lib <- Sys.getenv("LIB")
            install.packages("W3CMarkupValidator", lib = lib)
            install.packages("vnu.jar", lib = lib, type = "source", repos = "https://datacube.wu.ac.at/")
            for (p in c("W3CMarkupValidator", "vnu.jar"))
              if (!requireNamespace(p, lib.loc = lib, quietly = TRUE)) stop("failed to install ", p)
          '
        env:
          LIB: ${{ runner.temp }}/vnu-lib

      - name: Build the package
        run: |
          set -eu
          R CMD build --no-manual --no-build-vignettes .
          echo "TARBALL=$(ls -t ./*.tar.gz | head -1)" >> "$GITHUB_ENV"

      # `concordance = TRUE` is what makes a finding name the Rd file and
      # line rather than a position in the generated HTML. Errors fail the
      # job; warnings and infos are reported and do not, which is the line
      # CRAN draws in what it lists.
      - name: Validate the reference manual
        shell: Rscript {0}
        run: |
          .libPaths(c(Sys.getenv("VNU_LIB"), .libPaths()))
          library(W3CMarkupValidator)
          out <- "refman.html"
          tools::pkg2HTML(Sys.getenv("TARBALL"), out = out, concordance = TRUE)
          bad <- w3c_markup_validate(file = out, jar = TRUE, concordance = TRUE)
          # One row per finding, typed "error", "warning" or "info".
          ne <- sum(bad$type == "error"); nw <- sum(bad$type == "warning")
          report <- capture.output(inspect(bad))
          writeLines(report, "vnu-report.txt")
          cat(report, sep = "\n")
          summary <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(summary)) {
            cat(sprintf("### vnu: %d error(s), %d warning(s)\n\n", ne, nw), file = summary, append = TRUE)
            if (ne + nw > 0) cat("```\n", paste(report, collapse = "\n"), "\n```\n", file = summary, append = TRUE)
          }
          if (ne > 0) {
            cat(sprintf("::error::vnu: the reference manual has %d HTML error(s); see the vnu artifact\n", ne))
            quit(status = 1)
          }
          cat("The reference manual is valid HTML.\n")

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vnu
          path: |
            refman.html
            vnu-report.txt
          if-no-files-found: ignore
