on:
  workflow_call:
    inputs:
      skip-docs-only:
        description: >
          Skip every job here when a push or pull request changes
          documentation only: Markdown at the top level or under a dot
          directory (`.github/`, `.agents/`), `_pkgdown.yml`, and `pkgdown/`.
          Anything else runs as before, `man/`, `vignettes/` and the `.md`
          snapshots under `tests/` included. So does every case where the
          changed files cannot be listed: a new branch, a force-push, an API
          failure, a manual or scheduled run.

          DESCRIPTION, README.Rmd and README.qmd are skipped here too:
          r-cmd-check gives such a change its one check. See
          "Documentation-only changes" in the README.
        type: boolean
        required: false
        default: true
      step:
        description: >
          Force a garbage collection every `step` allocations. The default of
          20 is R's own recommendation and the most sensitive setting.

          Raise it when the job takes longer than anyone will wait for. Cost
          falls steeply at first and then flattens, because a fixed part of
          the job -- checkout, dependency install, compile -- is not affected
          by the setting at all. Measured on a package with a 3,000-assertion
          suite, one run each on the same runner image: 82m30s at step 20,
          18m38s at 100, 9m52s at 300, 5m44s at 500.

          Measure a candidate rather than predicting one. Two attempts to fit
          those numbers to a fixed cost plus a 1/step term missed by about a
          quarter in one direction and a third in the other, and timing a
          single test file instead of the suite was worse still: it predicted
          10 to 12 minutes at step 100 where the real figure was 18m38s. Each
          measurement is a single sample and runner variance is the same size
          as the effect, so a curve through them mostly fits noise.

          What you give up is sensitivity, not coverage: every path still
          runs, and a suite of any size still forces many thousands of
          collections. An unprotected SEXP is caught only when a collection
          lands while it is live, so a larger step widens the window it can
          hide in. Prefer a wide step over not running this job at all, and
          pair it with a weekly run at 20 if the budget allows.
        type: number
        required: false
        default: 20
      profile:
        description: >
          `quick` runs at `quick-step` in place of `step`. Anything else,
          including the default `full`, runs at `step`. The same input, with
          the same meaning, as r-cmd-check.yml's.

          This job is usually the one a pull request waits on: at step 20 it
          can take an hour or more where every other check here takes
          minutes. A caller passing
          `github.event_name == 'pull_request' && 'quick' || 'full'` gets the
          wide step on each push and the sensitive one once per merge.

          `auto` resolves the profile from the event: `full` on a manual
          dispatch, on a schedule and on a pull request labelled `full-ci`,
          `quick` on every other event, a push to main included. The shared
          `changes` job resolves it.
        type: string
        required: false
        default: full
      quick-step:
        description: >
          The `step` under `profile: quick`. 500 took 5m44s against 82m30s
          at 20 in the measurements under `step`, and at that width the job
          is no longer the slowest thing a pull request runs.
        type: number
        required: false
        default: 500
      timeout-minutes:
        description: >
          Job timeout in minutes. gctorture2() forces a garbage
          collection every 20 allocations, so a suite that normally runs in
          seconds can take tens of minutes here, and one with large test
          data can take hours. Raise this for such a package, or better,
          gate its heavy tests behind an opt-in environment variable --
          tests that check limits rather than memory safety add nothing to
          this job.
        type: number
        required: false
        default: 120
      test-timeout-minutes:
        description: >
          A time budget, in minutes, for the test run itself. Past it the
          run is stopped and the job fails with an error saying so. 0, the
          default, sets no budget.

          A job that reaches `timeout-minutes` is cancelled, not failed: its
          check turns grey, like a run that a newer push superseded, and is
          easy to read as noise. A budget below the job timeout turns "this
          suite no longer fits" into a red check instead. The usual use is a
          short budget on pull requests, with `profile` and an expression
          choosing it per event, so that a suite which outgrows its
          `quick-step` is noticed when it happens. Widen the step to get back
          under it, rather than gating tests.
        type: number
        required: false
        default: 0
      rust:
        description: >
          Install a Rust toolchain before running the suite, for a package
          whose src/ contains a cargo crate.

          test_local() loads the package with pkgload, which compiles src/ --
          so this job builds the crate even though nothing about gctorture is
          Rust-specific. The runner image ships a rustup, but not necessarily
          one new enough: a crate on edition 2024 needs rustc 1.85, and
          packages wrapping a Rust library commonly sit above that.
        type: boolean
        required: false
        default: false
      rust-workspace:
        description: >
          Path to the cargo workspace, for the build cache. Ignored when
          `rust` is false.
        type: string
        required: false
        default: src/rust
      env:
        description: >
          Extra environment variables for the test step, one NAME=VALUE per
          line, as in r-cmd-check.yml and sanitizers.yml.

          A package that fetches vendored sources at configure time needs
          this: without a way to set the variable that selects the online
          path, the build reaches for a release artefact that a development
          version has not published yet.

          Do not put secrets here: workflow inputs are not masked in logs.
        type: string
        required: false
        default: ""

name: gctorture

# Nothing here writes through the token, so `contents: read` is enough: the
# job reads the checkout, and artifact upload, the cache and a public ghcr.io
# image each need no declared scope.
#
# This is not only least privilege. `read-all` is wider than the `read` that a
# repository hands its GITHUB_TOKEN by default, and a called workflow cannot
# be granted more than its caller holds -- so requesting it here made every
# caller that did not declare permissions of its own fail with an unannotated
# `startup_failure`, two seconds in, before any job was created.
permissions:
  contents: read

# Read by the `changes` job, which is identical in every workflow that
# carries it: the name in its `skip-ci:<name>` label, and the profile it resolves.
env:
  R_ACTIONS_WORKFLOW: gctorture
  R_ACTIONS_PROFILE: ${{ inputs.profile }}

jobs:
  # Skips the jobs below when a push or pull request changes documentation
  # only; see the `skip-docs-only` input. Every workflow it gates carries an
  # identical copy -- inline for the reason sanitizers.yml gives for not
  # factoring out a composite action -- and tests/lint-workflows.py keeps the
  # copies identical and the wiring complete.
  #
  # The gated jobs test `!cancelled()` in place of the implicit `success()`,
  # so this job failing, or being skipped, runs them rather than dropping
  # them. Only an explicit `docs-only=true` skips anything.
  changes:
    name: docs-only gate
    # It always runs, because it also resolves `profile` and reads the pull
    # request's labels. `skip-docs-only: false` turns off the file rules
    # only; a label on a pull request is a decision someone made about that
    # pull request, and still applies.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      scope: ${{ steps.classify.outputs.scope }}
      profile: ${{ steps.classify.outputs.profile }}
    steps:
      - name: Classify the changed files and the labels
        id: classify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          FILE_RULES: ${{ inputs.skip-docs-only }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          # R_ACTIONS_WORKFLOW (the name in `skip-ci:<name>`) and
          # R_ACTIONS_PROFILE (the `profile` input, where there is one) come
          # from the workflow-level `env`, so that this job stays identical
          # in every workflow that carries it.
        run: |
          # Anything short of a complete list of changed files, every one of
          # them documentation or package metadata, leaves this false and
          # every job runs -- unless a label on the pull request says
          # otherwise.
          #
          # `scope` is `docs`, `metadata` or `code`. `docs-only` is true for
          # the first two: every job gated on it skips both. r-cmd-check
          # alone reads `scope`, and runs its quick runner legs for
          # `metadata`, so a DESCRIPTION edit still gets one R CMD check.
          docs_only=false scope=code profile=full
          trap '{ echo "docs-only=$docs_only"; echo "scope=$scope"; echo "profile=$profile"; } >> "$GITHUB_OUTPUT"' EXIT

          is_pr=false
          case "$EVENT" in pull_request|pull_request_target) is_pr=true ;; esac
          labels=""
          if [ "$is_pr" = true ]; then
            labels=$(jq -r '.[]?' <<<"$LABELS" 2>/dev/null || true)
          fi
          has_label() { grep -qxF -- "$1" <<<"$labels"; }

          # `auto` is quick by default. A manual dispatch, a schedule and the
          # `full-ci` label on a pull request make it full; a push to main
          # stays quick. Any other value keeps its old meaning: `quick` is
          # quick, anything else is full.
          case "${R_ACTIONS_PROFILE:-full}" in
            auto)
              case "$EVENT" in
                workflow_dispatch|schedule) ;;
                *) has_label full-ci || profile=quick ;;
              esac ;;
            quick) profile=quick ;;
          esac
          echo "profile: $profile"

          # Labels change pull request runs only. The push after merge
          # carries none and is classified by its files, so anything a label
          # skips here still runs on the default branch. `full-ci` asks for
          # more checking, so it overrides every label that asks for less.
          if [ -n "$labels" ] && ! has_label full-ci; then
            if [ -n "${R_ACTIONS_WORKFLOW:-}" ] && has_label "skip-ci:${R_ACTIONS_WORKFLOW}"; then
              docs_only=true scope=docs
              echo "Skipped by the \`skip-ci:${R_ACTIONS_WORKFLOW}\` label: every job in this workflow is skipped on this pull request." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if has_label ci:minimal; then
              docs_only=true scope=metadata
              echo "Reduced by the \`ci:minimal\` label: r-cmd-check runs its quick runner legs, and every other gated job is skipped on this pull request." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          if [ "$FILE_RULES" != true ]; then
            echo "skip-docs-only is false, so the changed files are not consulted."
            exit 0
          fi

          case "$EVENT" in
            pull_request|pull_request_target)
              base=$PR_BASE head=$PR_HEAD ;;
            push)
              # `before` is all zeros for a new branch, and after a
              # force-push it may no longer exist.
              if [ "$FORCED" = true ] || [ -z "${BEFORE//0/}" ]; then
                echo "New branch or force-push: no diff to go by, so everything runs."
                exit 0
              fi
              base=$BEFORE head=$AFTER ;;
            *)
              echo "A $EVENT run has no changed files to go by, so everything runs."
              exit 0 ;;
          esac

          # The compare API rather than the pull request's file list, which
          # would need `pull-requests: read`: a scope the caller may not hold,
          # and asking for one is a startup_failure. Three dots diff from the
          # merge base, which for a pull request is exactly what it changes,
          # from its first commit on.
          # A rename is listed under its new name, with the old one in
          # previous_filename; both count, or `git mv R/x.R x.md` reads as a
          # documentation-only change.
          if ! files=$(gh api "repos/$REPO/compare/$base...$head" \
                         --jq '(.files // []) | length, (.[] | .filename, (.previous_filename // empty))'); then
            echo "Could not list the changed files, so everything runs."
            exit 0
          fi

          # compare lists at most 300 files and truncates silently past that.
          count=$(head -n 1 <<<"$files")
          if ! [[ $count =~ ^[0-9]+$ ]] || [ "$count" -eq 0 ] || [ "$count" -ge 300 ]; then
            echo "Cannot rely on a list of '$count' changed files, so everything runs."
            exit 0
          fi

          # The caller's own workflow file. In a called workflow
          # `github.workflow_ref` is the caller's, `<repo>/<path>@<ref>`. An
          # edit to that file is code -- a CI change has to test itself --
          # while an edit to any other workflow in the repository changes
          # nothing this workflow runs. If the ref is not in that shape,
          # every workflow file counts as code.
          caller=""
          case "$WORKFLOW_REF" in
            "$REPO"/*@*) caller=${WORKFLOW_REF#"$REPO"/}; caller=${caller%%@*} ;;
          esac

          # Markdown in `tests/` is not documentation -- testthat snapshots
          # and fixtures are .md -- and neither is Markdown under `fuzz/` or
          # `inst/`, so .md counts only at the top level or under a dot
          # directory, which a package does not ship.
          #
          # Repository housekeeping counts as documentation too: nothing here
          # builds, installs or checks it. CRAN-SUBMISSION is
          # devtools::submit_cran()'s record of the submitted commit, and
          # .gitignore changes what git tracks, not what R CMD build ships
          # (that is .Rbuildignore, which is code).
          #
          # DESCRIPTION and the README sources are `meta`: a version bump, a
          # URL or a reworded Description is worth one check, not the
          # sanitizers. README.Rmd is usually build-ignored, but it is
          # executed to render README.md, so it is not treated as prose.
          all_docs=true any_meta=false
          while IFS= read -r f; do
            case "$f" in
              _pkgdown.yml|_pkgdown.yaml|pkgdown/*) kind=docs ;;
              DESCRIPTION|README.Rmd|README.qmd) kind=meta ;;
              CRAN-SUBMISSION|.gitignore|CODEOWNERS|.github/CODEOWNERS) kind=docs ;;
              .github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE*) kind=docs ;;
              .github/dependabot.yml|.github/dependabot.yaml|.github/FUNDING.yml) kind=docs ;;
              .github/workflows/*)
                if [ -n "$caller" ] && [ "$f" != "$caller" ]; then kind=docs; else kind=code; fi ;;
              .*/*.md) kind=docs ;;
              */*) kind=code ;;
              *.md) kind=docs ;;
              *) kind=code ;;
            esac
            printf '%-5s %s\n' "$kind" "$f"
            case "$kind" in
              docs) ;;
              meta) any_meta=true ;;
              *) all_docs=false ;;
            esac
          done < <(tail -n +2 <<<"$files")

          if [ "$all_docs" = true ] && [ "$any_meta" = true ]; then
            docs_only=true scope=metadata
            echo "Documentation and package metadata only: r-cmd-check runs its quick runner legs, and every other gated job is skipped." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$all_docs" = true ]; then
            docs_only=true scope=docs
            echo "Documentation only: the jobs in this workflow are skipped." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  gctorture:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - name: Install a Rust toolchain
        if: inputs.rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artefacts
        if: inputs.rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.rust-workspace }}
          shared-key: gctorture
          cache-on-failure: true

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          http-user-agent: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::pkgload
          needs: check

      - name: Apply caller environment
        if: inputs.env != ''
        shell: bash
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -eu
          printf '%s\n' "$CALLER_ENV" | while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
              *) echo "Ignoring malformed env line: $line" >&2 ;;
            esac
          done

      - name: Run tests under gctorture
        shell: bash
        env:
          STEP: ${{ needs.changes.outputs.profile == 'quick' && inputs.quick-step || inputs.step }}
          BUDGET: ${{ inputs.test-timeout-minutes }}
        run: |
          set -u
          script=$(mktemp --suffix=.R)
          cat > "$script" <<EOF
          gctorture2(step = $STEP)
          testthat::test_local(stop_on_failure = TRUE)
          EOF
          # `timeout` sends SIGTERM at the budget and exits 124; if R is
          # still running a minute later it sends SIGKILL, and exits 137.
          if [ "$BUDGET" -gt 0 ]; then
            timeout --kill-after=1m "${BUDGET}m" Rscript "$script" && status=0 || status=$?
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "::error::gctorture at step $STEP ran past its ${BUDGET}-minute budget (test-timeout-minutes). Widen the step, or raise the budget."
              exit 1
            fi
            exit "$status"
          fi
          Rscript "$script"
