on:
  workflow_call:
    inputs:
      step:
        description: >
          Force a garbage collection every `step` allocations. The default of
          20 is R's own recommendation and the most sensitive setting.

          Raise it when the job takes longer than anyone will wait for. Cost
          falls steeply at first and then flattens, because a fixed part of
          the job -- checkout, dependency install, compile -- is not affected
          by the setting at all. Measured on a package with a 3,000-assertion
          suite, one run each on the same runner image: 82m30s at step 20,
          18m38s at 100, 9m52s at 300, 5m44s at 500.

          Measure a candidate rather than predicting one. Two attempts to fit
          those numbers to a fixed cost plus a 1/step term missed by about a
          quarter in one direction and a third in the other, and timing a
          single test file instead of the suite was worse still: it predicted
          10 to 12 minutes at step 100 where the real figure was 18m38s. Each
          measurement is a single sample and runner variance is the same size
          as the effect, so a curve through them mostly fits noise.

          What you give up is sensitivity, not coverage: every path still
          runs, and a suite of any size still forces many thousands of
          collections. An unprotected SEXP is caught only when a collection
          lands while it is live, so a larger step widens the window it can
          hide in. Prefer a wide step over not running this job at all, and
          pair it with a weekly run at 20 if the budget allows.
        type: number
        required: false
        default: 20
      profile:
        description: >
          `quick` runs at `quick-step` in place of `step`. Anything else,
          including the default `full`, runs at `step`. The same input, with
          the same meaning, as r-cmd-check.yml's.

          This job is usually the one a pull request waits on: at step 20 it
          can take an hour or more where every other check here takes
          minutes. A caller passing
          `github.event_name == 'pull_request' && 'quick' || 'full'` gets the
          wide step on each push and the sensitive one once per merge.
        type: string
        required: false
        default: full
      quick-step:
        description: >
          The `step` under `profile: quick`. 500 took 5m44s against 82m30s
          at 20 in the measurements under `step`, and at that width the job
          is no longer the slowest thing a pull request runs.
        type: number
        required: false
        default: 500
      timeout-minutes:
        description: >
          Job timeout in minutes. gctorture2() forces a garbage
          collection every 20 allocations, so a suite that normally runs in
          seconds can take tens of minutes here, and one with large test
          data can take hours. Raise this for such a package, or better,
          gate its heavy tests behind an opt-in environment variable --
          tests that check limits rather than memory safety add nothing to
          this job.
        type: number
        required: false
        default: 120
      rust:
        description: >
          Install a Rust toolchain before running the suite, for a package
          whose src/ contains a cargo crate.

          test_local() loads the package with pkgload, which compiles src/ --
          so this job builds the crate even though nothing about gctorture is
          Rust-specific. The runner image ships a rustup, but not necessarily
          one new enough: a crate on edition 2024 needs rustc 1.85, and
          packages wrapping a Rust library commonly sit above that.
        type: boolean
        required: false
        default: false
      rust-workspace:
        description: >
          Path to the cargo workspace, for the build cache. Ignored when
          `rust` is false.
        type: string
        required: false
        default: src/rust
      env:
        description: >
          Extra environment variables for the test step, one NAME=VALUE per
          line, as in r-cmd-check.yml and sanitizers.yml.

          A package that fetches vendored sources at configure time needs
          this: without a way to set the variable that selects the online
          path, the build reaches for a release artefact that a development
          version has not published yet.

          Do not put secrets here: workflow inputs are not masked in logs.
        type: string
        required: false
        default: ""

name: gctorture

# Nothing here writes through the token, so `contents: read` is enough: the
# job reads the checkout, and artifact upload, the cache and a public ghcr.io
# image each need no declared scope.
#
# This is not only least privilege. `read-all` is wider than the `read` that a
# repository hands its GITHUB_TOKEN by default, and a called workflow cannot
# be granted more than its caller holds -- so requesting it here made every
# caller that did not declare permissions of its own fail with an unannotated
# `startup_failure`, two seconds in, before any job was created.
permissions:
  contents: read

jobs:
  gctorture:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - name: Install a Rust toolchain
        if: inputs.rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artefacts
        if: inputs.rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.rust-workspace }}
          shared-key: gctorture
          cache-on-failure: true

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          http-user-agent: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::pkgload
          needs: check

      - name: Apply caller environment
        if: inputs.env != ''
        shell: bash
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -eu
          printf '%s\n' "$CALLER_ENV" | while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
              *) echo "Ignoring malformed env line: $line" >&2 ;;
            esac
          done

      - name: Run tests under gctorture
        shell: Rscript {0}
        run: |
          gctorture2(step = ${{ inputs.profile == 'quick' && inputs.quick-step || inputs.step }})
          testthat::test_local(stop_on_failure = TRUE)
