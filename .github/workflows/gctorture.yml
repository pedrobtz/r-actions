on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: >
          Job timeout in minutes. gctorture2(step = 20) forces a garbage
          collection every 20 allocations, so a suite that normally runs in
          seconds can take tens of minutes here, and one with large test
          data can take hours. Raise this for such a package, or better,
          gate its heavy tests behind an opt-in environment variable --
          tests that check limits rather than memory safety add nothing to
          this job.
        type: number
        required: false
        default: 120

name: gctorture

permissions: read-all

jobs:
  gctorture:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          http-user-agent: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::pkgload
          needs: check

      - name: Run tests under gctorture
        shell: Rscript {0}
        run: |
          gctorture2(step = 20)
          testthat::test_local(stop_on_failure = TRUE)
