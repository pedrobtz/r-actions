on:
  workflow_call:
    inputs:
      step:
        description: >
          Force a garbage collection every `step` allocations. The default of
          20 is R's own recommendation and the most sensitive setting.

          Raise it when the job does not finish. Cost scales as roughly 1/step
          and the measurements are not close: on a package with a 3,000-
          assertion suite, one test file took 97s at step 20, 11s at 100 and
          2.6s at 500 -- and its whole suite took 88 to 107 minutes at 20,
          which extrapolates to 10 to 12 at 100.

          What you give up is sensitivity, not coverage: every path still
          runs, and a suite of any size still forces many thousands of
          collections. An unprotected SEXP is caught when a collection lands
          while it is live, so a larger step widens the window it can hide in.
          Prefer 100 over not running this job at all.
        type: number
        required: false
        default: 20
      timeout-minutes:
        description: >
          Job timeout in minutes. gctorture2() forces a garbage
          collection every 20 allocations, so a suite that normally runs in
          seconds can take tens of minutes here, and one with large test
          data can take hours. Raise this for such a package, or better,
          gate its heavy tests behind an opt-in environment variable --
          tests that check limits rather than memory safety add nothing to
          this job.
        type: number
        required: false
        default: 120

name: gctorture

permissions: read-all

jobs:
  gctorture:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          http-user-agent: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::pkgload
          needs: check

      - name: Run tests under gctorture
        shell: Rscript {0}
        run: |
          gctorture2(step = ${{ inputs.step }})
          testthat::test_local(stop_on_failure = TRUE)
