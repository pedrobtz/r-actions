on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: >
          Job timeout. Without one, a hung build or test holds the runner
          for GitHub's six-hour default.
        type: number
        required: false
        default: 30
      skip-docs-only:
        description: >
          Skip every job here when a push or pull request changes
          documentation only: Markdown at the top level or under a dot
          directory (`.github/`, `.agents/`), `_pkgdown.yml`, and `pkgdown/`.
          Anything else runs as before, `man/`, `vignettes/` and the `.md`
          snapshots under `tests/` included. So does every case where the
          changed files cannot be listed: a new branch, a force-push, an API
          failure, a manual or scheduled run.

          DESCRIPTION, README.Rmd and README.qmd are skipped here too:
          r-cmd-check gives such a change its one check. See
          "Documentation-only changes" in the README.
        type: boolean
        required: false
        default: true

name: lto

# Nothing here writes through the token, so `contents: read` is enough: the
# job reads the checkout, and artifact upload, the cache and a public ghcr.io
# image each need no declared scope.
#
# This is not only least privilege. `read-all` is wider than the `read` that a
# repository hands its GITHUB_TOKEN by default, and a called workflow cannot
# be granted more than its caller holds -- so requesting it here made every
# caller that did not declare permissions of its own fail with an unannotated
# `startup_failure`, two seconds in, before any job was created.
permissions:
  contents: read

# Read by the `changes` job, which is identical in every workflow that
# carries it: the name in its `skip-ci:<name>` label.
env:
  R_ACTIONS_WORKFLOW: lto

jobs:
  # Skips the jobs below when a push or pull request changes documentation
  # only; see the `skip-docs-only` input. Every workflow it gates carries an
  # identical copy -- inline for the reason sanitizers.yml gives for not
  # factoring out a composite action -- and tests/lint-workflows.py keeps the
  # copies identical and the wiring complete.
  #
  # The gated jobs test `!cancelled()` in place of the implicit `success()`,
  # so this job failing, or being skipped, runs them rather than dropping
  # them. Only an explicit `docs-only=true` skips anything.
  changes:
    name: docs-only gate
    # It always runs, because it also resolves `profile` and reads the pull
    # request's labels. `skip-docs-only: false` turns off the file rules
    # only; a label on a pull request is a decision someone made about that
    # pull request, and still applies.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      scope: ${{ steps.classify.outputs.scope }}
      profile: ${{ steps.classify.outputs.profile }}
    steps:
      - name: Classify the changed files and the labels
        id: classify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          FILE_RULES: ${{ inputs.skip-docs-only }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          # R_ACTIONS_WORKFLOW (the name in `skip-ci:<name>`) and
          # R_ACTIONS_PROFILE (the `profile` input, where there is one) come
          # from the workflow-level `env`, so that this job stays identical
          # in every workflow that carries it.
        run: |
          # Anything short of a complete list of changed files, every one of
          # them documentation or package metadata, leaves this false and
          # every job runs -- unless a label on the pull request says
          # otherwise.
          #
          # `scope` is `docs`, `metadata`, `r-only`, `unchanged` (a scheduled
          # run on an already checked commit) or `code`. `docs-only` is
          # true for all but `code`: every job gated on it skips them.
          # r-cmd-check alone reads `scope`, and runs its quick runner legs
          # for `metadata`, so a DESCRIPTION edit still gets one R CMD check.
          # `r-only` is given only by a workflow that reads no R
          # (R_ACTIONS_SKIP_R_ONLY, from its `skip-r-only` input); to every
          # other workflow the same change is `code`.
          docs_only=false scope=code profile=full
          trap '{ echo "docs-only=$docs_only"; echo "scope=$scope"; echo "profile=$profile"; } >> "$GITHUB_OUTPUT"' EXIT

          is_pr=false
          case "$EVENT" in pull_request|pull_request_target) is_pr=true ;; esac
          labels=""
          if [ "$is_pr" = true ]; then
            labels=$(jq -r '.[]?' <<<"$LABELS" 2>/dev/null || true)
          fi
          has_label() { grep -qxF -- "$1" <<<"$labels"; }

          # `auto` is quick by default. A manual dispatch, a schedule and the
          # `full-ci` label on a pull request make it full; a push to main
          # stays quick. Any other value keeps its old meaning: `quick` is
          # quick, anything else is full.
          case "${R_ACTIONS_PROFILE:-full}" in
            auto)
              case "$EVENT" in
                workflow_dispatch|schedule) ;;
                *) has_label full-ci || profile=quick ;;
              esac ;;
            quick) profile=quick ;;
          esac
          echo "profile: $profile"

          # Labels change pull request runs only. The push after merge
          # carries none and is classified by its files, so anything a label
          # skips here still runs on the default branch. `full-ci` asks for
          # more checking, so it overrides every label that asks for less.
          if [ -n "$labels" ] && ! has_label full-ci; then
            if [ -n "${R_ACTIONS_WORKFLOW:-}" ] && has_label "skip-ci:${R_ACTIONS_WORKFLOW}"; then
              docs_only=true scope=docs
              echo "Skipped by the \`skip-ci:${R_ACTIONS_WORKFLOW}\` label: every job in this workflow is skipped on this pull request." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if has_label ci:docs; then
              docs_only=true scope=docs
              echo "Skipped by the \`ci:docs\` label: every gated job is skipped on this pull request." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if has_label ci:minimal; then
              docs_only=true scope=metadata
              echo "Reduced by the \`ci:minimal\` label: r-cmd-check runs its quick runner legs, and every other gated job is skipped on this pull request." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          if [ "$FILE_RULES" != true ]; then
            echo "skip-docs-only is false, so the changed files are not consulted."
            exit 0
          fi

          # A scheduled run on the commit that the same workflow's last
          # successful scheduled run already checked has nothing new to find.
          # Most packages are idle in any given week, and their full sets
          # queued behind the active ones. What sits under the commit does
          # move -- the containers, R-devel, CRAN's dependencies -- so a
          # scheduled run in the first seven days of a month runs whatever
          # the commit. The runs API needs `actions: read`, which a caller's
          # token need not carry; a public repository answers anonymously.
          # Anything short of a clear answer runs. Fuzzing is exempt: a
          # campaign on the same commit still explores new inputs, and its
          # corpus carries over from one scheduled run to the next.
          if [ "$EVENT" = schedule ] && [ "${R_ACTIONS_WORKFLOW:-}" != fuzz ]; then
            day=$(date -u +%d)
            wf=""
            case "$WORKFLOW_REF" in
              "$REPO"/.github/workflows/*@*)
                wf=${WORKFLOW_REF#"$REPO"/.github/workflows/}; wf=${wf%%@*} ;;
            esac
            last=""
            if [ "${day#0}" -gt 7 ] && [ -n "$wf" ] && [ -n "${HEAD_SHA:-}" ]; then
              q="repos/$REPO/actions/workflows/$wf/runs?event=schedule&status=success&branch=${BRANCH}&per_page=1"
              last=$(gh api "$q" --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null) ||
                last=$(curl -fsS "https://api.github.com/$q" 2>/dev/null |
                         jq -r '.workflow_runs[0].head_sha // empty' 2>/dev/null) ||
                last=""
            fi
            if [ -n "$last" ] && [ "$last" = "$HEAD_SHA" ]; then
              docs_only=true scope=unchanged
              echo "Unchanged since the last successful scheduled run (${HEAD_SHA:0:7}): the jobs in this workflow are skipped. The first scheduled run of each month runs regardless." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          case "$EVENT" in
            pull_request|pull_request_target)
              base=$PR_BASE head=$PR_HEAD ;;
            push)
              # `before` is all zeros for a new branch, and after a
              # force-push it may no longer exist.
              if [ "$FORCED" = true ] || [ -z "${BEFORE//0/}" ]; then
                echo "New branch or force-push: no diff to go by, so everything runs."
                exit 0
              fi
              base=$BEFORE head=$AFTER ;;
            *)
              echo "A $EVENT run has no changed files to go by, so everything runs."
              exit 0 ;;
          esac

          # The compare API rather than the pull request's file list, which
          # would need `pull-requests: read`: a scope the caller may not hold,
          # and asking for one is a startup_failure. Three dots diff from the
          # merge base, which for a pull request is exactly what it changes,
          # from its first commit on.
          # A rename is listed under its new name, with the old one in
          # previous_filename; both count, or `git mv R/x.R x.md` reads as a
          # documentation-only change.
          if ! files=$(gh api "repos/$REPO/compare/$base...$head" \
                         --jq '(.files // []) | length, (.[] | .filename, (.previous_filename // empty))'); then
            echo "Could not list the changed files, so everything runs."
            exit 0
          fi

          # compare lists at most 300 files and truncates silently past that.
          count=$(head -n 1 <<<"$files")
          if ! [[ $count =~ ^[0-9]+$ ]] || [ "$count" -eq 0 ] || [ "$count" -ge 300 ]; then
            echo "Cannot rely on a list of '$count' changed files, so everything runs."
            exit 0
          fi

          # The caller's own workflow file. In a called workflow
          # `github.workflow_ref` is the caller's, `<repo>/<path>@<ref>`. An
          # edit to that file is code -- a CI change has to test itself --
          # while an edit to any other workflow in the repository changes
          # nothing this workflow runs. If the ref is not in that shape,
          # every workflow file counts as code.
          caller=""
          case "$WORKFLOW_REF" in
            "$REPO"/*@*) caller=${WORKFLOW_REF#"$REPO"/}; caller=${caller%%@*} ;;
          esac

          # Markdown in `tests/` is not documentation -- testthat snapshots
          # and fixtures are .md -- and neither is Markdown under `fuzz/` or
          # `inst/`, so .md counts only at the top level or under a dot
          # directory, which a package does not ship.
          #
          # Repository housekeeping counts as documentation too: nothing here
          # builds, installs or checks it. CRAN-SUBMISSION is
          # devtools::submit_cran()'s record of the submitted commit, and
          # .gitignore changes what git tracks, not what R CMD build ships
          # (that is .Rbuildignore, which is code).
          #
          # DESCRIPTION and the README sources are `meta`: a version bump, a
          # URL or a reworded Description is worth one check, not the
          # sanitizers. README.Rmd is usually build-ignored, but it is
          # executed to render README.md, so it is not treated as prose.
          all_docs=true any_meta=false no_code=true any_r=false
          while IFS= read -r f; do
            case "$f" in
              _pkgdown.yml|_pkgdown.yaml|pkgdown/*) kind=docs ;;
              DESCRIPTION|README.Rmd|README.qmd) kind=meta ;;
              CRAN-SUBMISSION|.gitignore|CODEOWNERS|.github/CODEOWNERS) kind=docs ;;
              .github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE*) kind=docs ;;
              .github/dependabot.yml|.github/dependabot.yaml|.github/FUNDING.yml) kind=docs ;;
              .github/workflows/*)
                if [ -n "$caller" ] && [ "$f" != "$caller" ]; then kind=docs; else kind=code; fi ;;
              .*/*.md) kind=docs ;;
              R/*|man/*|vignettes/*|tests/testthat/*|tests/testthat.R) kind=r ;;
              */*) kind=code ;;
              *.md) kind=docs ;;
              *) kind=code ;;
            esac
            printf '%-5s %s\n' "$kind" "$f"
            case "$kind" in
              docs) ;;
              meta) any_meta=true ;;
              r) all_docs=false any_r=true ;;
              *) all_docs=false no_code=false ;;
            esac
          done < <(tail -n +2 <<<"$files")

          if [ "$all_docs" = true ] && [ "$any_meta" = true ]; then
            docs_only=true scope=metadata
            echo "Documentation and package metadata only: r-cmd-check runs its quick runner legs, and every other gated job is skipped." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$all_docs" = true ]; then
            docs_only=true scope=docs
            echo "Documentation only: the jobs in this workflow are skipped." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$no_code" = true ] && [ "$any_r" = true ] \
               && [ "${R_ACTIONS_SKIP_R_ONLY:-false}" = true ] && ! has_label full-ci; then
            # R code, its tests and its documentation, and nothing else. A
            # workflow that compiles the C without R cannot see the change.
            # `full-ci` asks for everything, so it runs this too.
            docs_only=true scope=r-only
            echo "R code only (R/, man/, vignettes/, tests/testthat): this workflow reads none of it, so its jobs are skipped." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
  lto:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_LTO_: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          http-user-agent: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Enable LTO
        run: |
          mkdir -p ~/.R
          printf 'LTO = -flto\nLTO_FC = -flto\n' >> ~/.R/Makevars

      - name: Run R CMD check with LTO
        shell: Rscript {0}
        run: |
          if (Sys.getenv("_R_CHECK_CRAN_INCOMING_", "") == "") Sys.setenv("_R_CHECK_CRAN_INCOMING_" = "false")
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            build_args = c("--no-manual"),
            error_on = "warning"
          )
