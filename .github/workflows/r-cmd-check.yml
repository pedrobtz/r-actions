# R CMD check, on GitHub's runners and in the CRAN-like containers.
#
# One workflow rather than two, because these are the same check -- the same
# `R CMD check --as-cran`, the same failure conditions -- run on different
# toolchains. Splitting them duplicates every R-level check (Rd, examples,
# tests, URLs, policy) in a second workflow whose logs nobody correlates with
# the first.
#
# The two jobs answer different halves of CRAN's flavor list
# (https://cran.r-project.org/web/checks/check_flavors.html):
#
# `runners` covers the OS and R-version spread -- macOS and Windows, which
# have no container, and the release/oldrel legs. Its compilers are close
# enough to CRAN's: Windows is Rtools GCC either way, and the macOS runner is
# Apple clang like r-release-macos-arm64.
#
# `containers` covers what a GitHub runner cannot reach: the two r-devel Linux
# flavors, which differ from any runner in the compiler.
#
#   r-devel-linux-x86_64-debian-clang   clang 23, with C built as -std=gnu23
#   r-devel-linux-x86_64-debian-gcc     GCC 16
#
# ubuntu-latest carries neither -- its clang still defaults to C17 and its GCC
# is several majors behind -- so a diagnostic that exists only in the newer
# compiler, or only in the newer language standard, stays invisible until
# CRAN's incoming pretest reports it. That is a rejected submission rather
# than a red check. The Fedora pair on the flavors page runs the same two
# compiler versions as the Debian pair, so it adds little.
#
# This is why the default `runners` matrix has no R-devel Linux row: the
# containers are R-devel on Linux, on the compilers CRAN actually uses. A row
# pinning R-devel to the runner's own GCC matches no CRAN flavor at all.
#
# The containers matter most for a package that compiles bundled third-party
# C. Upstream code is written against the compilers upstream tests on, and the
# gap arrives as someone else's warnings in your check log.
on:
  workflow_call:
    inputs:
      runners:
        description: >
          JSON array of `{os, r}` objects for the `runners` job, each
          optionally carrying `http-user-agent`. Set to '[]' to skip the job
          entirely.

          The default drops the R-devel Linux row that the standard
          r-lib/actions template carries, because the `containers` job covers
          that ground against CRAN's own compilers. Add it back if you want a
          plain R-devel leg as insurance against a stale container image.
        type: string
        required: false
        default: >-
          [{"os": "macos-latest", "r": "release"},
           {"os": "windows-latest", "r": "release"},
           {"os": "ubuntu-latest", "r": "release"},
           {"os": "ubuntu-latest", "r": "oldrel-1"}]
      containers:
        description: >
          JSON array of R-hub container names for the `containers` job. Names
          come from https://r-hub.github.io/containers/. Set to '[]' to skip
          the job -- worth doing only for a package with no compiled code,
          which has little to learn from a different compiler.

          The default is the CRAN-like images that differ from a runner in
          the compiler. `ubuntu-next` and `ubuntu-release` are CRAN-like
          too, but sit closer to what the `runners` job already does.

          Both clang images, because neither matches CRAN's debian-clang on
          every axis and they fail differently. clang23 has the right
          compiler major and CRAN's own -O3 -Wall -pedantic, but builds C++
          against libc++ where CRAN uses libstdc++. ubuntu-clang has the
          right C++ standard library and is the image r-hub badges as that
          flavor, but is pinned to clang 22 and ships no -pedantic. Together
          they bracket it.
        type: string
        required: false
        default: '["clang23", "ubuntu-clang", "ubuntu-gcc16"]'
      container-makevars:
        description: >
          Lines appended to a user Makevars for the `containers` job's check
          step, to make the images compile the way CRAN does.

          The default is not decoration. Measured on the images themselves:
          ubuntu-clang is `clang-22` with no `-std=` at all, so it compiles
          at __STDC_VERSION__ 201710L, while CRAN's debian-clang leg is
          `clang-23 -std=gnu23`; and both images set CFLAGS to `-g -O2`,
          where CRAN uses `-g -O3 -Wall -pedantic`. A container job without
          this override is a weaker check than the runners it sits beside --
          it reported a clean build on sources CRAN had already rejected.

          `+=` rather than `=`, so the image keeps its own compiler and only
          gains the flags; that survives the image bumping clang versions.
          -pedantic rather than -Wall: several of the diagnostics that only
          CRAN sees, -Wkeyword-macro among them, are pedantic-only.

          These lines are appended to whatever user Makevars the image
          already uses. They are never written somewhere new and pointed at
          with R_MAKEVARS_USER, because that variable replaces the user
          Makevars rather than adding to it, and an image that configures
          its whole toolchain there would lose it.

          Set to "" to take the images exactly as they ship.
        type: string
        required: false
        default: |
          CC += -std=gnu23
          CFLAGS += -pedantic
      args:
        description: >
          Check arguments, as an R expression. `--as-cran` is the point of
          the exercise; dropping it makes this a different workflow.
        type: string
        required: false
        default: 'c("--no-manual", "--as-cran")'
      build-args:
        description: >
          Build arguments for the `runners` job, as an R expression. The
          `containers` job does not take these: those images carry no LaTeX
          and no vignette-compaction tooling.
        type: string
        required: false
        default: 'c("--no-manual")'
      nosuggests:
        description: >
          Run the `nosuggests` job: R CMD check in the R-hub `nosuggests`
          image, with only hard dependencies installed.

          This is CRAN's `r-devel-linux-x86_64-debian-gcc` NOSUGGESTS flavor,
          and it fails differently from every other job here. It does not ask
          whether the package compiles or whether its tests pass; it asks
          whether the package *degrades* when its suggested packages are
          absent. A test file calling `library(testthat)` at top level, or an
          example using a Suggests package without a guard, errors here and
          nowhere else.

          Off by default, because a package with no Suggests learns nothing
          from it.
        type: boolean
        required: false
        default: false
      nold:
        description: >
          Run the `nold` job: R CMD check in the R-hub `nold` image, which is
          R built `--disable-long-double`.

          CRAN's `r-devel-linux-x86_64-debian-gcc` NOLD flavor. It catches
          arithmetic that silently relies on 80-bit intermediates -- most
          often in numeric parsing, formatting and comparison, so it is worth
          having for a package that converts text to numbers.

          `container-makevars` is deliberately not applied to this job. That
          input exists to make an image compile the way a CRAN *compiler*
          flavor does, and this is a configuration flavor: appending
          `-std=gnu23` to whatever toolchain the image ships is unrelated to
          what it tests, and would fail outright on a compiler predating C23.
        type: boolean
        required: false
        default: false
      timeout-minutes:
        description: Job timeout in minutes, for both jobs.
        type: number
        required: false
        default: 45
      env:
        description: >
          Extra environment variables for the check steps, one NAME=VALUE per
          line, as in sanitizers.yml.

          Do not put secrets here: workflow inputs are not masked in logs.
        type: string
        required: false
        default: ""
      rust:
        description: >
          Install a Rust toolchain before checking. For a package whose
          src/ contains a cargo crate -- an R package wrapping a Rust
          library.

          Off by default, because it costs a toolchain install and a cache
          restore on every leg of a matrix that mostly does not need one.

          What it does is not merely "install rustc". The GitHub runners
          already ship a rustup, and on Windows that rustup defaults to an
          MSVC host while R links with Rtools' GNU toolchain -- an MSVC
          staticlib cannot be linked by Rtools, so the windows-gnu target
          has to be added explicitly or the leg fails at link time with an
          error that names neither cargo nor the target. That is the step
          every R-plus-Rust package writes for itself, and it is the reason
          this input exists rather than a line in the README telling callers
          to add three steps of their own.

          It also pins to rustup's stable rather than whatever the image
          ships. CRAN packages using Rust routinely require a rustc newer
          than a distro toolchain carries -- edition 2024 alone needs
          1.85 -- and the container images below ship no cargo at all.
        type: boolean
        required: false
        default: false
      rust-workspace:
        description: >
          Path to the cargo workspace, for the build cache. The r-rust
          templates and the packages following them (ggsql, data.fusion)
          all put the crate at src/rust, so that is the default.

          Ignored when `rust` is false.
        type: string
        required: false
        default: src/rust
      allowed-warnings:
        description: >
          R CMD check warnings that are known, understood, and not to fail
          the job. One check name per line, matched against the name in
          `* checking <name> ... WARNING`, as an extended regular
          expression anchored at both ends. Blank lines and #-comments are
          ignored.

          Empty by default, which leaves `error_on = "warning"` exactly as
          it was: a package with no entry here behaves identically.

          This is an allow-list, not a switch. The alternative a package
          reaches for is `error_on = "error"`, and that gives up every
          warning to excuse one -- including the compiler diagnostics under
          "checking whether package can be installed" that are the single
          most common reason CRAN's pretest rejects a submission. With an
          allow-list the named warnings pass and any *other* warning still
          fails the job, so strictness is relocated rather than abandoned.
          Same shape, and the same argument, as rchk.yml's `baseline` and
          valgrind.yml's `suppressions`.

          A listed warning that stops appearing does NOT fail the job,
          unlike an rchk baseline entry. Check warnings are conditional on
          the flavor -- a URL that resolves from one runner and times out
          from another, a NOTE that is a WARNING only under --as-cran -- so
          "this one did not fire here" is the normal case rather than
          evidence the entry is stale.

          The Rust case this was written for:

            Rust compilation

          `tools:::.check_packages$check_rust()` greps the *install log* for
          "Downloading crates ...", and is not gated on --as-cran. A package
          whose vendored sources are fetched at configure time, or which
          sets NOT_CRAN so cargo resolves online, emits that string on every
          build and so warns on every leg.
        type: string
        required: false
        default: ""

name: R-CMD-check

permissions: read-all

jobs:
  runners:
    if: inputs.runners != '[]'
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(inputs.runners) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # See the `rust` input. The Windows target is the part that is easy to
      # miss: rustup's default host there is MSVC, while R links with Rtools'
      # GNU toolchain, and an MSVC staticlib cannot be linked by Rtools. The
      # failure is at link time and names neither cargo nor the target.
      - name: Install a Rust toolchain
        if: inputs.rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add the Windows GNU Rust target
        if: inputs.rust && runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          if [ "${RUNNER_ARCH}" = "ARM64" ]; then
            rustup target add aarch64-pc-windows-gnullvm
          else
            rustup target add x86_64-pc-windows-gnu
          fi

      - name: Record the Rust toolchain
        if: inputs.rust
        shell: bash
        run: |
          set -eu
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Cache cargo artefacts
        if: inputs.rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.rust-workspace }}
          shared-key: ${{ matrix.config.os }}-${{ matrix.config.r }}
          cache-on-failure: true

      # http-user-agent is read from the matrix row and is simply empty for
      # rows that omit it, which is what the r-lib template does too. It
      # matters only for an R-devel row, where the default agent can resolve
      # to packages built for the wrong R.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Apply caller environment
        if: inputs.env != ''
        shell: bash
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -eu
          printf '%s\n' "$CALLER_ENV" | while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
              *) echo "Ignoring malformed env line: $line" >&2 ;;
            esac
          done

      # error-on drops to "error" only when the caller listed warnings it
      # accepts; the gate step below then re-imposes the same strictness
      # against that list. With no list this is the action's own default.
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ inputs.args }}
          build_args: ${{ inputs.build-args }}
          upload-snapshots: true
          error-on: ${{ inputs.allowed-warnings == '' && '"warning"' || '"error"' }}

      # The allow-list is only meaningful if something still reads the log:
      # with error_on = "error" a WARNING no longer fails rcmdcheck, so this
      # step is what keeps every unlisted warning fatal. It parses the check
      # log rather than the exit status for exactly that reason.
      - name: Fail on any unexpected check warning
        if: inputs.allowed-warnings != ''
        shell: bash
        env:
          ALLOWED: ${{ inputs.allowed-warnings }}
        run: |
          set -eu

          log=$(ls check/*.Rcheck/00check.log 2>/dev/null | head -n 1 || true)
          if [ -z "$log" ]; then
            echo "No check/*.Rcheck/00check.log to read: the check did not" >&2
            echo "get far enough to report warnings." >&2
            exit 1
          fi

          pattern=$(printf '%s\n' "$ALLOWED" \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | grep -v '^#' | grep -v '^$' \
            | paste -sd '|' -)

          warnings=$(grep -E '^\* checking .* \.\.\. WARNING$' "$log" \
            | sed -E 's/^\* checking (.*) \.\.\. WARNING$/\1/' || true)

          if [ -n "$warnings" ]; then
            echo "--- warnings reported ---"
            printf '%s\n' "$warnings"
            echo "--- allowed ---"
            printf '%s\n' "$pattern"
          fi

          unexpected=$(printf '%s' "$warnings" | grep -Ev "^(${pattern})$" || true)

          if [ -n "$unexpected" ]; then
            echo >&2
            echo "Unexpected R CMD check WARNING(s), not in allowed-warnings:" >&2
            printf '%s\n' "$unexpected" >&2
            echo >&2
            sed -n '/WARNING$/,/^\* checking/p' "$log" >&2
            exit 1
          fi

          echo "No warnings outside the allow-list."

  containers:
    if: inputs.containers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    name: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(inputs.containers) }}

    container:
      image: ghcr.io/r-hub/containers/${{ matrix.container }}:latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # This job exists because the compiler differs from the one every other
      # job uses, so the log should say which compiler and which language
      # standard actually ran. Without it the first question after a
      # surprising result -- "is this image really the flavor I think it is?"
      # -- costs a debugging round trip.
      # The r-hub images ship no cargo at all, so a package with a crate in
      # src/ cannot install here without this. rustup's own installer rather
      # than the distro's, for the reason the `rust` input gives: these
      # packages routinely need a rustc newer than a distro carries.
      - name: Install a Rust toolchain
        if: inputs.rust
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Record the Rust toolchain
        if: inputs.rust
        run: |
          set -eu
          rustc --version
          cargo --version

      - name: Record the toolchain
        run: |
          set -eu
          R --version | head -1
          for v in CC CXX CFLAGS CXXFLAGS; do
            printf '%s = %s\n' "$v" "$(R CMD config $v)"
          done
          # R keeps the C standard in CC itself (`clang-23 -std=gnu23`), not
          # in CFLAGS, so ask the compiler rather than parsing the flag.
          echo '--- as the compiler sees it ---'
          printf 'int main(void){return 0;}\n' > /tmp/probe.c
          $(R CMD config CC) $(R CMD config CFLAGS) -dM -E /tmp/probe.c \
            | grep -E '__STDC_VERSION__|__clang_major__|^#define __GNUC__' || true

      # dependencies = TRUE, so Suggests are included: R CMD check reports a
      # missing Suggests as an ERROR, not a NOTE. _R_CHECK_FORCE_SUGGESTS_
      # below is the backstop for any that still will not install.
      - name: Install dependencies
        run: |
          set -eu
          Rscript -e 'pak::local_install_deps(".", dependencies = TRUE, upgrade = FALSE)'
          Rscript -e 'pak::pkg_install("any::rcmdcheck", upgrade = FALSE)'

      - name: Apply caller environment
        if: inputs.env != ''
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -eu
          printf '%s\n' "$CALLER_ENV" | while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
              *) echo "Ignoring malformed env line: $line" >&2 ;;
            esac
          done

      # Appended to whatever user Makevars the image already uses, never
      # pointed somewhere new. R_MAKEVARS_USER *replaces* the user Makevars
      # rather than supplementing it, and some images configure themselves
      # entirely through it: clang23 sets ENV R_MAKEVARS_USER=/root/.R/Makevars
      # and puts CC=clang-23 in that file rather than patching Makeconf.
      # Repointing the variable there silently threw the image's whole
      # toolchain away and fell back to Makeconf's gcc -- a container named
      # clang23 quietly checking with GCC, and passing.
      #
      # `+=` then does the right thing in both shapes: against clang23's
      # `CC=clang-23` it yields CRAN's own `clang-23 -std=gnu23`, and against
      # an image that patches Makeconf instead it appends to that.
      - name: Compile the way CRAN does
        if: inputs.container-makevars != ''
        env:
          MAKEVARS: ${{ inputs.container-makevars }}
        run: |
          set -eu
          target="${R_MAKEVARS_USER:-${HOME}/.R/Makevars}"
          mkdir -p "$(dirname "$target")"
          printf '%s\n' "$MAKEVARS" >> "$target"
          echo "--- appended to ${target} ---"
          cat "$target"

      # The probe above reports what the image ships; this one reports what
      # the check will actually use. Both are worth having: the gap between
      # them is the override, and an override that silently did nothing is
      # the failure mode this whole step exists to avoid.
      - name: Record the toolchain, after the override
        run: |
          set -eu
          for v in CC CXX CFLAGS CXXFLAGS; do
            printf '%s = %s\n' "$v" "$(R CMD config $v)"
          done
          printf 'int main(void){return 0;}\n' > /tmp/probe2.c
          $(R CMD config CC) $(R CMD config CFLAGS) -dM -E /tmp/probe2.c \
            | grep -E '__STDC_VERSION__|__clang_major__|^#define __GNUC__' || true

      # error_on = "warning" is the contract, and it is what check-r-package
      # does on the other job by default. A compiler diagnostic in a package's
      # own sources reaches R CMD check as the "significant warnings" WARNING
      # under "checking whether package can be installed" -- exactly what
      # CRAN's pretest rejects on, and exactly what a job failing only on
      # ERROR would report green.
      #
      # build_args is fixed here rather than taken from the caller: these
      # images carry no LaTeX, and vignette compaction needs tooling they do
      # not have either. The PDF manual is platform-independent, and the
      # macOS and Windows legs above build it. Note that a caller who
      # overrides `args` without keeping --no-manual will hit the same wall
      # from the check side.
      - name: Run R CMD check
        shell: Rscript {0}
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"
        run: |
          rcmdcheck::rcmdcheck(
            args = ${{ inputs.args }},
            build_args = c("--no-manual"),
            error_on = ${{ inputs.allowed-warnings == '' && '"warning"' || '"error"' }},
            check_dir = "check"
          )

      # The allow-list is only meaningful if something still reads the log:
      # with error_on = "error" a WARNING no longer fails rcmdcheck, so this
      # step is what keeps every unlisted warning fatal. It parses the check
      # log rather than the exit status for exactly that reason.
      - name: Fail on any unexpected check warning
        if: inputs.allowed-warnings != ''
        shell: bash
        env:
          ALLOWED: ${{ inputs.allowed-warnings }}
        run: |
          set -eu

          log=$(ls check/*.Rcheck/00check.log 2>/dev/null | head -n 1 || true)
          if [ -z "$log" ]; then
            echo "No check/*.Rcheck/00check.log to read: the check did not" >&2
            echo "get far enough to report warnings." >&2
            exit 1
          fi

          pattern=$(printf '%s\n' "$ALLOWED" \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | grep -v '^#' | grep -v '^$' \
            | paste -sd '|' -)

          warnings=$(grep -E '^\* checking .* \.\.\. WARNING$' "$log" \
            | sed -E 's/^\* checking (.*) \.\.\. WARNING$/\1/' || true)

          if [ -n "$warnings" ]; then
            echo "--- warnings reported ---"
            printf '%s\n' "$warnings"
            echo "--- allowed ---"
            printf '%s\n' "$pattern"
          fi

          unexpected=$(printf '%s' "$warnings" | grep -Ev "^(${pattern})$" || true)

          if [ -n "$unexpected" ]; then
            echo >&2
            echo "Unexpected R CMD check WARNING(s), not in allowed-warnings:" >&2
            printf '%s\n' "$unexpected" >&2
            echo >&2
            sed -n '/WARNING$/,/^\* checking/p' "$log" >&2
            exit 1
          fi

          echo "No warnings outside the allow-list."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.container }}
          path: check
          if-no-files-found: ignore

  # CRAN's NOSUGGESTS flavor: does the package degrade when its suggested
  # packages are absent, or does it error?
  #
  # Everything else in this repo asks whether the code is correct. This asks
  # whether the *declarations* are honest -- whether a package that lists a
  # dependency under Suggests actually treats it as optional. The usual
  # failures are a test file with a bare `library(pkg)` at top level, and an
  # example that uses a Suggests package without `@examplesIf` or a guard.
  #
  # `dependencies = NA` is the whole point: hard dependencies only, no
  # Suggests. Using the containers job with `dependencies = TRUE` instead
  # would install them and report a confident green having tested nothing.
  #
  # `_R_CHECK_FORCE_SUGGESTS_=false` is what makes a missing Suggests a
  # skipped check rather than an ERROR from R CMD check itself; the image
  # sets it too, and it is repeated here so the job does not depend on that.
  #
  # Known imperfection, stated rather than hidden: rcmdcheck depends on withr,
  # so installing it reinstates withr even though a caller may list it under
  # Suggests. The flavor still covers every other suggested package, and the
  # alternative -- running R CMD check by hand and grepping 00check.log for
  # WARNING -- reimplements `error_on = "warning"` to recover one package.
  nosuggests:
    if: inputs.nosuggests
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    name: nosuggests

    container:
      image: ghcr.io/r-hub/containers/nosuggests:latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # The r-hub images ship no cargo at all, so a package with a crate in
      # src/ cannot install here without this. rustup's own installer rather
      # than the distro's, for the reason the `rust` input gives: these
      # packages routinely need a rustc newer than a distro carries.
      - name: Install a Rust toolchain
        if: inputs.rust
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Record the Rust toolchain
        if: inputs.rust
        run: |
          set -eu
          rustc --version
          cargo --version

      - name: Install hard dependencies only
        run: |
          set -eu
          Rscript -e 'pak::local_install_deps(".", dependencies = NA, upgrade = FALSE)'
          Rscript -e 'pak::pkg_install("any::rcmdcheck", upgrade = FALSE)'

      # The log to read when this job fails and the others pass. The question
      # is always "which suggested package was actually missing", and the
      # answer is here rather than in the check output.
      - name: Record which suggested packages are absent
        shell: Rscript {0}
        run: |
          sug <- read.dcf("DESCRIPTION")[1, "Suggests"]
          if (is.na(sug)) { cat("No Suggests declared.\n"); quit(save = "no") }
          pkgs <- trimws(sub("[(].*", "", strsplit(sug, ",")[[1]]))
          pkgs <- pkgs[nzchar(pkgs)]
          have <- vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)
          cat(sprintf("%-20s %s\n", pkgs, ifelse(have, "installed", "ABSENT")), sep = "")

      - name: Apply caller environment
        if: inputs.env != ''
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -eu
          printf '%s\n' "$CALLER_ENV" | while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
              *) echo "Ignoring malformed env line: $line" >&2 ;;
            esac
          done

      - name: Run R CMD check
        shell: Rscript {0}
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"
        run: |
          rcmdcheck::rcmdcheck(
            args = ${{ inputs.args }},
            build_args = c("--no-manual"),
            error_on = ${{ inputs.allowed-warnings == '' && '"warning"' || '"error"' }},
            check_dir = "check"
          )

      # The allow-list is only meaningful if something still reads the log:
      # with error_on = "error" a WARNING no longer fails rcmdcheck, so this
      # step is what keeps every unlisted warning fatal. It parses the check
      # log rather than the exit status for exactly that reason.
      - name: Fail on any unexpected check warning
        if: inputs.allowed-warnings != ''
        shell: bash
        env:
          ALLOWED: ${{ inputs.allowed-warnings }}
        run: |
          set -eu

          log=$(ls check/*.Rcheck/00check.log 2>/dev/null | head -n 1 || true)
          if [ -z "$log" ]; then
            echo "No check/*.Rcheck/00check.log to read: the check did not" >&2
            echo "get far enough to report warnings." >&2
            exit 1
          fi

          pattern=$(printf '%s\n' "$ALLOWED" \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | grep -v '^#' | grep -v '^$' \
            | paste -sd '|' -)

          warnings=$(grep -E '^\* checking .* \.\.\. WARNING$' "$log" \
            | sed -E 's/^\* checking (.*) \.\.\. WARNING$/\1/' || true)

          if [ -n "$warnings" ]; then
            echo "--- warnings reported ---"
            printf '%s\n' "$warnings"
            echo "--- allowed ---"
            printf '%s\n' "$pattern"
          fi

          unexpected=$(printf '%s' "$warnings" | grep -Ev "^(${pattern})$" || true)

          if [ -n "$unexpected" ]; then
            echo >&2
            echo "Unexpected R CMD check WARNING(s), not in allowed-warnings:" >&2
            printf '%s\n' "$unexpected" >&2
            echo >&2
            sed -n '/WARNING$/,/^\* checking/p' "$log" >&2
            exit 1
          fi

          echo "No warnings outside the allow-list."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-nosuggests
          path: check
          if-no-files-found: ignore

  # CRAN's NOLD flavor: R built --disable-long-double.
  #
  # On x86 Linux, C `long double` is 80-bit, and R uses it for accumulating
  # sums and in parts of its numeric printing. Code that happens to be correct
  # only because of those extra bits gives different answers here -- which is
  # why this flavor exists, and why it is worth running for anything that
  # converts between text and numbers.
  #
  # Suggests are installed: unlike the job above, this one wants the test
  # suite to run in full, since a numeric difference shows up as a failing
  # test rather than as a check condition.
  #
  # No container-makevars. See the input's description: this image is not a
  # compiler flavor, and the override belongs only to those that are.
  nold:
    if: inputs.nold
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    name: nold

    container:
      image: ghcr.io/r-hub/containers/nold:latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # Proves the image is what the job name claims. R reports the size of
      # its long double as capabilities("long.double"); FALSE is the whole
      # reason this job exists, and TRUE means the image is not what we think.
      # The r-hub images ship no cargo at all, so a package with a crate in
      # src/ cannot install here without this. rustup's own installer rather
      # than the distro's, for the reason the `rust` input gives: these
      # packages routinely need a rustc newer than a distro carries.
      - name: Install a Rust toolchain
        if: inputs.rust
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Record the Rust toolchain
        if: inputs.rust
        run: |
          set -eu
          rustc --version
          cargo --version

      - name: Record the long double configuration
        shell: Rscript {0}
        run: |
          cat("R version:      ", R.version.string, "\n", sep = "")
          cat("long double:    ", capabilities("long.double"), "\n", sep = "")
          cat("sizeof(LDOUBLE):", .Machine$sizeof.longdouble, "\n", sep = "")
          if (isTRUE(capabilities("long.double")))
            stop("This image has long double enabled; it is not the nold flavor.")

      - name: Install dependencies
        run: |
          set -eu
          Rscript -e 'pak::local_install_deps(".", dependencies = TRUE, upgrade = FALSE)'
          Rscript -e 'pak::pkg_install("any::rcmdcheck", upgrade = FALSE)'

      - name: Apply caller environment
        if: inputs.env != ''
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -eu
          printf '%s\n' "$CALLER_ENV" | while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
              *) echo "Ignoring malformed env line: $line" >&2 ;;
            esac
          done

      - name: Run R CMD check
        shell: Rscript {0}
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"
        run: |
          rcmdcheck::rcmdcheck(
            args = ${{ inputs.args }},
            build_args = c("--no-manual"),
            error_on = ${{ inputs.allowed-warnings == '' && '"warning"' || '"error"' }},
            check_dir = "check"
          )

      # The allow-list is only meaningful if something still reads the log:
      # with error_on = "error" a WARNING no longer fails rcmdcheck, so this
      # step is what keeps every unlisted warning fatal. It parses the check
      # log rather than the exit status for exactly that reason.
      - name: Fail on any unexpected check warning
        if: inputs.allowed-warnings != ''
        shell: bash
        env:
          ALLOWED: ${{ inputs.allowed-warnings }}
        run: |
          set -eu

          log=$(ls check/*.Rcheck/00check.log 2>/dev/null | head -n 1 || true)
          if [ -z "$log" ]; then
            echo "No check/*.Rcheck/00check.log to read: the check did not" >&2
            echo "get far enough to report warnings." >&2
            exit 1
          fi

          pattern=$(printf '%s\n' "$ALLOWED" \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | grep -v '^#' | grep -v '^$' \
            | paste -sd '|' -)

          warnings=$(grep -E '^\* checking .* \.\.\. WARNING$' "$log" \
            | sed -E 's/^\* checking (.*) \.\.\. WARNING$/\1/' || true)

          if [ -n "$warnings" ]; then
            echo "--- warnings reported ---"
            printf '%s\n' "$warnings"
            echo "--- allowed ---"
            printf '%s\n' "$pattern"
          fi

          unexpected=$(printf '%s' "$warnings" | grep -Ev "^(${pattern})$" || true)

          if [ -n "$unexpected" ]; then
            echo >&2
            echo "Unexpected R CMD check WARNING(s), not in allowed-warnings:" >&2
            printf '%s\n' "$unexpected" >&2
            echo >&2
            sed -n '/WARNING$/,/^\* checking/p' "$log" >&2
            exit 1
          fi

          echo "No warnings outside the allow-list."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-nold
          path: check
          if-no-files-found: ignore
