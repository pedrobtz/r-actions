on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: >
          Job timeout. Without one, a hung pull or analysis holds the runner
          for GitHub's six-hour default.
        type: number
        required: false
        default: 60
      skip-docs-only:
        description: >
          Skip every job here when a push or pull request changes
          documentation only: Markdown at the top level or under a dot
          directory (`.github/`, `.agents/`), `_pkgdown.yml`, and `pkgdown/`.
          Anything else runs as before, `man/`, `vignettes/` and the `.md`
          snapshots under `tests/` included. So does every case where the
          changed files cannot be listed: a new branch, a force-push, an API
          failure, a manual or scheduled run. See "Documentation-only
          changes" in the README.
        type: boolean
        required: false
        default: true
      fail-on-findings:
        description: >
          Fail the job when rchk reports anything, instead of warning and
          uploading the output.

          The default stays informational because rchk reports false
          positives that need human judgement, and a package meeting it for
          the first time should not have its build blocked while it works
          through them. Once a package is at zero findings the calculation
          reverses: the next one is a regression, and a warning nobody opens
          is not how you learn about it. Turn this on then.
        type: boolean
        required: false
        default: false
      baseline:
        description: >
          Path to a file of accepted findings, relative to the repository
          root. With one set and fail-on-findings on, the job fails only on
          findings that are *not* listed -- the same shape, and the same
          reason, as valgrind.yml's `suppressions`. With fail-on-findings off
          it only filters what is reported, and the job says so.

          fail-on-findings alone is a boolean, and a boolean has one bad day
          in it. The first time rchk reports a false positive against a
          package that has already turned the gate on, the choices are to
          leave CI red on something that is not a bug, or to set
          fail-on-findings: false and lose the gate entirely -- including for
          the real regression next month. The second is what actually
          happens, because a red check everyone knows is wrong gets routed
          around within a day.

          Each line is one finding, as three tab-separated fields:

              UP<TAB>cyaml_parse_document<TAB>src/cyaml_parser.c

          `#` comments and blank lines are ignored. When the job finds
          something unlisted it prints the exact lines to add, so adopting a
          finding is copy-and-paste rather than transcription.

          Deliberately keyed on tag, function and file, and deliberately not
          on the line number or the message. Line numbers move with any edit
          above them, and a baseline that goes stale on unrelated commits is
          one people stop trusting. The cost of leaving them out is that two
          findings of the same tag in one function collapse to a single
          entry; that is the trade, and it is the right way round.

          A baseline entry that stops reproducing is also reported, and fails
          the job when the gate is on. Without that the file only ever grows:
          entries accumulate, nobody removes them, and eventually one
          suppresses a real finding it happens to match. Making a
          disappeared entry an error means fixing the code forces you to
          delete its line, so the file shrinks over time instead.
        type: string
        required: false
        default: ""
      github-packages:
        description: >
          R packages on GitHub to install into the rchk image's library
          before the package is analysed: one `owner/repo` a line, each
          optionally `@ref` (a branch, a tag or a commit). In the order
          given, so list a package after anything it needs.

          The image installs a package's dependencies itself, but only from
          CRAN and Bioconductor; a `Remotes:` field means nothing to it. A
          package that links to another not yet on CRAN -- `LinkingTo` a
          sibling's headers, say -- therefore could not be analysed at all:
          the install fails and nothing is checked. Each repository named
          here is fetched, built with `R CMD build`, and installed with the
          image's own R into the library rchk then finds it in, so the
          image skips it. Drop the entry once the dependency is on CRAN.

              github-packages: |
                pedrobtz/zufast
        type: string
        required: false
        default: ""

name: rchk

# Nothing here writes through the token, so `contents: read` is enough: the
# job reads the checkout, and artifact upload, the cache and a public ghcr.io
# image each need no declared scope.
#
# This is not only least privilege. `read-all` is wider than the `read` that a
# repository hands its GITHUB_TOKEN by default, and a called workflow cannot
# be granted more than its caller holds -- so requesting it here made every
# caller that did not declare permissions of its own fail with an unannotated
# `startup_failure`, two seconds in, before any job was created.
permissions:
  contents: read

jobs:
  # Skips the jobs below when a push or pull request changes documentation
  # only; see the `skip-docs-only` input. Every workflow it gates carries an
  # identical copy -- inline for the reason sanitizers.yml gives for not
  # factoring out a composite action -- and tests/lint-workflows.py keeps the
  # copies identical and the wiring complete.
  #
  # The gated jobs test `!cancelled()` in place of the implicit `success()`,
  # so this job failing, or being skipped, runs them rather than dropping
  # them. Only an explicit `docs-only=true` skips anything.
  changes:
    name: docs-only gate
    if: inputs.skip-docs-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Classify the changed files
        id: classify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
        run: |
          # Anything short of a complete list of changed files, every one of
          # them documentation, leaves this false and every job runs.
          docs_only=false
          trap 'echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"' EXIT

          case "$EVENT" in
            pull_request|pull_request_target)
              base=$PR_BASE head=$PR_HEAD ;;
            push)
              # `before` is all zeros for a new branch, and after a
              # force-push it may no longer exist.
              if [ "$FORCED" = true ] || [ -z "${BEFORE//0/}" ]; then
                echo "New branch or force-push: no diff to go by, so everything runs."
                exit 0
              fi
              base=$BEFORE head=$AFTER ;;
            *)
              echo "A $EVENT run has no changed files to go by, so everything runs."
              exit 0 ;;
          esac

          # The compare API rather than the pull request's file list, which
          # would need `pull-requests: read`: a scope the caller may not hold,
          # and asking for one is a startup_failure. Three dots diff from the
          # merge base, which for a pull request is exactly what it changes,
          # from its first commit on.
          # A rename is listed under its new name, with the old one in
          # previous_filename; both count, or `git mv R/x.R x.md` reads as a
          # documentation-only change.
          if ! files=$(gh api "repos/$REPO/compare/$base...$head" \
                         --jq '(.files // []) | length, (.[] | .filename, (.previous_filename // empty))'); then
            echo "Could not list the changed files, so everything runs."
            exit 0
          fi

          # compare lists at most 300 files and truncates silently past that.
          count=$(head -n 1 <<<"$files")
          if ! [[ $count =~ ^[0-9]+$ ]] || [ "$count" -eq 0 ] || [ "$count" -ge 300 ]; then
            echo "Cannot rely on a list of '$count' changed files, so everything runs."
            exit 0
          fi

          # Markdown in `tests/` is not documentation -- testthat snapshots
          # and fixtures are .md -- and neither is Markdown under `fuzz/` or
          # `inst/`, so .md counts only at the top level or under a dot
          # directory, which a package does not ship.
          all_docs=true
          while IFS= read -r f; do
            case "$f" in
              _pkgdown.yml|_pkgdown.yaml|pkgdown/*) kind=docs ;;
              .*/*.md) kind=docs ;;
              */*) kind=code ;;
              *.md) kind=docs ;;
              *) kind=code ;;
            esac
            printf '%-5s %s\n' "$kind" "$f"
            [ "$kind" = docs ] || all_docs=false
          done < <(tail -n +2 <<<"$files")

          if [ "$all_docs" = true ]; then
            docs_only=true
            echo "Documentation only: the jobs in this workflow are skipped." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  rchk:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Build source tarball
        run: R CMD build --no-build-vignettes --no-manual .

      # Before the analysis, so that the image finds them installed. Cloned
      # outside the workspace: nothing here may ride along into the
      # package's own tarball.
      - name: Install GitHub packages into the image
        if: inputs.github-packages != ''
        env:
          GITHUB_PACKAGES: ${{ inputs.github-packages }}
        run: |
          set -eu
          # One `owner/repo[@ref]` a line; `#` starts a comment. The ref may
          # be a branch, a tag or a commit, so it is fetched rather than
          # cloned with --branch, which takes no commit. Read from the
          # environment, never interpolated into this script.
          fetch_github_packages() {   # $1: the directory to clone into
            mkdir -p "$1"
            printf '%s\n' "$GITHUB_PACKAGES" | while IFS= read -r line; do
              spec=$(printf '%s' "${line%%#*}" | tr -d '[:space:]')
              [ -n "$spec" ] || continue
              repo=${spec%%@*}
              ref=HEAD
              case "$spec" in *@*) ref=${spec#*@} ;; esac
              if ! printf '%s' "$repo" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' \
                 || ! printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9_./-]+$'; then
                echo "::error::github-packages: not owner/repo[@ref]: ${spec}"
                exit 1
              fi
              dir="$1/${repo##*/}"
              git init --quiet "$dir"
              git -C "$dir" fetch --quiet --depth 1 "https://github.com/${repo}.git" "$ref"
              git -C "$dir" checkout --quiet FETCH_HEAD
              echo "$dir" >> "$1/order.txt"
              echo "${repo}@${ref} -> ${dir} ($(git -C "$dir" rev-parse --short HEAD))"
            done
          }
          src="$RUNNER_TEMP/github-packages"
          fetch_github_packages "$src"
          # One numbered directory a package, built in the order given, so
          # the install below follows the list whatever the packages are
          # called.
          n=0
          while IFS= read -r d; do
            n=$((n + 1))
            out="rchk-packages/github/$(printf '%02d' "$n")"
            mkdir -p "$out"
            (cd "$out" && R CMD build --no-build-vignettes --no-manual "$d" >/dev/null)
            echo "built $(ls "$out")"
          done < "$src/order.txt"
          cat > rchk-packages/github/install.R <<'RSCRIPT'
          lib <- Sys.getenv("R_LIBS")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          for (d in sort(list.dirs("/rchk/packages/github", recursive = FALSE))) {
            tarball <- Sys.glob(file.path(d, "*.tar.gz"))
            stopifnot(length(tarball) == 1L)
            install.packages(tarball, lib = lib, repos = NULL)
            pkg <- sub("_.*", "", basename(tarball))
            if (!requireNamespace(pkg, lib.loc = lib, quietly = TRUE)) {
              stop("installing ", pkg, " from GitHub failed")
            }
          }
          RSCRIPT
          docker run --rm -v "$(pwd)/rchk-packages":/rchk/packages \
            kalibera/rchk:latest R -f /rchk/packages/github/install.R

      # pipefail, because the default shell has none: without it the exit
      # status is tee's, so a failed pull, an rchk crash or a package that
      # would not install left an empty log -- which the steps below read as
      # "no findings" and passed, fail-on-findings or not.
      #
      # A non-zero exit fails the step only when the log shows no analysis
      # at all. Whether the image also exits non-zero on findings is not
      # documented, and a run that did analyse is for the gate below to
      # judge, under fail-on-findings, rather than for this step.
      #
      # The tarball is named from DESCRIPTION rather than globbed, so another
      # .tar.gz in the repository cannot ride along into the container.
      - name: Run rchk in Docker
        run: |
          set -o pipefail
          tarball="$(sed -n 's/^Package:[[:space:]]*//p' DESCRIPTION)_$(sed -n 's/^Version:[[:space:]]*//p' DESCRIPTION).tar.gz"
          mkdir -p rchk-packages
          mv "$tarball" rchk-packages/
          status=0
          docker run --rm -v "$(pwd)/rchk-packages":/rchk/packages \
            kalibera/rchk:latest "/rchk/packages/${tarball}" | tee rchk-output.txt || status=$?
          if [ "$status" -ne 0 ]; then
            if grep -qE '^Function |\[(UP|PB|UPB)\]|Suspicious call|too many states' rchk-output.txt; then
              echo "::warning::rchk exited ${status} after analysing; the findings decide"
            else
              echo "::error::rchk exited ${status} without analysing anything: the pull, build or install failed"
              exit 1
            fi
          fi

          # The image exits 0 when the package will not install -- seen with
          # a configure script whose system library the image lacks -- and
          # then analyses nothing. Its own messages are the only sign.
          if grep -qE '^Could not install package|^Cannot find package ' rchk-output.txt; then
            echo "::error::rchk could not install the package, so nothing was analysed; see the install output above"
            exit 1
          fi

      # The pattern matters more than it looks.
      #
      # It used to include "too many", which matches rchk's
      #
      #   ERROR: too many states (abstraction error?) in function bcEval_loop
      #
      # Those functions -- bcEval_loop, RunGenCollect, strptime_internal --
      # are R's own, not the package's: rchk analyses the package linked
      # against R, and this line means it hit its own abstraction limit and
      # gave up on a function, not that it found anything. It appears for
      # essentially every package, so the old pattern warned on every run and
      # the warning meant nothing. With fail-on-findings it would fail every
      # run instead, which is how it was noticed.
      #
      # Real findings carry rchk's diagnostic tags -- [UP] unprotected, [PB]
      # protect balance, [UPB] both -- and name a line in the package's own
      # source. Those are what this matches.
      # Findings are parsed into a stable key before anything is decided,
      # because the raw line cannot be compared against anything twice.
      #
      # rchk emits two shapes. Its source (linemsg.cpp) prints a function
      # header and then indented messages carrying the tag:
      #
      #   Function cyaml_parse_document
      #     [UP] unprotected variable v while calling ... /path/src/cyaml.c:412
      #
      # and maacheck puts everything on one line, naming the function after
      # "at" (this is the example in rchk's own README):
      #
      #   WARNING Suspicious call (...) to Rf_setAttrib at read_jpeg /rchk/trunk/packages/build/IsnsJjDm/jpeg/src/read.c:131
      #
      # Note what that path contains. rchk builds the package in a directory
      # with a random name -- IsnsJjDm above -- so the absolute path differs
      # on every single run. A baseline keyed on it would match nothing,
      # ever, and would look exactly like a package that had fixed all its
      # findings. Paths are cut back to the package-relative form, src/... ,
      # which is also how a human would write one down.
      #
      # Line numbers are dropped for the reason the input documents: they
      # move with any edit above them.
      - name: Parse findings
        if: always()
        run: |
          set -eu
          if [ ! -f rchk-output.txt ]; then
            echo "rchk produced no output." >&2
            exit 1
          fi

          awk '
            function normpath(p,   n, a) {
              # Everything from the last /src/ onwards, else the bare name.
              if (match(p, /.*\/src\//)) return "src/" substr(p, RLENGTH + 1)
              n = split(p, a, "/")
              return a[n]
            }
            # "ERROR: too many states" names R functions rchk gave up on, not
            # findings. Reported separately, never keyed.
            /^ERROR: too many states/ { next }
            /^Function [^ ]/          { fn = $2; next }
            {
              if ($0 !~ /\[UP\]|\[PB\]|\[UPB\]|unprotected|negative depth|imbalanced/) next

              tag = ""
              if (match($0, /\[(UP|PB|UPB)\]/)) tag = substr($0, RSTART + 1, RLENGTH - 2)
              else if ($0 ~ /^WARNING/)         tag = "WARNING"

              loc = $NF
              where = ""
              if (loc ~ /:[0-9]+$/) { sub(/:[0-9]+$/, "", loc); where = normpath(loc) }

              who = fn
              if ($0 ~ /^WARNING/ && NF >= 3 && $(NF-2) == "at") who = $(NF-1)

              # Anything that matched as a finding but could not be keyed is
              # kept, not dropped. A parser that silently discards what it
              # does not understand turns a format change upstream into a
              # green build, which is the one outcome this must never have.
              if (tag == "" || where == "" || who == "") {
                print $0 >> "findings.unparsed"
                next
              }
              printf "%s\t%s\t%s\n", tag, who, where >> "findings.keys"
              printf "%s\t%s\t%s\t%s\n", tag, who, where, $0 >> "findings.detail"
            }
          ' rchk-output.txt

          for f in findings.keys findings.detail findings.unparsed; do
            [ -f "$f" ] || : > "$f"
          done
          sort -u findings.keys -o findings.keys

          echo "----- rchk findings -----"
          if [ -s findings.keys ]; then
            cat findings.keys
          else
            echo "(none)"
          fi
          if [ -s findings.unparsed ]; then
            echo "----- matched as findings but could not be keyed -----"
            cat findings.unparsed
          fi

          # Reported, never failed: this is analysis coverage, not a result.
          if grep -E "too many states" rchk-output.txt; then
            echo "::notice::rchk hit its abstraction limit on the functions above" \
                 "and did not analyse them; these are usually R's own."
          fi

      - name: Compare against the baseline
        if: always()
        env:
          BASELINE: ${{ inputs.baseline }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          set -eu

          if [ -n "$BASELINE" ] && [ ! -f "$BASELINE" ]; then
            echo "::error::baseline: no such file: ${BASELINE}"
            exit 1
          fi
          if [ -n "$BASELINE" ] && [ "$FAIL_ON_FINDINGS" != "true" ]; then
            echo "::warning::baseline is set but fail-on-findings is off, so nothing here can fail the job; set fail-on-findings: true to gate on it"
          fi

          : > baseline.keys
          if [ -n "$BASELINE" ]; then
            sed -e 's/#.*$//' -e 's/[[:space:]]*$//' "$BASELINE" \
              | grep -v '^[[:space:]]*$' | sort -u > baseline.keys || true
          fi

          comm -23 findings.keys baseline.keys > findings.new || true
          comm -13 findings.keys baseline.keys > baseline.stale || true

          new=$(wc -l < findings.new | tr -d ' ')
          stale=$(wc -l < baseline.stale | tr -d ' ')
          unparsed=$(wc -l < findings.unparsed | tr -d ' ')

          {
            echo "## rchk"
            echo
            echo "| | count |"
            echo "|:--|--:|"
            echo "| findings | $(wc -l < findings.keys | tr -d ' ') |"
            echo "| accepted by baseline | $(wc -l < baseline.keys | tr -d ' ') |"
            echo "| **new** | ${new} |"
            echo "| baseline entries that did not reproduce | ${stale} |"
            [ "$unparsed" -eq 0 ] || echo "| unrecognised finding lines | ${unparsed} |"
            echo
            if [ "$new" -gt 0 ]; then
              echo "### New findings"
              echo
              echo '```'
              while IFS= read -r key; do
                grep -F "$key" findings.detail | cut -f4- || printf '%s\n' "$key"
              done < findings.new
              echo '```'
              echo
              echo "To accept these, add to \`${BASELINE:-your baseline file}\`:"
              echo
              echo '```'
              cat findings.new
              echo '```'
            fi
            if [ "$stale" -gt 0 ]; then
              echo "### Baseline entries that did not reproduce"
              echo
              echo "Delete these lines; the findings they accept are gone."
              echo
              echo '```'
              cat baseline.stale
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          status=0

          # Follows the gate rather than overriding it. An unrecognised line
          # means this job may be missing findings -- rchk's output format
          # having moved, most likely -- which makes the gate unsound and has
          # to fail while it is on. With the gate off nothing is being gated,
          # and turning a caller's informational job red because rchk changed
          # a message would break the promise the default makes.
          if [ "$unparsed" -gt 0 ]; then
            if [ "$FAIL_ON_FINDINGS" = "true" ]; then
              echo "::error::${unparsed} line(s) look like findings but do not match any format this job knows"
              status=1
            else
              echo "::warning::${unparsed} line(s) look like findings but could not be keyed"
            fi
            cat findings.unparsed
          fi

          if [ "$new" -gt 0 ]; then
            echo "----- new findings -----"
            cat findings.new
            if [ "$FAIL_ON_FINDINGS" = "true" ]; then
              echo "::error::rchk reported ${new} finding(s) not in the baseline"
              status=1
            else
              echo "::warning::rchk reported ${new} finding(s); review the rchk-output artifact"
            fi
          fi

          if [ "$stale" -gt 0 ]; then
            echo "----- baseline entries that did not reproduce -----"
            cat baseline.stale
            if [ "$FAIL_ON_FINDINGS" = "true" ]; then
              echo "::error::${stale} baseline entry/entries no longer reproduce; delete them"
              status=1
            else
              echo "::warning::${stale} baseline entry/entries no longer reproduce; delete them"
            fi
          fi

          if [ "$new" -eq 0 ] && [ "$stale" -eq 0 ] && [ "$unparsed" -eq 0 ]; then
            echo "rchk found no PROTECT issues outside the baseline."
          fi

          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rchk-output
          path: |
            rchk-output.txt
            findings.keys
            findings.detail
            findings.unparsed
          if-no-files-found: ignore
