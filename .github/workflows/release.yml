# Moves the major tag when a release is published.
#
# Consumers pin `@v1`, and the README promises them every backwards-compatible
# release through it. Moving the tag by hand is the step that got skipped:
# v1 once sat fourteen commits and four releases behind main. self-test's
# major-tag job notices that afterwards; this makes it not happen.
on:
  release:
    types: [published]

name: release

# The tag is a ref, so moving it is a write to contents.
permissions:
  contents: write

jobs:
  major-tag:
    name: move the major tag
    # Releases only, and (below) only plain vX.Y.Z: a prerelease or a tag of
    # another shape is not something @v1 consumers should be moved onto.
    if: >-
      !github.event.release.prerelease
      && !github.event.release.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Point the major tag at this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! [[ $TAG =~ ^(v[0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::${TAG} is not vX.Y.Z; leaving the major tag alone."
            exit 0
          fi
          major="${BASH_REMATCH[1]}"

          # A release for an older line must not drag the major tag back.
          newest="$(git tag -l "${major}.*" | grep -E "^${major}(\.[0-9]+)+$" | sort -V | tail -1)"
          if [ "$newest" != "$TAG" ]; then
            echo "::notice::${TAG} is not the newest ${major} release (${newest} is); leaving ${major} alone."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sha="$(git rev-list -n1 "$TAG")"
          git tag -f -a "$major" "$sha" -m "${major} -> ${TAG}"
          git push --force origin "refs/tags/${major}"
          echo "${major} now points at ${TAG} (${sha:0:8})."

          bash tests/check-major-tag.sh "$major"
