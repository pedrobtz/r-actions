on:
  workflow_call:
    inputs:
      env:
        description: >
          Extra environment variables for the check step, one NAME=VALUE per
          line. Exists so a caller can opt into test paths that are normally
          skipped -- an exhaustive sweep behind a package's own
          PKG_SLOW_TESTS flag, say. Without it a caller who wants that has to
          copy this whole job, and a copied sanitizer job is one that stops
          being maintained.

          Do not put secrets here: workflow inputs are not masked in logs.
        type: string
        required: false
        default: ""
      r-version:
        description: >
          R version to test against. Defaults to devel, which is where new
          UB tends to surface first.
        type: string
        required: false
        default: devel
      timeout-minutes:
        description: >
          Job timeout in minutes. An instrumented build is several times
          slower than an ordinary one, and the suite runs slower still.
        type: number
        required: false
        default: 60
      extra-ubsan-checks:
        description: >
          Extra `-fsanitize=` flags for the UBSan build, appended to the ones
          this workflow already sets. Empty by default. Applies to the clang
          leg of the `sanitizers` job, and to the `asan` containers whose
          compiler is clang.

          CRAN runs UBSan as the `undefined` group, and matching the flavor
          that can reject a submission is what the default is for. This is
          for the checks outside that group, which are aimed at exactly the
          arithmetic a parser does constantly:

              -fsanitize=integer              unsigned overflow, truncation
              -fsanitize=implicit-conversion  narrowing that loses data
              -fsanitize=local-bounds         bounds on local arrays

          `integer` is the one with the best ratio. Unsigned overflow is
          defined behaviour, so CRAN has no reason to check it, and it is
          still a bug when it happens to a size, an offset or a depth
          counter: a package whose safety rests on bounded counters is
          making a claim about precisely this arithmetic, and a counter that
          wraps is that claim failing.

          None of these can be the default, because they fire on correct and
          deliberate code -- hash mixing wants wrapping, and a checked
          narrowing is still a narrowing. That is the argument for an input
          rather than a wider default set: a package with bounded-input
          claims to defend will take the noise, and a package without them
          should not have to.

          These are clang spellings. The `integer`, `implicit-conversion`
          and `local-bounds` groups do not exist in GCC, so this is not
          applied to the gcc leg or to a container whose compiler is GCC --
          either would otherwise fail to build rather than fail to check. The
          job says so when it skips.

          Findings from these checks fail the job like the default set, and
          like the default set they are collected rather than halting at the
          first: one run lists every site, so adoption means reading one
          report and recording the deliberate cases in `ubsan-suppressions`.
        type: string
        required: false
        default: ""
      gcc-ubsan-flags:
        description: >
          The GCC counterpart to `extra-ubsan-checks`: flags appended to the
          gcc leg of the `sanitizers` job, and to the sanitizer build on
          `asan` containers whose compiler is GCC. Empty by default.
          Spellings are GCC's, and nothing here is applied to clang.

          The input above only adds checks, because clang's extra groups are
          all opt-in. This one exists because on GCC the interesting case is
          the other direction. The gcc leg and the `gcc-asan` image both
          compile with `bounds-strict`, which is outside the `undefined`
          group. What it adds is instrumentation of trailing arrays against
          their declared size: flexible array members, and the `T data[0]` /
          `T data[1]` struct hack that precedes them -- which every
          MiniSat-derived solver, and a good deal of vendored C, is built on.

          CRAN's gcc-UBSAN flavor compiles with
          `-fsanitize=address,undefined,bounds-strict`
          (https://www.stats.ox.ac.uk/pub/bdr/memtests/README.txt), so a
          `bounds-strict` finding is one CRAN reports too: mdbx 0.1.0 was
          flagged for `index 1 out of bounds for type 'iovec [1]'`, in
          vendored code, by exactly this. The fix there was in the source --
          a true flexible array member (`T data[]`), or indexing through a
          pointer where the array sits in a union.

          `-fno-sanitize=bounds-strict` here switches it back off. Use that
          only for a construct you cannot change and have decided to defend
          to CRAN, not to quiet a finding that reproduces under plain
          `-fsanitize=undefined`: those are real, and the job is doing its
          job.
        type: string
        required: false
        default: ""
      ubsan-suppressions:
        description: >
          Path to a UBSan suppressions file, relative to the repository root.
          Entries are `<check>:<file or function>`, one per line, as in

              unsigned-integer-overflow:src/hash.c
              implicit-signed-integer-truncation:pack_header

          This exists for the same reason `extra-ubsan-checks` does. A check
          that fires on deliberate code is only usable if the deliberate
          cases can be written down, and the alternative -- turning the check
          back off -- loses the real finding along with the noise.

          Resolved against the workspace here rather than passed through
          verbatim, because the sanitizer runtime resolves a relative path
          against the process working directory, falling back to the
          directory of the executable. Under `R CMD check` the first is the
          .Rcheck tests directory and the second is wherever R itself is
          installed, so neither is the checkout and a caller cannot write a
          relative path that works. `valgrind.yml`'s `suppressions` input
          avoids the same trap for the same reason.

          A path the runtime cannot read aborts the process that was given
          it, which during a check arrives as an unexplained test failure, so
          the job checks the file is there before running anything.
        type: string
        required: false
        default: ""
      ubsan-compilers:
        description: >
          JSON array of compilers for the `sanitizers` job, one leg each.
          Default `["clang", "gcc"]`, the two UBSan flavors CRAN runs:

              clang  -fsanitize=undefined -fno-sanitize=function
              gcc    -fsanitize=undefined,bounds-strict

          They find different things. clang treats any trailing array as
          flexible and never checks one; gcc's bounds-strict checks it
          against its declared size. `["clang"]` restores the single leg this
          job had before 1.17.0 -- a narrower check than CRAN's, so prefer
          fixing what the gcc leg finds.
        type: string
        required: false
        default: '["clang", "gcc"]'
      asan:
        description: >
          Also run the `asan` job below: AddressSanitizer, in the R-hub
          containers. Off by default, so that turning it on is a decision a
          package makes rather than something it acquires from a tag bump.

          Read the comment on that job before enabling it -- ASan and UBSan
          answer different questions, and this one costs more.
        type: boolean
        required: false
        default: false
      profile:
        description: >
          `quick` skips the `asan` job, leaving UBSan on the runner. Anything
          else, including the default `full`, runs both. The same input, with
          the same meaning, as r-cmd-check.yml's.

          UBSan stays because it is one ordinary runner and a few minutes.
          The asan job is two more containers, and heap errors are left to
          the full run, where valgrind.yml looks for them as well.
        type: string
        required: false
        default: full
      asan-containers:
        description: >
          JSON array of R-hub container names for the `asan` job. Names come
          from https://r-hub.github.io/containers/. `clang-ubsan` works here
          too and overlaps with the `sanitizers` job, which runs UBSan on an
          ordinary runner instead.
        type: string
        required: false
        default: '["clang-asan", "gcc-asan"]'
      asan-run:
        description: >
          Shell command for the `asan` job to run instead of `R CMD check`.

          The default path is fine for most packages -- measured at about two
          minutes on a package with five Suggests, which pak resolved as
          binaries from the image's own repository rather than building them.
          Reach for this when that does not hold: a Suggests with no binary
          for the image, a suite too slow to run instrumented, or a package
          whose interesting paths are not the ones its tests spend time on.

          A sanitizer earns its keep on error and unwind paths -- where an
          R-level longjmp skips whatever C had allocated -- and an ordinary
          suite exercises those only incidentally. A small driver aimed at
          them, using base R only, needs no dependencies at all: pair this
          with asan-dependencies: false.

          Whatever it prints is scanned for sanitizer diagnostics, and a
          non-zero exit fails the job.
        type: string
        required: false
        default: ""
      asan-dependencies:
        description: >
          Install all of the package's dependencies in the `asan` job,
          Suggests included, because `R CMD check` treats a missing one as an
          ERROR -- which is what this job did until it was run against a real
          package.

          Turn it off when `asan-run` needs nothing beyond the package itself.
          The hard dependencies (Depends, Imports, LinkingTo) are still
          installed, because without them the package cannot be installed at
          all -- a header-only LinkingTo such as BH is the common case -- and
          for a package with none it costs a pak resolution and nothing more.
          Anything the image's repository has no binary for is built from
          source, and a dependency with compiled code is built instrumented,
          so the cost of `true` varies from seconds to the whole job depending
          on what you suggest.
        type: boolean
        required: false
        default: true

name: sanitizers

# Nothing here writes through the token, so `contents: read` is enough: the
# job reads the checkout, and artifact upload, the cache and a public ghcr.io
# image each need no declared scope.
#
# This is not only least privilege. `read-all` is wider than the `read` that a
# repository hands its GITHUB_TOKEN by default, and a called workflow cannot
# be granted more than its caller holds -- so requesting it here made every
# caller that did not declare permissions of its own fail with an unannotated
# `startup_failure`, two seconds in, before any job was created.
permissions:
  contents: read

jobs:
  # UndefinedBehaviorSanitizer only, and deliberately so.
  #
  # ASan instruments a package .so perfectly well, but that .so is dlopen'd
  # into an R that is not itself instrumented. Making that work needs
  # -shared-libasan, an LD_PRELOAD of the runtime into R, and
  # detect_leaks=0 -- R does not free on exit, so leak detection reports the
  # interpreter rather than the package. Half-configured, as this job was, it
  # reports nothing useful; fully configured it is fragile across R versions.
  # ASan belongs where the C code links into an actual executable: a fuzz
  # target or a standalone driver. UBSan has no such problem, because its
  # runtime can arrive by DT_NEEDED at dlopen time.
  #
  # One leg per compiler, because CRAN runs UBSan twice with different checks
  # (https://www.stats.ox.ac.uk/pub/bdr/memtests/README.txt):
  #
  #   clang   clang-UBSAN   -fsanitize=undefined -fno-sanitize=function
  #   gcc     gcc-UBSAN     -fsanitize=address,undefined,bounds-strict
  #
  # and each sees what the other cannot. gcc's bounds-strict checks a trailing
  # array against its declared size -- the `T items[1]` struct hack vendored C
  # is full of -- where clang treats any trailing array as flexible and says
  # nothing. mdbx 0.1.0 was green here on clang alone and was then reported by
  # CRAN's gcc-UBSAN for exactly that. The gcc leg is gcc-UBSAN without the
  # address part, which the asan job below adds.
  sanitizers:
    name: ubsan (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    strategy:
      fail-fast: false
      matrix:
        compiler: ${{ fromJson(inputs.ubsan-compilers) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # libomp-dev is not optional for an OpenMP package. R's Makeconf
      # puts -fopenmp in SHLIB_OPENMP_CFLAGS whatever the compiler, and
      # the clang leg overrides CC to clang -- which, unlike gcc with its
      # bundled libgomp, needs libomp installed separately. Without it a
      # package whose src/Makevars forwards SHLIB_OPENMP_CFLAGS fails to
      # build before UBSan observes anything: first `omp.h file not
      # found`, then `cannot find -lomp` at link. The asan job below does
      # not need this because its r-hub containers already ship it.
      - name: Install clang
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libomp-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r-version }}
          http-user-agent: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Reports are collected, not fatal at the first one.
      #
      # This job used to set halt_on_error=1, on the reasoning that UBSan
      # otherwise prints and carries on and R CMD check comes back green with
      # the findings unread. That reasoning holds; the cure was the wrong one.
      # A run that stops at the first finding shows one site per run, where
      # CRAN -- which never halts -- lists them all at once. And a finding in a
      # child process is only as visible as that child's stderr: a test that
      # spawns Rscript and compares its output fails with a UBSan diagnostic
      # as the "actual" value, and one that discards the output hides it.
      #
      # log_path sends every report from every instrumented process --
      # R CMD INSTALL, the examples, the tests and anything they spawn -- to
      # its own file, ubsan.<pid>. The build stays recoverable, so the whole
      # suite runs, and the last step fails the job if any file exists. That
      # is the same gate halt_on_error was, with nothing able to swallow it.
      #
      # Set in $GITHUB_ENV here rather than at the job, because the job's
      # `env` cannot see $RUNNER_TEMP, and before the first instrumented
      # process: installing a package runs its top-level code.
      - name: Configure UBSan reporting
        env:
          SUPPRESSIONS: ${{ inputs.ubsan-suppressions }}
        run: |
          set -euo pipefail
          reports="${RUNNER_TEMP}/ubsan-reports"
          mkdir -p "$reports"
          opts="print_stacktrace=1:log_path=${reports}/ubsan"
          if [ -n "$SUPPRESSIONS" ]; then
            opts="${opts}:suppressions=${GITHUB_WORKSPACE}/${SUPPRESSIONS}"
          fi
          echo "UBSAN_REPORTS=${reports}" >> "$GITHUB_ENV"
          echo "UBSAN_OPTIONS=${opts}" >> "$GITHUB_ENV"
          echo "UBSAN_OPTIONS=${opts}"

      # These MUST go in ~/.R/Makevars, not the environment.
      #
      # R's etc/Makeconf assigns CFLAGS, CXXFLAGS *and* LDFLAGS with `=`, and
      # make prefers a makefile assignment over an environment variable of
      # the same name. Setting them as env vars -- which is what this job did
      # -- therefore builds the package completely uninstrumented, and the
      # job passes without having checked anything at all.
      #
      # LDFLAGS matters as much as CFLAGS: instrumented objects linked into a
      # .so with no runtime fail at load with `undefined symbol: __ubsan_*`.
      # clang links no sanitizer runtime into a -shared output by default, so
      # -shared-libsan plus an rpath to the runtime directory is what lets
      # the .so resolve it at dlopen time. gcc links libubsan into a -shared
      # output as a DT_NEEDED on its own.
      #
      # The flags are CRAN's, per compiler. -fno-sanitize=function is on
      # CRAN's clang line: clang 17 extended that check to C, where it
      # reports any call through a function pointer cast to another type --
      # a pattern R's routine registration and a good deal of package code
      # rely on. gcc has no such check. -O2 rather than -O1 because it is
      # what CRAN compiles at, and inlining decides which function a report
      # names and whether a site is reached through a path the optimiser
      # kept, so matching the level is what makes a report here read like
      # CRAN's.
      #
      # The extra flags go to the compile flags only. The link step already
      # carries -fsanitize=undefined, and the additional groups are handled
      # by that same runtime, so they need nothing further at dlopen time.
      - name: Configure sanitizer flags
        env:
          COMPILER: ${{ matrix.compiler }}
          CLANG_EXTRA: ${{ inputs.extra-ubsan-checks }}
          GCC_EXTRA: ${{ inputs.gcc-ubsan-flags }}
        run: |
          set -euo pipefail
          case "$COMPILER" in
            clang)
              CC=clang CXX=clang++
              BASE="-g -O2 -fsanitize=undefined -fno-sanitize=function -fno-omit-frame-pointer"
              EXTRA="$CLANG_EXTRA"
              LINK="-fsanitize=undefined -shared-libsan -Wl,-rpath,$(clang -print-runtime-dir)"
              if [ -n "$GCC_EXTRA" ]; then
                echo "::notice::gcc-ubsan-flags skipped on the clang leg: these are GCC spellings"
              fi
              ;;
            gcc)
              CC=gcc CXX=g++
              BASE="-g -O2 -fsanitize=undefined,bounds-strict -fno-omit-frame-pointer"
              EXTRA="$GCC_EXTRA"
              LINK="-fsanitize=undefined"
              # GCC has no `integer`, `implicit-conversion` or `local-bounds`
              # group, so these would end the build at the first translation
              # unit with "unrecognized argument". Skipped, and said out loud:
              # a check that silently did not run is worse than one that did
              # not exist.
              if [ -n "$CLANG_EXTRA" ]; then
                echo "::notice::extra-ubsan-checks skipped on the gcc leg: these checks are clang-only"
              fi
              ;;
            *)
              echo "::error::ubsan-compilers: unknown compiler '${COMPILER}' (expected clang or gcc)"
              exit 1
              ;;
          esac
          FLAGS="${BASE}${EXTRA:+ ${EXTRA}}"
          mkdir -p ~/.R
          {
            echo "CC = ${CC}"
            echo "CXX = ${CXX}"
            echo "CFLAGS = ${FLAGS}"
            echo "CXXFLAGS = ${FLAGS}"
            # A package declaring CXX_STD is compiled with $(CXXnn) and
            # $(CXXnnFLAGS), not $(CXX)/$(CXXFLAGS). Setting only the latter
            # leaves such a package compiled by the image's g++ with no
            # instrumentation, and then linked with the sanitizer LDFLAGS
            # below -- the same "passes without checking anything" failure the
            # comment above describes, one variable over.
            #
            # Only the standards this R actually defines are overridden: R
            # reports C++ support through these variables, so declaring
            # CXX26 = clang++ where R ships it empty would claim a standard
            # the toolchain may not have.
            #
            # CXXnnSTD is deliberately left alone. Makeconf's -std=gnu++nn
            # suits clang++, and a zusmt trial run confirmed it: the compile
            # line came out as
            #   clang++ -std=gnu++20 ... -fsanitize=undefined -c init.cc
            # with the standard coming from the untouched CXX20STD.
            for std in 11 14 17 20 23 26; do
              [ -n "$(R CMD config CXX${std} 2>/dev/null || true)" ] || continue
              echo "CXX${std} = ${CXX}"
              echo "CXX${std}FLAGS = ${FLAGS}"
            done
            # C has no per-standard compiler variable -- it always uses
            # $(CC), set above -- but it does have per-standard flags, and a
            # package declaring C_STD would otherwise compile uninstrumented.
            for std in 90 99 17 23; do
              echo "C${std}FLAGS = ${FLAGS}"
            done
            echo "LDFLAGS = ${LINK}"
          } >> ~/.R/Makevars
          echo "--- ~/.R/Makevars ---"
          cat ~/.R/Makevars
          echo "--- ${CC} ---"
          "$CC" --version | head -1

      # Before anything runs instrumented, because the failure this prevents
      # is not a clear one: UBSan aborts the process it could not read the
      # file in, and during a check that surfaces as a test dying with no
      # explanation attached to it.
      - name: Check the suppressions file
        if: inputs.ubsan-suppressions != ''
        env:
          SUPPRESSIONS: ${{ inputs.ubsan-suppressions }}
        run: |
          set -euo pipefail
          if [ ! -f "${GITHUB_WORKSPACE}/${SUPPRESSIONS}" ]; then
            echo "::error::ubsan-suppressions: no such file: ${SUPPRESSIONS}"
            exit 1
          fi
          echo "--- ${SUPPRESSIONS} ---"
          cat "${GITHUB_WORKSPACE}/${SUPPRESSIONS}"

      # Verify the detector actually got built in, rather than trusting that
      # passing a flag made it so. This checks the *installed* .so, not the
      # build log: the log records the command that was meant to produce the
      # object, which is exactly what was wrong before.
      #
      # A package with no compiled code has nothing to instrument, and says
      # so rather than failing.
      - name: Install and verify instrumentation
        run: |
          set -euo pipefail
          if [ ! -d src ]; then
            echo "No src/ directory: nothing to instrument."
            exit 0
          fi
          LIB="$(mktemp -d)"
          R CMD INSTALL --library="$LIB" --preclean .
          found=0
          for so in "$LIB"/*/libs/*.so; do
            [ -e "$so" ] || continue
            found=1
            echo "== $so"
            # Dynamic and full symbol tables both, so this holds whether the
            # runtime is linked shared (handlers undefined, resolved at load)
            # or static (handlers defined in the object).
            if { nm -D "$so" 2>/dev/null; nm "$so" 2>/dev/null; } \
                 | grep -q '__ubsan'; then
              echo "   ok: UBSan runtime is referenced"
            else
              echo "   FAIL: no __ubsan* symbols; the build was not instrumented" >&2
              echo "   (flags must reach the compiler via ~/.R/Makevars, not the environment)" >&2
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No shared object was installed; nothing to verify." >&2
            exit 1
          fi

      - name: Apply caller environment
        if: inputs.env != ''
        run: |
          set -euo pipefail
          printf '%s\n' "${{ inputs.env }}" | while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
              *) echo "Ignoring malformed env line: $line" >&2 ;;
            esac
          done

      - name: Run R CMD check with sanitizers
        shell: Rscript {0}
        run: |
          if (Sys.getenv("_R_CHECK_CRAN_INCOMING_", "") == "") Sys.setenv("_R_CHECK_CRAN_INCOMING_" = "false")
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            build_args = c("--no-manual"),
            error_on = "warning"
          )

      # The gate. Runs whether or not the check passed: a finding that also
      # broke a test should still be reported as the finding, not only as
      # the test.
      #
      # Addresses are masked before counting, so one site reached a thousand
      # times is one line with a count -- the shape of CRAN's own reports.
      - name: Fail on UBSan reports
        if: always()
        run: |
          # Not -e: grep finding nothing is an answer here, not an error.
          set +e -u
          shopt -s nullglob
          reports=("${UBSAN_REPORTS}"/ubsan.*)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No UBSan reports."
            exit 0
          fi
          sites=$(grep -h 'runtime error:' "${reports[@]}" \
                    | sed -E 's/0x[0-9a-f]+/0x…/g' | sort | uniq -c | sort -rn)
          nsites=$(printf '%s\n' "$sites" | grep -c .)
          echo "### UBSan (${{ matrix.compiler }}): ${nsites} distinct site(s) in ${#reports[@]} process(es)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          { echo '```'; printf '%s\n' "$sites"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$sites"
          for f in "${reports[@]}"; do
            echo "::group::$(basename "$f")"
            cat "$f"
            echo "::endgroup::"
          done
          if [ "$nsites" -eq 0 ]; then
            echo "::error::UBSan wrote ${#reports[@]} report file(s) with no 'runtime error:' line; see the ubsan-${{ matrix.compiler }} artifact"
          else
            echo "::error::UBSan reported ${nsites} distinct site(s); see the step summary and the ubsan-${{ matrix.compiler }} artifact"
          fi
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubsan-${{ matrix.compiler }}
          path: ${{ runner.temp }}/ubsan-reports
          if-no-files-found: ignore

  # AddressSanitizer, in the R-hub containers -- which is the one place it
  # works for an R package, and the reason the job above does not attempt it.
  #
  # Everything the comment above says is true of an ordinary runner. These
  # images have already done all three things it lists:
  #
  #   clang-asan   R itself is a `devel-asan` build, so the interpreter is
  #                instrumented and interceptors are installed from process
  #                start.
  #   gcc-asan     libasan and libubsan are LD_PRELOADed from inside the `R`
  #                and `Rscript` wrapper scripts, with
  #                ASAN_OPTIONS='detect_leaks=0' set image-wide.
  #
  # Their R also compiles packages with -fsanitize=address,undefined from its
  # own Makeconf, so this job passes no sanitizer flags of its own -- the
  # opposite of the job above, where getting the flags into ~/.R/Makevars is
  # the whole difficulty. It still verifies, for the same reason: half
  # configured, a sanitizer finds nothing and says so in a way that reads
  # exactly like success.
  asan:
    if: inputs.asan && inputs.profile != 'quick'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(inputs.asan-containers) }}

    name: asan (${{ matrix.container }})

    container:
      image: ghcr.io/r-hub/containers/${{ matrix.container }}:latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # dependencies = TRUE, so Suggests are included: R CMD check reports a
      # missing Suggests as an ERROR, not a NOTE, and most of these images'
      # binary repository does not carry them. _R_CHECK_FORCE_SUGGESTS_ below
      # is the backstop for the ones that still fail to build instrumented.
      # Hard dependencies always: R CMD INSTALL refuses to build a package
      # whose Depends, Imports or LinkingTo are missing, so skipping them is
      # not "fewer dependencies", it is a job that cannot start. pak reads NA
      # as exactly those three fields.
      - name: Install dependencies
        env:
          ALL_DEPENDENCIES: ${{ inputs.asan-dependencies }}
        run: |
          set -eu
          if [ "$ALL_DEPENDENCIES" = "true" ]; then deps=TRUE; else deps=NA; fi
          Rscript -e "pak::local_install_deps('.', dependencies = ${deps}, upgrade = FALSE)"

      # After the dependencies, deliberately: they are built with the image's
      # own flags, and there is nothing to learn from a suggested package's
      # arithmetic.
      #
      # Appended to whatever user Makevars the image already uses, with `+=`,
      # for the reason r-cmd-check.yml's container-makevars step records at
      # length: R_MAKEVARS_USER *replaces* that file rather than adding to
      # it, and clang23 and friends configure their whole toolchain through
      # it. `=` here would throw the image's -fsanitize=address away and
      # leave a job named asan that checks for no memory errors -- the exact
      # shape of failure the verify step below exists to catch.
      #
      # GCC has no `integer`, `implicit-conversion` or `local-bounds` group,
      # so on gcc-asan these flags would end the job at the first
      # translation unit with "unrecognized command line option". Skipped
      # there, and said out loud: a check that silently did not run is worse
      # than one that did not exist.
      - name: Add the extra UBSan checks
        if: inputs.extra-ubsan-checks != ''
        env:
          EXTRA_CHECKS: ${{ inputs.extra-ubsan-checks }}
        run: |
          set -eu
          cc="$(R CMD config CC || true)"
          case "$cc" in
            *clang*) ;;
            *)
              echo "::notice::extra-ubsan-checks skipped on ${{ matrix.container }}:" \
                   "its compiler is '${cc}', and these checks are clang-only"
              exit 0
              ;;
          esac
          # CXXFLAGS alone does not reach a package that declares a C++
          # standard. R compiles such a package with $(CXXnn) and
          # $(CXXnnFLAGS), so flags appended to CXXFLAGS never appear on the
          # command line -- silently, with the job still green if the checks
          # were meant to add something and still red if they were meant to
          # switch something off. The runner job's Makevars step already
          # covers every standard for this reason; this is the container
          # equivalent.
          #
          # Appended, never assigned: the image's own -fsanitize= flags live
          # in these variables, and `=` would discard them.
          append_all() {
            target="$1"
            flags="$2"
            mkdir -p "$(dirname "$target")"
            {
              printf 'CFLAGS += %s\n' "$flags"
              printf 'CXXFLAGS += %s\n' "$flags"
              # Only the standards this R actually defines, so nothing here
              # claims a standard the toolchain does not have.
              for std in 11 14 17 20 23 26; do
                [ -n "$(R CMD config "CXX${std}" 2>/dev/null || true)" ] || continue
                printf 'CXX%sFLAGS += %s\n' "$std" "$flags"
              done
              # C has no per-standard compiler variable, but it does have
              # per-standard flags, and a package declaring C_STD would
              # otherwise compile without these.
              for std in 90 99 17 23; do
                printf 'C%sFLAGS += %s\n' "$std" "$flags"
              done
            } >> "$target"
            echo "--- appended to ${target} ---"
            cat "$target"
          }

          append_all "${R_MAKEVARS_USER:-${HOME}/.R/Makevars}" "$EXTRA_CHECKS"

      # The GCC counterpart, and the mirror image of the step above: that one
      # is skipped unless the compiler is clang, this one unless it is not.
      # Appended with `+=` for the same reason -- the image configures its
      # own toolchain through this file, and `=` would replace it.
      #
      # Order matters and is why this appends rather than rewrites: the
      # image's -fsanitize=... comes from Makeconf, these flags land after
      # it, and a later -fno-sanitize= is what switches one back off.
      - name: Add the GCC UBSan flags
        if: inputs.gcc-ubsan-flags != ''
        env:
          GCC_FLAGS: ${{ inputs.gcc-ubsan-flags }}
        run: |
          set -eu
          cc="$(R CMD config CC || true)"
          case "$cc" in
            *clang*)
              echo "::notice::gcc-ubsan-flags skipped on ${{ matrix.container }}:" \
                   "its compiler is '${cc}', and these are GCC spellings"
              exit 0
              ;;
          esac
          # CXXFLAGS alone does not reach a package that declares a C++
          # standard. R compiles such a package with $(CXXnn) and
          # $(CXXnnFLAGS), so flags appended to CXXFLAGS never appear on the
          # command line -- silently, with the job still green if the checks
          # were meant to add something and still red if they were meant to
          # switch something off. The runner job's Makevars step already
          # covers every standard for this reason; this is the container
          # equivalent.
          #
          # Appended, never assigned: the image's own -fsanitize= flags live
          # in these variables, and `=` would discard them.
          append_all() {
            target="$1"
            flags="$2"
            mkdir -p "$(dirname "$target")"
            {
              printf 'CFLAGS += %s\n' "$flags"
              printf 'CXXFLAGS += %s\n' "$flags"
              # Only the standards this R actually defines, so nothing here
              # claims a standard the toolchain does not have.
              for std in 11 14 17 20 23 26; do
                [ -n "$(R CMD config "CXX${std}" 2>/dev/null || true)" ] || continue
                printf 'CXX%sFLAGS += %s\n' "$std" "$flags"
              done
              # C has no per-standard compiler variable, but it does have
              # per-standard flags, and a package declaring C_STD would
              # otherwise compile without these.
              for std in 90 99 17 23; do
                printf 'C%sFLAGS += %s\n' "$std" "$flags"
              done
            } >> "$target"
            echo "--- appended to ${target} ---"
            cat "$target"
          }

          append_all "${R_MAKEVARS_USER:-${HOME}/.R/Makevars}" "$GCC_FLAGS"

      # The same check the runner job makes, for the same reason: a
      # suppressions path the runtime cannot read aborts whatever process was
      # given it.
      - name: Check the suppressions file
        if: inputs.ubsan-suppressions != ''
        env:
          SUPPRESSIONS: ${{ inputs.ubsan-suppressions }}
        run: |
          set -eu
          if [ ! -f "${GITHUB_WORKSPACE}/${SUPPRESSIONS}" ]; then
            echo "::error::ubsan-suppressions: no such file: ${SUPPRESSIONS}"
            exit 1
          fi
          echo "--- ${SUPPRESSIONS} ---"
          cat "${GITHUB_WORKSPACE}/${SUPPRESSIONS}"

      # --preclean matters. An object file left in src/ that is newer than its
      # source is reused, the sanitizer flags then reach only the link step,
      # and the result is a green job on a build with no instrumentation in
      # it. pkgload leaves exactly such objects behind.
      - name: Install the package
        run: |
          set -eu
          mkdir -p "${GITHUB_WORKSPACE}/lib"
          R CMD INSTALL --preclean --library="${GITHUB_WORKSPACE}/lib" .

      # The same check the job above makes, for the same reason, against the
      # other runtime. Kept inline rather than factored into a composite
      # action: a reusable workflow cannot reach a local action by relative
      # path, because `./` resolves against the *caller's* checkout, and
      # referring to it as pedrobtz/r-actions/...@v1 pins a version inside a
      # file that is itself versioned.
      - name: Verify instrumentation
        run: |
          set -eu
          if [ ! -d src ]; then
            echo "No src/ directory: nothing to instrument."
            exit 0
          fi
          found=0
          for so in "${GITHUB_WORKSPACE}"/lib/*/libs/*.so; do
            [ -e "$so" ] || continue
            found=1
            echo "== $so"
            if { nm -D "$so" 2>/dev/null; nm "$so" 2>/dev/null; } \
                 | grep -q '__asan'; then
              echo "   ok: ASan runtime is referenced"
            else
              echo "   FAIL: no __asan* symbols; the build was not instrumented" >&2
              echo "   The image's R is expected to compile packages with" >&2
              echo "   -fsanitize=address from its own Makeconf. Check that a" >&2
              echo "   package-level src/Makevars is not overriding CFLAGS." >&2
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No shared object was installed; nothing to verify." >&2
            exit 1
          fi

      - name: Apply caller environment
        if: inputs.env != ''
        env:
          CALLER_ENV: ${{ inputs.env }}
        run: |
          set -eu
          printf '%s\n' "$CALLER_ENV" | while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
              *) echo "Ignoring malformed env line: $line" >&2 ;;
            esac
          done

      # ASan aborts on a memory error, so a finding is usually a non-zero
      # exit. The grep is for the cases where it is not: a diagnostic from a
      # subprocess that R CMD check records as an ordinary test failure, or a
      # UBSan finding from the same build, which prints and carries on.
      #
      # `|| status=$?` rather than letting the shell abort, so the log is
      # printed before the job ends. A sanitizer job whose output was
      # swallowed is a job that taught nobody anything.
      - name: Run under the sanitizer
        env:
          R_LIBS: ${{ github.workspace }}/lib
          # No halt_on_error here, as in the runner job: this job reads the
          # log afterwards instead, and "runtime error:" in that pattern is
          # what makes a UBSan finding fail the job. Not log_path, unlike the
          # runner job: here UBSan runs inside the ASan runtime, log_path is a
          # flag the two share, and moving ASan's reports out of this log is a
          # change to try on its own rather than as a side effect.
          UBSAN_OPTIONS: >-
            print_stacktrace=1${{ inputs.ubsan-suppressions != ''
              && format(':suppressions={0}/{1}', github.workspace, inputs.ubsan-suppressions)
              || '' }}
          RUN_COMMAND: ${{ inputs.asan-run }}
          _R_CHECK_FORCE_SUGGESTS_: "false"
        run: |
          set -u
          status=0
          if [ -n "$RUN_COMMAND" ]; then
            sh -c "$RUN_COMMAND" > sanitizer.log 2>&1 || status=$?
          else
            R CMD build --no-build-vignettes --no-manual . > sanitizer.log 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then
              tarball=$(ls -t ./*.tar.gz | head -1)
              R CMD check --no-manual --no-build-vignettes "$tarball" \
                >> sanitizer.log 2>&1 || status=$?
              for out in ./*.Rcheck/*.Rout ./*.Rcheck/*.Rout.fail \
                         ./*.Rcheck/tests/*.Rout ./*.Rcheck/tests/*.Rout.fail; do
                [ -e "$out" ] || continue
                echo "----- $out -----" >> sanitizer.log
                cat "$out" >> sanitizer.log
              done
            fi
          fi
          cat sanitizer.log
          if grep -qE "AddressSanitizer|LeakSanitizer|runtime error:|SUMMARY: .*Sanitizer" sanitizer.log; then
            echo "::error::sanitizer reported a problem"
            exit 1
          fi
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asan-${{ matrix.container }}
          path: sanitizer.log
          if-no-files-found: ignore
