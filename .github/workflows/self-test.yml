# Everything else here is `workflow_call` only, so until now a pull request to
# this repository ran nothing at all. Both of the last two defects were found
# by a consuming package instead, long after release:
#
#   * every workflow asked for `permissions: read-all`, which rejects any
#     caller that does not declare permissions of its own, and disabled a
#     package's native checks for three months without ever reporting a
#     failure;
#   * `v1` stopped being moved and fell fourteen commits and four releases
#     behind main, so consumers pinned to it -- as the README tells them to
#     be -- received none of those releases.
#
# Neither needs an R package to detect, which matters: the reusable workflows
# check out the *caller's* repository and expect one, so calling them from
# here would fail for the wrong reason and prove nothing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

name: self-test

permissions:
  contents: read

jobs:
  workflows:
    name: workflow invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A virtualenv rather than `pip install`, because the runner's system
      # Python is externally managed and refuses to install into itself.
      - name: Check permissions are explicit and least-privilege
        run: |
          python3 -m venv /tmp/lint
          /tmp/lint/bin/pip install --quiet pyyaml
          /tmp/lint/bin/python tests/lint-workflows.py

  gate:
    name: changes gate decides labels, profile and files
    # A wrong answer from the gate fails nothing: it either skips a check
    # that should have run, or runs one that need not. Only a table of cases
    # notices either.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the gate through its cases
        run: |
          python3 -m venv /tmp/gate
          /tmp/gate/bin/pip install --quiet pyyaml
          PATH="/tmp/gate/bin:$PATH" bash tests/check-gate.sh

  report:
    name: fuzz findings are described and reported once each
    # A key that moves with line numbers files a duplicate issue every
    # night, and closing a finding on a green run hides a bug the fuzzer did
    # not happen to reach again. Neither fails anything visibly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the describe step and report.yml through their cases
        run: |
          python3 -m venv /tmp/report
          /tmp/report/bin/pip install --quiet pyyaml
          PATH="/tmp/report/bin:$PATH" bash tests/check-report.sh

  vendor:
    name: vendor guard asks for the manifest exactly when it should
    # Wrong in one direction, a legitimate patch edit goes red and people
    # learn to ignore the job; in the other, a hand edit to vendored code
    # goes green. Neither looks like a broken check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the PR step through its cases
        run: |
          python3 -m venv /tmp/vendor
          /tmp/vendor/bin/pip install --quiet pyyaml
          PATH="/tmp/vendor/bin:$PATH" bash tests/check-vendor.sh

  alloc-interposer:
    name: alloc-failure interposer is transparent
    # The one piece of C this repository ships. It sits in a heredoc inside
    # alloc-failure.yml, so nothing compiled it until a consumer's weekly run
    # -- which is how it shipped aborting every process it was preloaded into.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build it from the workflow and run programs under it
        run: bash tests/check-alloc-interposer.sh

  assurance:
    name: assurance check holds a package to its file
    # A checker that passes a claim nothing backs is worse than none: the
    # file then says a package is covered where it is not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the check through its cases
        run: |
          python3 -m venv /tmp/assurance
          /tmp/assurance/bin/pip install --quiet pyyaml
          PATH="/tmp/assurance/bin:$PATH" bash tests/check-assurance.sh

  native-reports:
    name: fuzz reach and mutation report a fixture's known gaps
    # Both reports exit 0 when wrong -- a reach table with no files, a
    # mutation summary of no mutants -- so only a fixture with a known
    # answer notices. This also proves Mull installs and runs on the image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang and llvm
        run: sudo apt-get update -q && sudo apt-get install -y -q clang llvm
      - name: Run both reports on the fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv /tmp/native
          /tmp/native/bin/pip install --quiet pyyaml
          PATH="/tmp/native/bin:$PATH" bash tests/check-native-reports.sh

  alloc-sweep:
    name: alloc-failure sweep fails on the package's crashes only
    # A wrong answer here either hides a package crash under
    # ignore-crash-pattern, or keeps the job red for the interpreter's bugs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the sweep step on a scripted workload
        run: |
          python3 -m venv /tmp/sweep
          /tmp/sweep/bin/pip install --quiet pyyaml
          PATH="/tmp/sweep/bin:$PATH" bash tests/check-alloc-sweep.sh

  major-tag:
    name: v1 tracks the newest release
    # Tags do not move on a pull request, so this would only ever report the
    # state of main -- and fail every open pull request between a merge and
    # the tag that follows it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the major tag is not stale
        run: bash tests/check-major-tag.sh v1
