on:
  workflow_call:
    inputs:
      skip-docs-only:
        description: >
          Skip every job here when a push or pull request changes
          documentation only: Markdown at the top level or under a dot
          directory (`.github/`, `.agents/`), `_pkgdown.yml`, and `pkgdown/`.
          Anything else runs as before, `man/`, `vignettes/` and the `.md`
          snapshots under `tests/` included. So does every case where the
          changed files cannot be listed: a new branch, a force-push, an API
          failure, a manual or scheduled run. See "Documentation-only
          changes" in the README.
        type: boolean
        required: false
        default: true
      timeout-minutes:
        description: >
          Job timeout in minutes. Valgrind runs the code on a synthetic CPU,
          so expect the suite to take tens of times longer than usual.
        type: number
        required: false
        default: 60
      profile:
        description: >
          `quick` skips the job. Anything else, including the default `full`,
          runs it. The same input, with the same meaning, as
          r-cmd-check.yml's.

          Valgrind runs the suite on a synthetic CPU, tens of times slower
          than usual. A pull request still gets UBSan from sanitizers.yml,
          and the heap errors and leaks only valgrind finds are caught by the
          full run once per merge.
        type: string
        required: false
        default: full
      valgrind-opts:
        description: >
          Valgrind options, delivered through VALGRIND_OPTS so they reach the
          valgrind that `R CMD check --use-valgrind` starts.

          The default turns on full leak checking, because R's own invocation
          does not. Without it a "definitely lost" finding arrives as a total
          with no stack -- "48 bytes in 1 blocks" and a note to rerun with
          --leak-check=full -- so the run that fails cannot say what leaked,
          and attributing it costs a second run of a job that already takes
          tens of minutes. A check that fails should explain itself on the
          run that fails.

          Setting this replaces the default rather than adding to it, so keep
          --leak-check=full when passing extra options. Pass a single space to
          turn it off.
        type: string
        required: false
        default: "--leak-check=full --track-origins=yes --num-callers=30"
      suppressions:
        description: >
          Path to a valgrind suppression file, relative to the repository root.
          Resolved against the workspace here rather than passed through
          valgrind-opts, because valgrind resolves a relative --suppressions
          against its own working directory -- which for the tests is the
          .Rcheck tests directory, not the checkout, so a caller cannot write a
          path that works.
        type: string
        required: false
        default: ""
      cppflags:
        description: >
          Extra preprocessor flags for this job's build only, appended to
          CPPFLAGS through ~/.R/Makevars. The case this exists for is
          -DENABLE_MEMCHECK: a vendored library that writes deliberately
          uninitialised page padding can then annotate those bytes for
          valgrind instead of having every commit reported.
        type: string
        required: false
        default: ""

name: valgrind

# Nothing here writes through the token, so `contents: read` is enough: the
# job reads the checkout, and artifact upload, the cache and a public ghcr.io
# image each need no declared scope.
#
# This is not only least privilege. `read-all` is wider than the `read` that a
# repository hands its GITHUB_TOKEN by default, and a called workflow cannot
# be granted more than its caller holds -- so requesting it here made every
# caller that did not declare permissions of its own fail with an unannotated
# `startup_failure`, two seconds in, before any job was created.
permissions:
  contents: read

jobs:
  # Skips the jobs below when a push or pull request changes documentation
  # only; see the `skip-docs-only` input. Every workflow it gates carries an
  # identical copy -- inline for the reason sanitizers.yml gives for not
  # factoring out a composite action -- and tests/lint-workflows.py keeps the
  # copies identical and the wiring complete.
  #
  # The gated jobs test `!cancelled()` in place of the implicit `success()`,
  # so this job failing, or being skipped, runs them rather than dropping
  # them. Only an explicit `docs-only=true` skips anything.
  changes:
    name: docs-only gate
    if: inputs.skip-docs-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Classify the changed files
        id: classify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
        run: |
          # Anything short of a complete list of changed files, every one of
          # them documentation, leaves this false and every job runs.
          docs_only=false
          trap 'echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"' EXIT

          case "$EVENT" in
            pull_request|pull_request_target)
              base=$PR_BASE head=$PR_HEAD ;;
            push)
              # `before` is all zeros for a new branch, and after a
              # force-push it may no longer exist.
              if [ "$FORCED" = true ] || [ -z "${BEFORE//0/}" ]; then
                echo "New branch or force-push: no diff to go by, so everything runs."
                exit 0
              fi
              base=$BEFORE head=$AFTER ;;
            *)
              echo "A $EVENT run has no changed files to go by, so everything runs."
              exit 0 ;;
          esac

          # The compare API rather than the pull request's file list, which
          # would need `pull-requests: read`: a scope the caller may not hold,
          # and asking for one is a startup_failure. Three dots diff from the
          # merge base, which for a pull request is exactly what it changes,
          # from its first commit on.
          # A rename is listed under its new name, with the old one in
          # previous_filename; both count, or `git mv R/x.R x.md` reads as a
          # documentation-only change.
          if ! files=$(gh api "repos/$REPO/compare/$base...$head" \
                         --jq '(.files // []) | length, (.[] | .filename, (.previous_filename // empty))'); then
            echo "Could not list the changed files, so everything runs."
            exit 0
          fi

          # compare lists at most 300 files and truncates silently past that.
          count=$(head -n 1 <<<"$files")
          if ! [[ $count =~ ^[0-9]+$ ]] || [ "$count" -eq 0 ] || [ "$count" -ge 300 ]; then
            echo "Cannot rely on a list of '$count' changed files, so everything runs."
            exit 0
          fi

          # Markdown in `tests/` is not documentation -- testthat snapshots
          # and fixtures are .md -- and neither is Markdown under `fuzz/` or
          # `inst/`, so .md counts only at the top level or under a dot
          # directory, which a package does not ship.
          all_docs=true
          while IFS= read -r f; do
            case "$f" in
              _pkgdown.yml|_pkgdown.yaml|pkgdown/*) kind=docs ;;
              .*/*.md) kind=docs ;;
              */*) kind=code ;;
              *.md) kind=docs ;;
              *) kind=code ;;
            esac
            printf '%-5s %s\n' "$kind" "$f"
            [ "$kind" = docs ] || all_docs=false
          done < <(tail -n +2 <<<"$files")

          if [ "$all_docs" = true ]; then
            docs_only=true
            echo "Documentation only: the jobs in this workflow are skipped." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  valgrind:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' && (inputs.profile != 'quick') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # check_dir is not cosmetic: rcmdcheck defaults to a temporary
      # directory, and the valgrind findings are in the .Rout files inside it.
      # Without a known path there is nothing for the next step to read.
      # ~/.R/Makevars is read after etc/Makeconf, so `+=` appends to R's own
      # CPPFLAGS rather than replacing them. Only for this build: the runner
      # is disposable.
      - name: Extra CPPFLAGS for this build
        if: inputs.cppflags != ''
        run: |
          mkdir -p ~/.R
          printf 'CPPFLAGS += %s\n' '${{ inputs.cppflags }}' >> ~/.R/Makevars
          cat ~/.R/Makevars

      # VALGRIND_OPTS is read by valgrind itself, ahead of its command line,
      # so this reaches the instance R starts without changing how R starts it.
      - name: Run R CMD check under valgrind
        shell: Rscript {0}
        env:
          VALGRIND_OPTS: >-
            ${{ inputs.valgrind-opts }}
            ${{ inputs.suppressions != ''
                && format('--suppressions={0}/{1}', github.workspace, inputs.suppressions)
                || '' }}
        run: |
          if (Sys.getenv("_R_CHECK_CRAN_INCOMING_", "") == "") Sys.setenv("_R_CHECK_CRAN_INCOMING_" = "false")
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran", "--use-valgrind"),
            build_args = c("--no-manual"),
            check_dir = "check",
            error_on = "warning"
          )

      # R CMD check does not fail on a valgrind finding. Valgrind writes to
      # the .Rout files, check reads them for R errors only, and the job goes
      # green with "definitely lost" in a log nobody opens. This is the same
      # gap sanitizers.yml closes by collecting UBSan's reports and failing on
      # any, and the same one R-hub's own container scripts close by grepping
      # the check output -- valgrind writes into the .Rout files it shares
      # with R, so grepping is the only way.
      #
      # "ERROR SUMMARY: 0 errors" is the ordinary line and must not match.
      - name: Scan for valgrind findings
        if: always()
        run: |
          set -eu
          logs=$(find check -name '*.Rout' -o -name '*.Rout.fail' 2>/dev/null || true)
          if [ -z "$logs" ]; then
            echo "No check output to scan." >&2
            exit 1
          fi
          # "are definitely lost in loss record" is the per-leak line that
          # --leak-check=full adds, and the stack follows it -- matching it is
          # what puts the stack in this log rather than only in the artifact.
          pattern='ERROR SUMMARY: [1-9]|definitely lost: [1-9]|indirectly lost: [1-9]|are definitely lost in loss record|Invalid read|Invalid write|Invalid free|Mismatched free|uninitialised value|Conditional jump or move depends'
          hits=$(grep -lE "$pattern" $logs || true)
          if [ -n "$hits" ]; then
            for f in $hits; do
              echo "----------------------------------------------------------"
              echo "$f"
              echo "----------------------------------------------------------"
              grep -E -A 12 "$pattern" "$f" || true
            done
            echo "::error::valgrind reported a memory error or leak"
            exit 1
          fi
          echo "valgrind reported no errors or leaks."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valgrind-check
          path: check
          if-no-files-found: ignore
