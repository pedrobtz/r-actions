on:
  workflow_call:
    inputs:
      vendor-dir:
        description: >
          Path to the vendored third-party sources, relative to the
          repository root. Changes under here are what the guard watches.

          Use `paths` instead when the vendored files are not a directory of
          their own.
        type: string
        required: false
        default: src/vendor
      paths:
        description: >
          What counts as vendored, one entry per line, overriding
          `vendor-dir` when set. An entry with no glob character is a
          directory prefix; anything else is matched as a shell glob against
          each changed path.

          This exists because vendored code is not always a directory. A
          package that bundles a C library and compiles it with its own
          sources has both in `src/`, on purpose -- R CMD SHLIB builds one
          flat directory, and a subdirectory costs an OBJECTS list and a
          GNU-make dependency. A directory prefix cannot say "the bundled
          files and not mine", so the guard either watches nothing or fires
          on every commit, and a guard that fires on everything is one people
          learn to ignore.

              paths: |
                src/cyaml*.c
                src/cyaml*.h
        type: string
        required: false
        default: ""
      verify:
        description: >
          Script that checks the vendored tree against its manifest, run
          from the repository root. Skipped if the file does not exist, so a
          package can adopt the PR guard before it has a verifier.
        type: string
        required: false
        default: tools/vendor/verify
      must-update:
        description: >
          Files a PR touching `vendor-dir` must also change, one path per
          line. The point is that vendored code is only ever updated through
          the fetch-and-record tooling: a hand edit that skips the manifest
          leaves a tree nobody can reproduce, and a manifest update that
          skips the checksums leaves one nobody can verify.
        type: string
        required: false
        default: |
          tools/vendor/manifest.tsv
          tools/vendor/checksums.sha256

name: vendor

# Nothing here writes through the token, so `contents: read` is enough: the
# job reads the checkout, and artifact upload, the cache and a public ghcr.io
# image each need no declared scope.
#
# This is not only least privilege. `read-all` is wider than the `read` that a
# repository hands its GITHUB_TOKEN by default, and a called workflow cannot
# be granted more than its caller holds -- so requesting it here made every
# caller that did not declare permissions of its own fail with an unannotated
# `startup_failure`, two seconds in, before any job was created.
permissions:
  contents: read

jobs:
  vendor:
    runs-on: ubuntu-latest
    name: vendored sources match manifest
    steps:
      # Full history: the guard diffs against the PR's base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the vendored tree
        run: |
          set -eu
          if [ ! -e "${{ inputs.verify }}" ]; then
            echo "No ${{ inputs.verify }}; skipping tree verification."
            exit 0
          fi
          chmod +x "${{ inputs.verify }}" 2>/dev/null || true
          "./${{ inputs.verify }}"

      # Reproducibility is the property being defended, and it is a property
      # of the commit, not of the working tree -- so it has to be checked on
      # the diff. A verifier alone passes happily on a hand-edited file whose
      # checksum was re-recorded to match it.
      - name: Vendored changes must update the manifest
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          base="origin/${{ github.base_ref }}"
          # Not --depth=1. A shallow fetch writes .git/shallow and grafts
          # the base ref, so its ancestry cannot be walked and `$base...HEAD`
          # has no merge base to resolve:
          #
          #   fatal: origin/main...HEAD: no merge base
          #
          # which is exit 128, and set -e fails the step before the guard has
          # looked at a single path. It is intermittent, which is worse than
          # being broken: it passes whenever the fork point happens to be at
          # or after the graft, and fails as soon as the base has moved ahead
          # of where the branch forked -- exactly what happens while a stack
          # of pull requests is being merged one at a time.
          #
          # The checkout above is already fetch-depth: 0, so a full fetch
          # costs nothing here. The unshallow branch is for a caller whose
          # checkout was shallow before this step ran: once .git/shallow
          # exists, an ordinary fetch does not remove it.
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            git fetch --no-tags --unshallow origin "${{ github.base_ref }}"
          else
            git fetch --no-tags origin "${{ github.base_ref }}"
          fi
          # Three dots, deliberately: the guard asks what this pull request
          # changed, not how it differs from a base that may have moved
          # underneath it. Two dots would blame a branch for vendored changes
          # someone else landed on the base while it was open.
          changed=$(git diff --name-only "$base"...HEAD)
          printf '%s\n' "$changed" > /tmp/vendor-changed-all

          # `paths` wins when set; otherwise the directory, as a prefix.
          if [ -n '${{ inputs.paths }}' ]; then
            printf '%s\n' '${{ inputs.paths }}' > /tmp/vendor-patterns
            what='the vendored paths'
          else
            dir='${{ inputs.vendor-dir }}'
            printf '%s\n' "${dir%/}" > /tmp/vendor-patterns
            what="$(printf '%s/' "${dir%/}")"
          fi

          # An entry with no glob character is a directory prefix; anything
          # else is a glob. `case` does the matching, so the pattern must stay
          # unquoted on the right -- quoting it would compare literals and the
          # guard would silently match nothing.
          : > /tmp/vendor-touched
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            while IFS= read -r pat; do
              [ -n "$pat" ] || continue
              hit=""
              case "$pat" in
                *[*?[]*) case "$file" in $pat) hit=1 ;; esac ;;
                *)       case "$file" in "${pat%/}"/*) hit=1 ;; esac ;;
              esac
              if [ -n "$hit" ]; then
                printf '%s\n' "$file" >> /tmp/vendor-touched
                break
              fi
            done < /tmp/vendor-patterns
          done < /tmp/vendor-changed-all

          if [ ! -s /tmp/vendor-touched ]; then
            echo "ok  no changes to $what in this PR"
            exit 0
          fi

          echo "This PR changes $what:"
          sed 's/^/  /' /tmp/vendor-touched

          # Read from a file, not a pipe: a `while` on the right of a pipe
          # runs in a subshell, so a failure recorded inside it is lost
          # unless it is propagated by hand -- and a guard that cannot fail
          # is the thing this workflow exists to avoid.
          printf '%s\n' "${{ inputs.must-update }}" > /tmp/vendor-required
          printf '%s\n' "$changed" > /tmp/vendor-changed
          missing=0
          while IFS= read -r want; do
            [ -n "$want" ] || continue
            if ! grep -qx "$want" /tmp/vendor-changed; then
              echo
              echo "FAIL vendored sources changed without updating $want."
              missing=1
            fi
          done < /tmp/vendor-required
          if [ "$missing" -ne 0 ]; then
            echo
            echo "     Vendored code is only ever updated through the fetch"
            echo "     and record tooling, so the tree stays reproducible."
            exit 1
          fi
          echo "ok  every required file was updated alongside"
