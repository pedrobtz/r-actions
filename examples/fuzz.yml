on:
  pull_request:
  schedule:
    # A long run weekly; nightly for a large parser under active work. The
    # corpus cache is what makes the short PR runs and this one add up to a
    # single campaign.
    - cron: "17 3 * * 0"

name: fuzz

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    uses: pedrobtz/r-actions/.github/workflows/fuzz.yml@v1
    with:
      harness: tools/fuzz/harness.c
      sources: src/*.c
      exclude-sources: |
        src/init.c
        src/zuyaml_*.c
      seed-corpus: tests/yaml-test-suite
      dictionary: tools/fuzz/yaml.dict
      max-total-time: ${{ github.event_name == 'schedule' && 1800 || 120 }}
      # Fail when the corpus reaches less than this share of the lines in
      # sources; set a little under the figure the first run reports.
      reach-floor: 0

  # A red scheduled run otherwise notifies only whoever last edited the cron
  # line. This files one issue per distinct finding, labelled fuzz, with the
  # sanitizer's report and the crashing input; it comments when the same
  # finding comes back, and reopens it if it was closed as fixed. A finding's
  # issue is closed by its fix, never by a green run.
  report:
    needs: fuzz
    # always(), so a failed run is reported; skipped means a docs-only change.
    if: ${{ always() && github.event_name == 'schedule' && needs.fuzz.result != 'skipped' }}
    permissions:
      issues: write
    uses: pedrobtz/r-actions/.github/workflows/report.yml@v1
    with:
      name: fuzz
      result: ${{ needs.fuzz.result }}
      finding: ${{ needs.fuzz.outputs.finding }}
      key: ${{ needs.fuzz.outputs.finding-key }}
      details: ${{ needs.fuzz.outputs.report }}
