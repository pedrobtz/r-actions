on:
  push:
    branches: [main, master]
  # `labeled`/`unlabeled` so that adding or removing a CI label (`full-ci`,
  # `ci:minimal`, `skip-ci:<workflow>`) reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The full set runs weekly and on demand:
  # `gh workflow run R-CMD-check.yml --ref main`.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Quick on pull requests and on pushes to main. Full on the weekly
      # schedule, on a manual dispatch, and on a pull request labelled
      # `full-ci`.
      profile: auto
